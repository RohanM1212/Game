<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Book Game</title>
<style>
:root{--bg:#120f0c;--paper:#f3e6c8;--ink:#2a1f14;--panel:#1d1813;--panel2:#282017;--line:#4a3b2a;--text:#f1e6d0;--dim:#b3a386;--acc:#e0a94a;--good:#7fd48a;--bad:#ff7a6a;--mag:#c79bff;--blue:#7fc4ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at top,#2a2016,#0d0a08 70%) fixed;color:var(--text);font-family:Georgia,"Times New Roman",serif}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
h1{font-size:clamp(36px,6vw,64px);margin:24px 0 4px;color:var(--acc);text-shadow:0 3px 0 #000,0 0 30px #e0a94a55;letter-spacing:2px;text-align:center}
h2{margin:8px 0 10px;color:var(--acc);text-align:center}
h3{margin:4px 0 6px;color:var(--acc);font-size:16px}
.sub{color:var(--dim);text-align:center;margin-bottom:14px;font-style:italic}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover:not([disabled]),button:focus-visible{border-color:var(--acc);outline:none;background:#342919}
button[disabled]{opacity:.4;cursor:default}
button.big{font-size:18px;padding:13px 18px;width:100%;text-align:left}
button.gold{border-color:var(--acc);color:var(--acc)}
input,select{font:inherit;background:#0d0a08;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus{outline:none;border-color:var(--acc)}
.col{display:flex;flex-direction:column;gap:10px;width:min(420px,100%)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.book{width:220px;height:300px;border-radius:6px 14px 14px 6px;padding:20px 16px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;border:none;box-shadow:inset 10px 0 0 #0004,0 8px 24px #000a;transition:transform .15s}
.book:hover{transform:translateY(-6px) rotate(-1deg)}
.book .bt{font-size:15px;color:#f8ecd0;font-style:italic;line-height:1.4}
.book .bi{font-size:64px;filter:drop-shadow(0 4px 6px #0008)}
.book .bn{font-size:12px;letter-spacing:3px;color:#f8ecd0aa}
.lv{width:min(1400px,100%);display:flex;flex-direction:column;gap:10px}
.topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.topbar .sp{flex:1}
.cols{display:grid;grid-template-columns:minmax(260px,340px) 1fr minmax(230px,280px);gap:10px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.scene .art{font-size:44px;text-align:center;line-height:1.2;margin:4px 0}
.scene .desc{font-size:14px;color:var(--dim);margin:6px 0}
.bar{height:14px;background:#0008;border-radius:7px;overflow:hidden;border:1px solid #0006;margin:3px 0 8px}
.bar>i{display:block;height:100%;border-radius:7px;transition:width .3s}
.lbl{display:flex;justify-content:space-between;font-size:13px}
.ent{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;margin:6px 0}
.ent .nm{font-weight:bold}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#0006;border:1px solid var(--line);color:var(--dim);margin:1px}
.tag.w{border-color:#5a8a4a;color:var(--good)}
.tag.r{border-color:#8a4a4a;color:var(--bad)}
.log{height:min(56vh,560px);overflow-y:auto;background:var(--paper);color:var(--ink);border-radius:6px 12px 12px 6px;padding:14px 16px;font-size:16px;line-height:1.5;box-shadow:inset 8px 0 12px #0003}
.log p{margin:0 0 8px}
.log .you{color:#5a3a1a;font-style:italic}
.log .nar{color:#2a1f14}
.log .eff{color:#1a5a2a;font-weight:bold;font-size:14px}
.log .bad{color:#9a2a1a;font-weight:bold;font-size:14px}
.log .note{color:#6a4ab0;font-size:14px}
.log .sys{color:#7a6a50;font-size:13px;text-align:center;border-top:1px dashed #b8a47c;padding-top:6px;margin-top:10px}
.log .big{font-size:20px;text-align:center;color:#8a4a0a;font-weight:bold}
.inbox{display:flex;gap:8px;margin-top:8px}
.inbox input{flex:1;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:13px;padding:4px 9px;border-radius:99px;background:#0006}
.chiplbl{font-size:11px;color:var(--dim);width:100%;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.turn{margin-top:8px;font-size:15px;color:var(--acc)}
.pcard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:8px}
.pcard.cur{border-color:var(--acc);box-shadow:0 0 16px #e0a94a44}
.pcard.ko{opacity:.5}
.pw{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.map{display:grid;gap:3px;margin:6px auto;width:max-content}
.cell{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:19px;background:#0007;border:1px solid #3a2e20}
.cell.seen{background:#2a2218}
.cell.vis{background:#3a3020}
.cell.me{border:2px solid var(--acc);box-shadow:0 0 10px var(--acc)}
.hgrid{display:grid;gap:2px;margin:6px auto;width:max-content}
.hcell{width:28px;height:28px;border-radius:4px;background:#f3f0e6;border:1px solid #d8d2c0;display:flex;align-items:center;justify-content:center;font-size:15px}
.hcell.vis{background:#e2dccb}
.hcell.me{background:#e0a94a}
.hcell.hurt{background:#e8b4a8}
.dirs{display:grid;grid-template-columns:repeat(3,44px);gap:4px;justify-content:center;margin:6px 0}
.dirs button{padding:6px 0;text-align:center}
.card{width:200px;min-height:170px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px}
.card .ci{font-size:38px}
.card .ct{font-weight:bold;font-size:16px}
.card .cd{font-size:13px;color:var(--dim)}
.price{color:var(--acc);font-weight:bold}
.wheel{width:240px;height:130px;margin:10px auto;border:3px solid var(--acc);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:54px;background:#0008;flex-direction:column}
.wheel small{font-size:16px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:9;pointer-events:none}
.toast{background:#2a2016ee;border:1px solid var(--acc);padding:8px 16px;border-radius:10px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.help li{margin:5px 0;line-height:1.5}
.small{font-size:13px;color:var(--dim)}
textarea{width:100%;height:80px;background:#0d0a08;color:var(--text);border:1px solid var(--line);border-radius:8px;font-family:monospace;font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;width:min(1000px,100%)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   THE BOOK GAME — imagination-driven text adventure. Offline, single file.
   You type what you do. The Narrator (this rules engine) reads your words,
   figures out your APPROACH, which POWERS/ITEMS/OBJECTS you use, the SHAPE
   and SIZE, and scores it. Traits give bonuses, never requirements.
   ===================================================================== */

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let rs = 1;
function srand(s) { rs = (s | 0) || 1; }
function srnd() { let t = (rs = (rs + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rnd = () => Math.random();
const pick = (a, r = rnd) => a[Math.floor(r() * a.length)];
function shuffle(a, r = rnd) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] !== undefined ? o[k] : '');

/* ---------------- approaches ---------------- */
const APS = ['force', 'trick', 'persuade', 'sneak', 'protect', 'speed', 'entertain', 'knowledge', 'heal'];
const AP = {
  force:     { n: 'Force',     i: '💥', ex: 'blast' },
  trick:     { n: 'Trick',     i: '🃏', ex: 'distract' },
  persuade:  { n: 'Persuade',  i: '🤝', ex: 'befriend' },
  sneak:     { n: 'Sneak',     i: '🥷', ex: 'sneak past' },
  protect:   { n: 'Protect',   i: '🛡️', ex: 'protect' },
  speed:     { n: 'Speed',     i: '💨', ex: 'dash' },
  entertain: { n: 'Entertain', i: '🎭', ex: 'perform' },
  knowledge: { n: 'Knowledge', i: '🔍', ex: 'study' },
  heal:      { n: 'Heal',      i: '💚', ex: 'heal' },
};
const AP_WORDS = {
  force: 'attack hit punch kick smash crush blast burn shoot strike slam destroy fight throw hurl stab slash bash zap shock explode bomb break beat charge tackle launch pummel whack crash drown fling pelt bombard knock obliterat demolish squash stomp sting bite scorch melt pierce impale incinerat electrocut',
  trick: 'trick distract fool lure lasso tie bind entangle bait fake decoy confuse mislead pretend prank disguise bluff blind misdirect scare spook frighten tease taunt dazzle trap swap switch steal pickpocket imitat mimic copy sabotag tangle trip',
  persuade: 'talk convince persuade negotiate befriend calm gift give offer bribe apolog reason ask beg plead compliment flatter charm promise share feed comfort reassure invite deal trade speech sooth pacif tame unite peace hug explain tell request inspire rally encourage vote campaign',
  sneak: 'sneak hide creep tiptoe quiet stealth invisib camouflag blend unseen crawl silent quietly lurk',
  protect: 'protect shield block defend barrier fortif dome armor shelter save catch hold brace bunker guard cushion secure',
  speed: 'run dash flee escape jump leap climb fly race rush dodge evade swing zoom sprint outrun glide surf ride vault hurry carry cross grab snatch chase deliver',
  entertain: 'perform dance sing juggle joke show entertain play amuse puppet parade party celebrate laugh funny story impress concert circus cheer magic comedy clown act',
  knowledge: 'look search study examine inspect analyz read listen think investigat scout sense smell remember learn figure track observe detect identify plan check feel watch clue research understand discover question',
  heal: 'heal cure mend restore revive bandage recover patch treat medicine fix nurse regenerat',
};
/* ---------------- forms & scale ---------------- */
const FORMS = {
  wall:   { kind: 'lasting', ap: 'protect',  w: 'wall barrier dome fence fortress shield cage prison net' },
  trap:   { kind: 'trap',    ap: 'trick',    w: 'trap pit snare web mine tripwire' },
  beam:   { kind: 'focus',   ap: 'force',    w: 'beam ray laser spear arrow needle lance bullet blade sword whip dart' },
  ball:   { kind: 'focus',   ap: 'force',    w: 'ball orb bomb fireball boulder sphere projectile missile cannonball' },
  wave:   { kind: 'area',    ap: 'force',    w: 'wave flood rain storm tornado explosion ring shockwave cloud fog mist blizzard avalanche quake earthquake tsunami burst nova hail downpour firestorm eruption whirlpool vortex' },
  army:   { kind: 'summon',  ap: 'trick',    w: 'army swarm horde clone minion golem creature puppet double soldier servant pet buddy companion' },
  armor:  { kind: 'self',    ap: 'protect',  w: 'armor suit wings cloak skin aura boots fists gloves' },
  bridge: { kind: 'utility', ap: 'speed',    w: 'bridge ladder stairs path ramp tunnel platform slide raft boat catapult slingshot zipline' },
  show:   { kind: 'art',     ap: 'entertain',w: 'sculpture statue display painting fireworks lightshow costume mural performance song symphony' },
};
const SCALES = {
  small:    { mul: .7,  cost: 2,  lvl: 1, w: 'small little mini quick gentle subtle tiny' },
  normal:   { mul: 1,   cost: 4,  lvl: 1, w: '' },
  big:      { mul: 1.4, cost: 7,  lvl: 2, w: 'big large strong powerful wide tall thick mighty' },
  huge:     { mul: 1.9, cost: 11, lvl: 4, w: 'huge massive enormous gigantic mega immense towering monstrous' },
  colossal: { mul: 2.6, cost: 16, lvl: 6, w: 'colossal ultimate infinite entire everything apocalyp titanic planet universe endless biggest maximum godlike' },
};
const SCALE_ORDER = ['small', 'normal', 'big', 'huge', 'colossal'];

/* ---------------- powers ----------------
   apt order: force trick persuade sneak protect speed entertain knowledge heal (0-3) */
const POWERS = {};
function PW(id, name, icon, tier, traits, apt, kw, adj, noun, desc) {
  const a = apt.split(' ').map(Number), o = {};
  APS.forEach((k, i) => o[k] = a[i]);
  POWERS[id] = { id, name, icon, tier, traits: traits.split(' '), apt: o, kw: kw.split(' '), adj, noun, desc };
}
// starters
PW('fire', 'Fire', '🔥', 'start', 'fire light', '3 1 1 0 2 1 2 0 1', 'fire flame burn blaze ember heat inferno fireball torch scorch ignit lava smoke', 'Blazing', 'Flame', 'Classic. Hot. Dangerous.');
PW('water', 'Water', '💧', 'start', 'water', '2 1 1 1 2 2 1 0 2', 'water wave splash flood soak drench stream tide geyser puddle', 'Tidal', 'Wave', 'Flows around any problem.');
PW('wind', 'Wind', '🌪️', 'start', 'air sound', '2 2 0 1 2 3 1 1 0', 'wind air gust breeze tornado whirlwind blow cyclone hurricane', 'Howling', 'Gale', 'Push, lift, and whoosh.');
PW('earth', 'Earth', '🪨', 'start', 'earth', '3 1 0 1 3 0 1 1 0', 'earth rock stone boulder ground dirt mud sand quake pillar pebble', 'Stony', 'Boulder', 'Solid as a rock.');
PW('lightning', 'Lightning', '⚡', 'start', 'electric light', '3 1 0 0 1 3 2 1 0', 'lightning electric shock zap thunder spark volt static', 'Crackling', 'Bolt', 'Fast and loud.');
PW('plants', 'Plants', '🌿', 'start', 'plant life', '1 2 1 2 2 1 1 1 2', 'plant vine root tree flower thorn grass leaf seed moss bloom forest', 'Blooming', 'Vine', 'Grow anything green.');
PW('ice', 'Ice', '❄️', 'start', 'ice water', '2 1 0 1 3 1 2 0 1', 'ice frost freeze snow cold chill frozen icicle glacier', 'Frozen', 'Icicle', 'Cool under pressure.');
PW('light', 'Light', '🌟', 'start', 'light holy', '1 2 1 0 2 1 3 2 2', 'light shine glow radiant flash sun holy bright dazzl', 'Radiant', 'Glow', 'Brilliant and kind.');
PW('shadow', 'Shadow', '🌑', 'start', 'dark mind', '1 3 0 3 1 1 1 1 0', 'shadow dark darkness shade night gloom', 'Shadowy', 'Shade', 'Hide in plain sight.');
PW('strength', 'Super Strength', '💪', 'start', 'physical', '3 0 1 0 2 2 2 0 0', 'strength strong muscle flex lift', 'Mighty', 'Fist', 'Lift anything. Punch everything.');
// cheap wheel — weird & specific
PW('pigeons', 'Talk to Pigeons', '🐦', 'common', 'animal air', '1 2 1 1 0 1 2 3 0', 'pigeon pigeons bird birds flock coo', 'Feathered', 'Flock', 'They know EVERYTHING that happens in town.');
PW('chair', 'Summon One Chair', '🪑', 'common', 'wood physical', '1 1 1 0 2 0 2 0 1', 'chair seat stool furniture', 'Seated', 'Chair', 'Exactly one chair. A good one, though.');
PW('slippery', 'Mildly Slippery', '🧼', 'common', 'slippery', '0 2 0 2 1 3 1 0 0', 'slip slippery slide grease soap slick', 'Slick', 'Slip', 'Things near you get a bit slippy.');
PW('sneeze', 'Mighty Sneeze', '🤧', 'common', 'air sound', '2 2 0 0 1 1 2 0 0', 'sneeze achoo snot', 'Sneezing', 'Achoo', 'A sneeze with the force of a small storm.');
PW('bread', 'Bread', '🍞', 'common', 'food soft', '0 2 2 0 2 0 1 0 2', 'bread loaf toast baguette crumb dough sandwich bun', 'Crusty', 'Loaf', 'You can make bread. Any bread.');
PW('pitch', 'Perfect Pitch', '🎵', 'common', 'sound', '1 1 2 0 0 0 3 2 1', 'sing song note music pitch voice melody hum whistle', 'Melodic', 'Note', 'Your voice is flawless.');
PW('rubber', 'Rubber Body', '🧽', 'common', 'elastic physical', '1 1 0 1 2 3 2 0 0', 'rubber stretch bounce elastic bouncy', 'Bouncy', 'Stretch', 'Boing.');
PW('glitter', 'Glitter', '💖', 'common', 'light chaos', '0 2 2 1 0 1 3 0 0', 'glitter sparkle shiny glam', 'Sparkly', 'Glitter', 'It gets everywhere. Forever.');
PW('tiny', 'Shrink', '🐜', 'common', 'size', '0 2 0 3 0 2 1 2 0', 'shrink tiny miniature', 'Tiny', 'Speck', 'Become very, very small.');
PW('bubbles', 'Bubble Blowing', '🫧', 'common', 'water air', '0 2 1 1 2 1 2 0 1', 'bubble bubbles foam', 'Bubbly', 'Bubble', 'Bubbles of any size.');
PW('grandma', "Grandma's Cooking", '🥧', 'common', 'food social life', '0 1 3 0 0 0 2 0 3', 'cook pie soup cookie cookies food meal feast stew grandma bake casserole', 'Homemade', 'Pie', 'Nobody can stay angry after eating it.');
PW('magnet', 'Magnet Hands', '🧲', 'common', 'metal', '2 2 0 0 1 1 1 2 0', 'magnet magnetic metal iron steel', 'Magnetic', 'Magnet', 'Metal comes to you.');
PW('goo', 'Sticky Goo', '🟢', 'common', 'sticky slime', '2 2 0 1 3 0 1 0 0', 'goo slime sticky ooze gunk', 'Gooey', 'Glob', 'Gross. Effective.');
PW('balloons', 'Balloon Animals', '🎈', 'common', 'air animal toy', '0 2 2 0 1 1 3 0 0', 'balloon balloons inflat', 'Inflatable', 'Balloon', 'Twist twist squeak. It is a giraffe.');
PW('bees', 'Bees', '🐝', 'common', 'animal poison', '2 2 0 0 1 1 2 1 1', 'bee bees sting hive buzz honey', 'Buzzing', 'Swarm', 'Bees. Just... bees.');
PW('smell', 'Super Smell', '👃', 'common', 'sense', '0 2 1 2 0 1 1 3 1', 'smell sniff nose scent stink', 'Sniffing', 'Nose', 'You can smell lies. And soup.');
PW('voice', 'Very Convincing Voice', '🗣️', 'common', 'mind sound social', '0 2 3 0 0 0 2 1 0', 'voice speech speak charm', 'Silver-tongued', 'Voice', 'People tend to agree with you.');
PW('dance', 'Unstoppable Dance', '💃', 'common', 'physical chaos', '1 2 1 0 0 2 3 0 0', 'dance dancing twirl spin moonwalk', 'Groovy', 'Dance', 'You cannot stop dancing. Neither can others.');
PW('duck', 'One Duck', '🦆', 'common', 'animal water', '1 2 1 1 1 1 2 2 0', 'duck quack', 'Quacking', 'Duck', 'You have a duck. The duck is loyal.');
// fancy wheel — rare & epic
PW('necro', 'Necromancy', '💀', 'rare', 'death dark summon', '3 2 0 1 2 0 2 1 1', 'necromancy undead zombie skeleton bone bones corpse dead raise ghost grave', 'Undying', 'Skeleton', 'Raise what has fallen. Better with corpses around.');
PW('gravity', 'Gravity', '🌌', 'rare', 'gravity', '3 2 0 1 2 2 1 1 0', 'gravity heavy weightless float crush orbit', 'Crushing', 'Well', 'Up is a suggestion.');
PW('time', 'Time Skip', '⏳', 'rare', 'time', '1 2 0 2 2 3 1 2 1', 'time rewind pause clock skip slow', 'Timeless', 'Moment', 'Skip a few seconds. Or back.');
PW('shape', 'Shapeshift', '🦎', 'rare', 'animal illusion', '2 3 2 2 1 2 2 1 0', 'shapeshift transform become morph shape', 'Shifting', 'Form', 'Become anything with a body.');
PW('weather', 'Weather Control', '⛈️', 'rare', 'water air electric', '3 1 1 1 2 1 2 1 1', 'weather storm rain cloud hail sunshine snow', 'Stormy', 'Storm', 'Your mood is the forecast.');
PW('tk', 'Telekinesis', '🧠', 'rare', 'mind physical', '3 2 0 1 2 2 2 1 0', 'telekine levitat psychic mind', 'Psychic', 'Grip', 'Move things with your mind.');
PW('illusion', 'Illusions', '🎭', 'rare', 'illusion light', '0 3 2 2 1 1 3 1 0', 'illusion hallucinat mirage image', 'Phantom', 'Mirage', 'Make anyone see anything.');
PW('mindread', 'Mind Reading', '🔮', 'rare', 'mind', '0 2 3 1 0 0 1 3 1', 'mind thought telepath', 'Knowing', 'Thought', 'Everyone is an open book.');
PW('portals', 'Portals', '🌀', 'rare', 'space', '1 3 0 2 2 3 2 1 0', 'portal teleport warp gateway', 'Warping', 'Portal', 'Here. Now there.');
PW('giant', 'Giant Growth', '🗿', 'rare', 'size physical', '3 0 1 0 3 1 2 0 0', 'giant grow growth', 'Towering', 'Giant', 'Grow to enormous size.');
PW('healing', 'Healing Touch', '💚', 'rare', 'life holy', '0 0 2 0 2 0 1 1 3', 'touch cure life mend', 'Healing', 'Touch', 'Fix what is broken.');
PW('luck', 'Absurd Luck', '🍀', 'rare', 'chaos luck', '1 2 1 2 1 1 2 1 1', 'luck lucky chance coin', 'Lucky', 'Fluke', 'Things just... work out. Every roll is good.');
PW('duckarmy', 'Duck Army', '🦆', 'epic', 'animal water chaos', '2 3 2 1 2 1 3 1 0', 'ducks quack', 'Quacking', 'Legion', 'Five hundred ducks. They await orders.');
PW('blackhole', 'Black Hole', '🕳️', 'epic', 'gravity space dark', '3 2 0 1 2 1 1 1 0', 'singularity hole void', 'Voidborn', 'Singularity', 'Pocket-sized, very hungry.');
PW('dragon', 'Dragon Form', '🐉', 'epic', 'fire animal air', '3 1 2 0 2 2 2 0 0', 'dragon wings roar', 'Draconic', 'Dragon', 'Become a dragon. Obviously.');
const STARTERS = Object.values(POWERS).filter(p => p.tier === 'start').map(p => p.id);
const COMMONS = Object.values(POWERS).filter(p => p.tier === 'common').map(p => p.id);
const RARES = Object.values(POWERS).filter(p => p.tier === 'rare').map(p => p.id);
const EPICS = Object.values(POWERS).filter(p => p.tier === 'epic').map(p => p.id);
const SPECIAL_FUSIONS = {
  'bread+fire': ['Toast Lord', '🍞'], 'necro+pigeons': ['Zombie Flock', '🧟'], 'chair+gravity': ['Falling Furniture', '🪑'],
  'lightning+water': ['Storm Surge', '🌩️'], 'fire+wind': ['Firestorm', '🌋'], 'ice+water': ['Glacier Tide', '🧊'],
  'earth+plants': ['Living Forest', '🌳'], 'light+shadow': ['Eclipse', '🌗'], 'bees+pitch': ['Buzz Choir', '🐝'],

/* ---------------- level generation ---------------- */
function genLevel(entry, seed) {
  srand(seed);
  if (entry.t === 'host') return genHost(seed);
  const th = THEMES[R.book], w = R.page <= 2 ? 5 : 6, h = w;
  const cells = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) cells.push({ t: 'empty', seen: false, vis: false, done: false, place: pick(th.places, srnd), objs: shuffle(th.objs, srnd).slice(0, 2).map(o => ({ n: o[0], i: o[1], traits: o[2].split(' ') })) });
  const edge = [];

  const [gx, gy] = pick(far, srnd);
  const C = (x, y) => cells[y * w + x];
  C(gx, gy).t = 'goal';
  const free = shuffle(cells.map((c, i) => i).filter(i => i !== sy * w + sx && i !== gy * w + gx), srnd);
  const put = (t, n) => { for (let k = 0; k < n && free.length; k++) cells[free.pop()].t = t; };

  logL(L, 'big', `📖 ${th.name} — Page ${R.page}`);
  logL(L, 'nar', `You open your eyes in ${C(sx, sy).place}. Somewhere in this land waits ${goalName}. Explore to find it.`);
  logL(L, 'sys', 'Move with the arrow buttons or type "go north". Type anything creative when you meet trouble.');

}
function revealAround(L, x, y, r) { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < L.w && ny < L.h && Math.abs(dx) + Math.abs(dy) <= r) L.cells[ny * L.w + nx].seen = true; } }

/* ---------------- parsing ---------------- */
const tokenize = t => t.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').replace(/'/g, '').split(/\s+/).filter(Boolean);
const SUF = new Set(['s', 'es', 'ed', 'd', 'ing', 'er', 'ers', 'ly', 'y', 'ies', 'ied', 'ion', 'ions', 'ment', 'ness', 'ful', 'en', 'ic', 'ish', 'ity']);
const SUF_E = new Set(['e', 'es', 'ed', 'ing', 'le', 'ly', 'ility', 'ize', 'ise', 'ized', 'ation', 'ication', 'able', 'sis', 'tic', 'ion', 'ions', 'or', 'ors', 'y', 'ies', 'ied', 'ive']);

    if (SUF.has(rest)) return true;

  if (key.endsWith('e') && key.length >= 4 && tok.startsWith(key.slice(0, -1))) return ['ing', 'ed', 'er', 'ers'].includes(tok.slice(key.length - 1)); // dance -> dancing

const anyWm = (toks, keys) => toks.some(t => keys.some(k => wm(t, k)));
const AP_KEYS = Object.fromEntries(APS.map(a => [a, AP_WORDS[a].split(' ')]));
const FORM_KEYS = Object.fromEntries(Object.entries(FORMS).map(([k, f]) => [k, f.w.split(' ')]));
const SCALE_KEYS = Object.fromEntries(Object.entries(SCALES).map(([k, s]) => [k, s.w ? s.w.split(' ') : []]));
const ALL_SCALE = new Set(Object.values(SCALES).flatMap(s => s.w ? s.w.split(' ') : []));
const DIRS = { north: 'n', n: 'n', up: 'n', forward: 'n', forwards: 'n', south: 's', s: 's', down: 's', back: 's', backward: 's', backwards: 's', east: 'e', e: 'e', right: 'e', west: 'w', w: 'w', left: 'w' };
const nameWords = n => n.toLowerCase().split(/[^a-z]+/).filter(w => w.length >= 3 && !['the', 'and', 'with', 'one'].includes(w)).map(w => w.replace(/s$/, ''));

function parse(text, p, C) {
  const toks = tokenize(text);
  const P = { text, toks, ap: null, powers: [], items: [], objs: [], form: null, formWord: '', scale: 'normal', target: null, ally: null, dir: null, move: false, rest: false };
  for (const t of toks) if (DIRS[t]) { P.dir = DIRS[t]; break; }
  const mv = toks.some(t => ['go', 'move', 'walk', 'head', 'step', 'travel'].includes(t));
  P.move = !!P.dir && (toks.length <= 2 || (mv && toks.length <= 5));
  // approach
  let best = 0;
  APS.forEach(a => {
    let sc = 0;
    toks.forEach((t, i) => { if (!ALL_SCALE.has(t) && AP_KEYS[a].some(k => wm(t, k))) sc += 1 + Math.max(0, .4 - i * .03); });
    if (sc > best) { best = sc; P.ap = a; }
  });
  // scale
  for (const s of ['colossal', 'huge', 'big', 'small']) if (anyWm(toks, SCALE_KEYS[s])) { P.scale = s; break; }

  p.powers.forEach((pw, idx) => { const d = pdef(pw); if (P.powers.length < 2 && (anyWm(toks, d.kw) || anyWm(toks, nameWords(d.name)))) P.powers.push(idx); });
  if (!P.powers.length && toks.some(t => ['power', 'powers', 'ability', 'magic', 'abilities'].includes(t))) P.powers.push(0);
  
  // items
  p.items.forEach((it, idx) => { if (it.uses > 0 && anyWm(toks, ITEMS[it.id].kw.split(' ').concat(nameWords(ITEMS[it.id].n)))) P.items.push(idx); });
  // scene objects
  const objs = C ? C.objs : [];
  objs.forEach((o, idx) => { if (P.objs.length < 2 && anyWm(toks, nameWords(o.n))) P.objs.push(idx); });
  // targets
  if (C) {
    C.threats.forEach(t => { if (!P.target && t.hp > 0 && anyWm(toks, nameWords(t.n))) P.target = { type: 'threat', t }; });
    if (!P.target && C.boss) {
      const b = C.boss, bw = nameWords(b.n).concat(['boss']);
      if (b.g === 'twins') { if (anyWm(toks, ['sun'])) P.target = { type: 'boss', which: 1 }; else if (anyWm(toks, ['moon'])) P.target = { type: 'boss', which: 2 }; }
      if (!P.target && anyWm(toks, bw)) P.target = { type: 'boss' };
    }
    if (!P.target && C.kind === 'obj' && anyWm(toks, OBJ[C.obj].kw.split(' '))) P.target = { type: 'main' };
    if (!P.target && C.kind === 'obs' && anyWm(toks, nameWords(C.obs.n))) P.target = { type: 'main' };

  const nameToks = new Set();
  if (C) { C.threats.forEach(t => nameWords(t.n).forEach(w => nameToks.add(w))); C.objs.forEach(o => nameWords(o.n).forEach(w => nameToks.add(w))); if (C.boss) nameWords(C.boss.n).forEach(w => nameToks.add(w)); }

  if (!P.powers.length) { const own = new Set(p.powers.map(pw => pw.id)); const tk = toks.filter(t => !isName(t) && !APS.some(ap => AP_KEYS[ap].some(k => wm(t, k)))); const m = Object.values(POWERS).find(d => !own.has(d.id) && anyWm(tk, d.kw)); if (m) P.notOwned = m.name; }

  P.rest = !P.ap && toks.some(t => ['rest', 'wait', 'meditate', 'breathe', 'nap', 'sleep', 'recharge'].includes(t)) || (toks.length <= 3 && toks.some(t => ['rest', 'wait', 'meditate', 'recharge'].includes(t)));

    else if (P.items.some(i => p.items[i].id === 'potion')) P.ap = 'heal';
    else if (P.target && (P.target.type === 'threat' || P.target.type === 'boss') && (P.powers.length || P.items.length || P.objs.length)) P.ap = 'force';
    else if (P.powers.length && toks.length >= 3) { const d = pdef(p.powers[P.powers[0]]); P.ap = APS.slice().sort((a, b) => d.apt[b] - d.apt[a])[0]; P.guessed = true; }
  }
  return P;
}

/* ---------------- scoring ---------------- */
function traitsOf(p, P, C) {

function bossWorld(C, targets) {

  if (b.tele) {
    const heavy = Math.round(b.dmg * 2.4);
    log('big', `💥 ${b.n} unleashes ${HEAVY[g] || 'its ultimate attack'}!`);
    targets().forEach(i => { const d = hurtP(i, heavy, 'heavy'); log('bad', d ? `${esc(R.players[i].name)} −${d} HP` : `${esc(R.players[i].name)} avoids it completely!`); });

    if (C.round % 3 === 0) b.tele = 1;

  bossAnnounce(C);
}

  critic: 'Tonight the Host is a CRITIC. He only truly enjoys certain kinds of acts. Figure out his taste.',
  sleeper: 'The Host is ASLEEP. Follow the snoring. Keep the Noise down — if he wakes, he\'ll be grumpy. Inspecting the floor reveals traps.',

  const i = R.shopTab, p = R.players[i], w = wallet(p);
  const tabs = R.players.map((q, k) => q.out ? '' : `<button data-a="tab" data-v="${k}" class="${k === i ? 'on' : ''}" style="border-left:4px solid ${q.color}">${esc(q.name)}</button>`).join('');
  const pws = p.powers.map((pw, k) => { const d = pdef(pw), c = upCost(pw); return `<div class="ent"><div class="lbl"><span class="nm">${d.icon} ${d.name} <span class="tag">Lv ${pw.lvl}</span></span><button data-a="upg" data-v="${k}" ${w.gold < c || pw.lvl >= 10 ? 'disabled' : ''}>⬆️ ${pw.lvl >= 10 ? 'MAX' : c + '🪙'}</button></div><span class="small">${d.desc}</span> ${d.traits.map(t => `<span class="tag">${t}</span>`).join('')}<br><span class="small">Unlocks at Lv2: big · Lv4: huge · Lv6: colossal</span></div>`; }).join('');
  const items = R.shopItems.map(id => { const it = ITEMS[id]; return `<button class="card" data-a="buy" data-v="${id}" ${w.gold < it.cost ? 'disabled' : ''}><div class="ci">${it.i}</div><div class="ct">${it.n}</div><div class="cd">${it.d}</div><div class="small">×${it.uses} uses · ${it.traits.join(', ') || '—'}</div><div class="price">${it.cost} 🪙</div></button>`; }).join('');
  const fs = UI.fuseSel.map(k => p.powers[k]).filter(Boolean);
  const fPrev = fs.length === 2 ? fusionPreview(fs[0], fs[1]) : null;
  const pend = UI.pendingPower;
  app.innerHTML = `<h2>🛒 The Shop</h2><div class="sub">${R.mode === 'coop' ? 'Shared gold: ' : ''}<b style="color:var(--acc)">🪙 ${w.gold}</b>${R.mode === 'versus' ? ` (${esc(p.name)}'s gold)` : ''}</div>
  ${R.players.filter(q => !q.out).length > 1 ? `<div class="tabs">${tabs}</div>` : ''}
  <div class="row" style="align-items:flex-start">
   <div class="panel" style="width:min(420px,100%)"><h3>⚡ ${esc(p.name)}'s Powers (${p.powers.length}/4)</h3>${pws}
     <h3 style="margin-top:12px">🧬 Fuse two powers — 60🪙</h3><div class="small">Combine two powers into one new power with both sets of traits and the best of both. Uses up both.</div>
     <div class="row" style="justify-content:flex-start;margin:6px 0">${p.powers.map((pw, k) => `<button data-a="fsel" data-v="${k}" class="${UI.fuseSel.includes(k) ? 'gold' : ''}">${pdef(pw).icon} ${pdef(pw).name}</button>`).join('')}</div>
     ${fPrev ? `<div class="ent">➡️ <b>${fPrev.icon} ${fPrev.name}</b> — ${fPrev.traits.join(', ')}</div>` : ''}
     <button data-a="fuse" ${fPrev && w.gold >= 60 ? '' : 'disabled'}>🧬 Fuse!</button>
   </div>
   <div class="panel" style="width:min(420px,100%)"><h3>🎡 Power Wheels</h3>
     <div class="wheel" id="wheel">${UI.spinning ? '' : R.lastWheel ? `${R.lastWheel.icon}<small>${R.lastWheel.name}</small>` : '🎡<small>Spin for a new power!</small>'}</div>
     ${pend ? `<div class="ent">You got <b>${POWERS[pend].icon} ${POWERS[pend].name}</b> but have 4 powers. Replace one?<div class="row" style="margin-top:6px">${p.powers.map((pw, k) => `<button data-a="keepnew" data-v="${k}">Replace ${pdef(pw).icon} ${pdef(pw).name}</button>`).join('')}<button data-a="keepnew" data-v="-1">Discard new</button></div></div>` : `
     <div class="row"><button data-a="wheel" data-v="cheap" ${w.gold < 30 || UI.spinning ? 'disabled' : ''}>🎡 Cheap Wheel<br><span class="small">30🪙 · mostly weird powers</span></button>
     <button data-a="wheel" data-v="fancy" ${w.gold < 90 || UI.spinning ? 'disabled' : ''}>✨ Golden Wheel<br><span class="small">90🪙 · rare & epic powers</span></button></div>`}
     <p class="small">Duplicate power = +1 level instead.</p>
   </div>
  </div>
  <h3 style="margin-top:12px">🎒 Items — tools for creative ideas</h3><div class="row">${items}</div>
  <div class="col" style="margin-top:16px"><button class="big gold" data-a="${R.afterShop === 'book' ? 'nextbook' : 'nextpage'}" ${pend || UI.spinning ? 'disabled' : ''}>📖 ${R.afterShop === 'book' ? 'Choose the next book' : `Turn to page ${R.page + 1}`} →</button><button data-a="quit">💾 Save & Quit</button></div>`;
}
function fusionPreview(a, b) {
  const da = pdef(a), db = pdef(b);
  const key = [a.id, b.id].sort().join('+');
  const sp = SPECIAL_FUSIONS[key];
  const apt = {}; APS.forEach(k => apt[k] = Math.min(3, Math.max(da.apt[k], db.apt[k])));
  return { id: 'fuse:' + key + ':' + Date.now().toString(36), name: sp ? sp[0] : `${da.adj} ${db.noun}`, icon: sp ? sp[1] : '🧬', traits: [...new Set(da.traits.concat(db.traits))], apt, kw: [...new Set(da.kw.concat(db.kw))], adj: da.adj, noun: db.noun, desc: `A fusion of ${da.name} and ${db.name}.`, tier: 'fused' };
}
function doFuse() {
  const p = R.players[R.shopTab], w = wallet(p);
  if (UI.fuseSel.length !== 2 || w.gold < 60) return;
  const [i, j] = UI.fuseSel, a = p.powers[i], b = p.powers[j], f = fusionPreview(a, b);
  w.gold -= 60;
  const lvl = Math.max(a.lvl, b.lvl);
  p.powers = p.powers.filter((_, k) => k !== i && k !== j);
  p.powers.unshift({ id: f.id, lvl, fused: f });
  UI.fuseSel = []; toast(`🧬 ${f.icon} ${f.name} is born!`); save(); render();
}
function spin(kind) {
  const p = R.players[R.shopTab], w = wallet(p), cost = kind === 'cheap' ? 30 : 90;
  if (w.gold < cost || UI.spinning) return;
  w.gold -= cost; UI.spinning = true; render();
  const r = rnd();
  const pool = kind === 'cheap' ? (r < .8 ? COMMONS : r < .98 ? RARES : EPICS) : (r < .15 ? COMMONS : r < .85 ? RARES : EPICS);
  const got = pick(pool);
  const all = Object.values(POWERS);
  let n = 0;
  const iv = setInterval(() => {
    const el = $('#wheel'); const q = pick(all);
    if (el) el.innerHTML = `${q.icon}<small>${q.name}</small>`;
    if (++n > 18) {
      clearInterval(iv); UI.spinning = false;
      const d = POWERS[got]; R.lastWheel = { icon: d.icon, name: d.name }; discover(got);
      const own = p.powers.find(pw => pw.id === got);
      if (own) { own.lvl = Math.min(10, own.lvl + 1); toast(`${d.icon} ${d.name} again! It levels up to ${own.lvl}.`); }
      else if (p.powers.length < 4) { p.powers.push({ id: got, lvl: 1 }); toast(`${d.icon} New power: <b>${d.name}</b>! ${d.tier === 'epic' ? '🌟 EPIC!' : ''}`); }
      else UI.pendingPower = got;
      save(); render();
    }
  }, 80);
}
function resolvePending(k) {
  const p = R.players[R.shopTab], got = UI.pendingPower;
  if (k >= 0) p.powers[k] = { id: got, lvl: 1 };
  UI.pendingPower = null; save(); render();
}
function deadView() {
  const f = R.fail, ok = canRetry();
  app.innerHTML = `<h1 style="font-size:44px">💀 The page tears...</h1><div class="panel" style="max-width:560px;text-align:center">
  <p>Everyone was knocked out. You lost a quarter of your gold (${f.lost.join(', ')}).</p>
  <p>Retrying this page costs <b>${f.fee} gold</b>${R.mode === 'versus' ? ' per player (players who can\'t pay are out)' : ''}.<br>The map and traps will be <b>exactly the same</b> — use what you learned.</p>
  <p>${goldStr()}</p></div>
  <div class="col" style="margin-top:14px">${ok ? `<button class="big gold" data-a="retry">🔁 Pay ${f.fee} and retry</button>` : '<p class="sub">Not enough gold to retry...</p>'}<button class="big" data-a="over">${ok ? '🏳️ Give up (end run)' : '📕 End run'}</button></div>`;
}
function overView() {
  app.innerHTML = `<h1 style="font-size:44px">📕 Run Over</h1><div class="panel" style="max-width:560px;text-align:center"><p>You reached page ${R.page} of ${R.book ? THEMES[R.book].name : 'a book'}${R.vol > 1 ? `, volume ${R.vol}` : ''}.</p><p>Discovered powers stay in your Codex. Bosses still remember you...</p></div>
  <div class="col" style="margin-top:14px"><button class="big gold" data-a="over">🏠 Back to title</button></div>`;
}
render(S.run ? 'title' : 'title');
</script>
</body>
</html>
