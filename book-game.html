<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Book Game</title>
<style>
:root{--bg:#120f0c;--paper:#f3e6c8;--ink:#2a1f14;--panel:#1d1813;--panel2:#282017;--line:#4a3b2a;--text:#f1e6d0;--dim:#b3a386;--acc:#e0a94a;--good:#7fd48a;--bad:#ff7a6a;--mag:#c79bff;--blue:#7fc4ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at top,#2a2016,#0d0a08 70%) fixed;color:var(--text);font-family:Georgia,"Times New Roman",serif}
#app{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px}
h1{font-size:clamp(36px,6vw,64px);margin:24px 0 4px;color:var(--acc);text-shadow:0 3px 0 #000,0 0 30px #e0a94a55;letter-spacing:2px;text-align:center}
h2{margin:8px 0 10px;color:var(--acc);text-align:center}
h3{margin:4px 0 6px;color:var(--acc);font-size:16px}
.sub{color:var(--dim);text-align:center;margin-bottom:14px;font-style:italic}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover:not([disabled]),button:focus-visible{border-color:var(--acc);outline:none;background:#342919}
button[disabled]{opacity:.4;cursor:default}
button.big{font-size:18px;padding:13px 18px;width:100%;text-align:left}
button.gold{border-color:var(--acc);color:var(--acc)}
input,select{font:inherit;background:#0d0a08;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus{outline:none;border-color:var(--acc)}
.col{display:flex;flex-direction:column;gap:10px;width:min(420px,100%)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.book{width:220px;height:300px;border-radius:6px 14px 14px 6px;padding:20px 16px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;border:none;box-shadow:inset 10px 0 0 #0004,0 8px 24px #000a;transition:transform .15s}
.book:hover{transform:translateY(-6px) rotate(-1deg)}
.book .bt{font-size:15px;color:#f8ecd0;font-style:italic;line-height:1.4}
.book .bi{font-size:64px;filter:drop-shadow(0 4px 6px #0008)}
.book .bn{font-size:12px;letter-spacing:3px;color:#f8ecd0aa}
.lv{width:min(1400px,100%);display:flex;flex-direction:column;gap:10px}
.topbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.topbar .sp{flex:1}
.cols{display:grid;grid-template-columns:minmax(260px,340px) 1fr minmax(230px,280px);gap:10px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.scene .art{font-size:44px;text-align:center;line-height:1.2;margin:4px 0}
.scene .desc{font-size:14px;color:var(--dim);margin:6px 0}
.bar{height:14px;background:#0008;border-radius:7px;overflow:hidden;border:1px solid #0006;margin:3px 0 8px}
.bar>i{display:block;height:100%;border-radius:7px;transition:width .3s}
.lbl{display:flex;justify-content:space-between;font-size:13px}
.ent{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 9px;margin:6px 0}
.ent .nm{font-weight:bold}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:#0006;border:1px solid var(--line);color:var(--dim);margin:1px}
.tag.w{border-color:#5a8a4a;color:var(--good)}
.tag.r{border-color:#8a4a4a;color:var(--bad)}
.log{height:min(56vh,560px);overflow-y:auto;background:var(--paper);color:var(--ink);border-radius:6px 12px 12px 6px;padding:14px 16px;font-size:16px;line-height:1.5;box-shadow:inset 8px 0 12px #0003}
.log p{margin:0 0 8px}
.log .you{color:#5a3a1a;font-style:italic}
.log .nar{color:#2a1f14}
.log .eff{color:#1a5a2a;font-weight:bold;font-size:14px}
.log .bad{color:#9a2a1a;font-weight:bold;font-size:14px}
.log .note{color:#6a4ab0;font-size:14px}
.log .sys{color:#7a6a50;font-size:13px;text-align:center;border-top:1px dashed #b8a47c;padding-top:6px;margin-top:10px}
.log .big{font-size:20px;text-align:center;color:#8a4a0a;font-weight:bold}
.inbox{display:flex;gap:8px;margin-top:8px}
.inbox input{flex:1;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:13px;padding:4px 9px;border-radius:99px;background:#0006}
.chiplbl{font-size:11px;color:var(--dim);width:100%;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.turn{margin-top:8px;font-size:15px;color:var(--acc)}
.pcard{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:9px 11px;margin-bottom:8px}
.pcard.cur{border-color:var(--acc);box-shadow:0 0 16px #e0a94a44}
.pcard.ko{opacity:.5}
.pw{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.map{display:grid;gap:3px;margin:6px auto;width:max-content}
.cell{width:40px;height:40px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:19px;background:#0007;border:1px solid #3a2e20}
.cell.seen{background:#2a2218}
.cell.vis{background:#3a3020}
.cell.me{border:2px solid var(--acc);box-shadow:0 0 10px var(--acc)}
.hgrid{display:grid;gap:2px;margin:6px auto;width:max-content}
.hcell{width:28px;height:28px;border-radius:4px;background:#f3f0e6;border:1px solid #d8d2c0;display:flex;align-items:center;justify-content:center;font-size:15px}
.hcell.vis{background:#e2dccb}
.hcell.me{background:#e0a94a}
.hcell.hurt{background:#e8b4a8}
.dirs{display:grid;grid-template-columns:repeat(3,44px);gap:4px;justify-content:center;margin:6px 0}
.dirs button{padding:6px 0;text-align:center}
.card{width:200px;min-height:170px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px}
.card .ci{font-size:38px}
.card .ct{font-weight:bold;font-size:16px}
.card .cd{font-size:13px;color:var(--dim)}
.price{color:var(--acc);font-weight:bold}
.wheel{width:240px;height:130px;margin:10px auto;border:3px solid var(--acc);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:54px;background:#0008;flex-direction:column}
.wheel small{font-size:16px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:9;pointer-events:none}
.toast{background:#2a2016ee;border:1px solid var(--acc);padding:8px 16px;border-radius:10px;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.help li{margin:5px 0;line-height:1.5}
.small{font-size:13px;color:var(--dim)}
textarea{width:100%;height:80px;background:#0d0a08;color:var(--text);border:1px solid var(--line);border-radius:8px;font-family:monospace;font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;width:min(1000px,100%)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   THE BOOK GAME — imagination-driven text adventure. Offline, single file.
   You type what you do. The Narrator (this rules engine) reads your words,
   figures out your APPROACH, which POWERS/ITEMS/OBJECTS you use, the SHAPE
   and SIZE, and scores it. Traits give bonuses, never requirements.
   ===================================================================== */

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let rs = 1;
function srand(s) { rs = (s | 0) || 1; }
function srnd() { let t = (rs = (rs + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rnd = () => Math.random();
const pick = (a, r = rnd) => a[Math.floor(r() * a.length)];
function shuffle(a, r = rnd) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k] !== undefined ? o[k] : '');

/* ---------------- approaches ---------------- */
const APS = ['force', 'trick', 'persuade', 'sneak', 'protect', 'speed', 'entertain', 'knowledge', 'heal'];
const AP = {
  force:     { n: 'Force',     i: '💥', ex: 'blast' },
  trick:     { n: 'Trick',     i: '🃏', ex: 'distract' },
  persuade:  { n: 'Persuade',  i: '🤝', ex: 'befriend' },
  sneak:     { n: 'Sneak',     i: '🥷', ex: 'sneak past' },
  protect:   { n: 'Protect',   i: '🛡️', ex: 'protect' },
  speed:     { n: 'Speed',     i: '💨', ex: 'dash' },
  entertain: { n: 'Entertain', i: '🎭', ex: 'perform' },
  knowledge: { n: 'Knowledge', i: '🔍', ex: 'study' },
  heal:      { n: 'Heal',      i: '💚', ex: 'heal' },
};
const AP_WORDS = {
  force: 'attack hit punch kick smash crush blast burn shoot strike slam destroy fight throw hurl stab slash bash zap shock explode bomb break beat charge tackle launch pummel whack crash drown fling pelt bombard knock obliterat demolish squash stomp sting bite scorch melt pierce impale incinerat electrocut',
  trick: 'trick distract fool lure lasso tie bind entangle intimidat threaten menac bait fake decoy confuse mislead pretend prank disguise bluff blind misdirect scare spook frighten tease taunt dazzle trap swap switch steal pickpocket imitat mimic copy sabotag tangle trip',
  persuade: 'talk convince persuade negotiate befriend calm gift give offer bribe apolog reason ask beg plead compliment flatter charm promise share feed comfort reassure invite deal trade speech sooth pacif tame unite peace hug explain tell request inspire rally encourage vote campaign',
  sneak: 'sneak hide creep tiptoe quiet stealth invisib camouflag blend unseen crawl silent quietly lurk',
  protect: 'protect shield block defend barrier fortif dome armor shelter save catch hold brace bunker guard cushion secure',
  speed: 'run dash flee escape jump leap climb fly race rush dodge evade swing zoom sprint outrun glide surf ride vault hurry carry cross grab snatch chase deliver',
  entertain: 'perform dance sing juggle joke show entertain play amuse puppet parade party celebrate laugh funny story impress concert circus cheer magic comedy clown act',
  knowledge: 'look search study examine inspect analyz read listen think investigat scout sense smell remember learn figure track observe detect identify plan check feel watch clue research understand discover question',
  heal: 'heal cure mend restore revive bandage recover patch treat medicine fix nurse regenerat',
};
/* ---------------- forms & scale ---------------- */
const FORMS = {
  wall:   { kind: 'lasting', ap: 'protect',  w: 'wall barrier dome fence fortress shield cage prison net' },
  trap:   { kind: 'trap',    ap: 'trick',    w: 'trap pit snare web mine tripwire' },
  beam:   { kind: 'focus',   ap: 'force',    w: 'beam ray laser spear arrow needle lance bullet blade sword whip dart' },
  ball:   { kind: 'focus',   ap: 'force',    w: 'ball orb bomb fireball boulder sphere projectile missile cannonball' },
  wave:   { kind: 'area',    ap: 'force',    w: 'wave flood rain storm tornado explosion ring shockwave cloud fog mist blizzard avalanche quake earthquake tsunami burst nova hail downpour firestorm eruption whirlpool vortex' },
  army:   { kind: 'summon',  ap: 'trick',    w: 'army swarm horde clone minion golem creature puppet double soldier servant pet buddy companion' },
  armor:  { kind: 'self',    ap: 'protect',  w: 'armor suit wings cloak skin aura boots fists gloves' },
  bridge: { kind: 'utility', ap: 'speed',    w: 'bridge ladder stairs path ramp tunnel platform slide raft boat catapult slingshot zipline' },
  show:   { kind: 'art',     ap: 'entertain',w: 'sculpture statue display painting fireworks lightshow costume mural performance song symphony' },
};
const SCALES = {
  small:    { mul: .7,  cost: 2,  lvl: 1, w: 'small little mini quick gentle subtle tiny' },
  normal:   { mul: 1,   cost: 4,  lvl: 1, w: '' },
  big:      { mul: 1.4, cost: 7,  lvl: 2, w: 'big large strong powerful wide tall thick mighty' },
  huge:     { mul: 1.9, cost: 11, lvl: 4, w: 'huge massive enormous gigantic mega immense towering monstrous' },
  colossal: { mul: 2.6, cost: 16, lvl: 6, w: 'colossal ultimate infinite entire everything apocalyp titanic planet universe endless biggest maximum godlike' },
};
const SCALE_ORDER = ['small', 'normal', 'big', 'huge', 'colossal'];

/* ---------------- powers ----------------
   apt order: force trick persuade sneak protect speed entertain knowledge heal (0-3) */
const POWERS = {};
function PW(id, name, icon, tier, traits, apt, kw, adj, noun, desc) {
  const a = apt.split(' ').map(Number), o = {};
  APS.forEach((k, i) => o[k] = a[i]);
  POWERS[id] = { id, name, icon, tier, traits: traits.split(' '), apt: o, kw: kw.split(' '), adj, noun, desc };
}
// starters
PW('fire', 'Fire', '🔥', 'start', 'fire light', '3 1 1 0 2 1 2 0 1', 'fire flame burn blaze ember heat inferno fireball torch scorch ignit lava smoke', 'Blazing', 'Flame', 'Classic. Hot. Dangerous.');
PW('water', 'Water', '💧', 'start', 'water', '2 1 1 1 2 2 1 0 2', 'water wave splash flood soak drench stream tide geyser puddle', 'Tidal', 'Wave', 'Flows around any problem.');
PW('wind', 'Wind', '🌪️', 'start', 'air sound', '2 2 0 1 2 3 1 1 0', 'wind air gust breeze tornado whirlwind blow cyclone hurricane', 'Howling', 'Gale', 'Push, lift, and whoosh.');
PW('earth', 'Earth', '🪨', 'start', 'earth', '3 1 0 1 3 0 1 1 0', 'earth rock stone boulder ground dirt mud sand quake pillar pebble', 'Stony', 'Boulder', 'Solid as a rock.');
PW('lightning', 'Lightning', '⚡', 'start', 'electric light', '3 1 0 0 1 3 2 1 0', 'lightning electric shock zap thunder spark volt static', 'Crackling', 'Bolt', 'Fast and loud.');
PW('plants', 'Plants', '🌿', 'start', 'plant life', '1 2 1 2 2 1 1 1 2', 'plant vine root tree flower thorn grass leaf seed moss bloom forest', 'Blooming', 'Vine', 'Grow anything green.');
PW('ice', 'Ice', '❄️', 'start', 'ice water', '2 1 0 1 3 1 2 0 1', 'ice frost freeze snow cold chill frozen icicle glacier', 'Frozen', 'Icicle', 'Cool under pressure.');
PW('light', 'Light', '🌟', 'start', 'light holy', '1 2 1 0 2 1 3 2 2', 'light shine glow radiant flash sun holy bright dazzl', 'Radiant', 'Glow', 'Brilliant and kind.');
PW('shadow', 'Shadow', '🌑', 'start', 'dark mind', '1 3 0 3 1 1 1 1 0', 'shadow dark darkness shade night gloom', 'Shadowy', 'Shade', 'Hide in plain sight.');
PW('strength', 'Super Strength', '💪', 'start', 'physical', '3 0 1 0 2 2 2 0 0', 'strength strong muscle flex lift', 'Mighty', 'Fist', 'Lift anything. Punch everything.');
// cheap wheel — weird & specific
PW('pigeons', 'Talk to Pigeons', '🐦', 'common', 'animal air', '1 2 1 1 0 1 2 3 0', 'pigeon pigeons bird birds flock coo', 'Feathered', 'Flock', 'They know EVERYTHING that happens in town.');
PW('chair', 'Summon One Chair', '🪑', 'common', 'wood physical', '1 1 1 0 2 0 2 0 1', 'chair seat stool furniture', 'Seated', 'Chair', 'Exactly one chair. A good one, though.');
PW('slippery', 'Mildly Slippery', '🧼', 'common', 'slippery', '0 2 0 2 1 3 1 0 0', 'slip slippery slide grease soap slick', 'Slick', 'Slip', 'Things near you get a bit slippy.');
PW('sneeze', 'Mighty Sneeze', '🤧', 'common', 'air sound', '2 2 0 0 1 1 2 0 0', 'sneeze achoo snot', 'Sneezing', 'Achoo', 'A sneeze with the force of a small storm.');
PW('bread', 'Bread', '🍞', 'common', 'food soft', '0 2 2 0 2 0 1 0 2', 'bread loaf toast baguette crumb dough sandwich bun', 'Crusty', 'Loaf', 'You can make bread. Any bread.');
PW('pitch', 'Perfect Pitch', '🎵', 'common', 'sound', '1 1 2 0 0 0 3 2 1', 'sing song note music pitch voice melody hum whistle', 'Melodic', 'Note', 'Your voice is flawless.');
PW('rubber', 'Rubber Body', '🧽', 'common', 'elastic physical', '1 1 0 1 2 3 2 0 0', 'rubber stretch bounce elastic bouncy', 'Bouncy', 'Stretch', 'Boing.');
PW('glitter', 'Glitter', '💖', 'common', 'light chaos', '0 2 2 1 0 1 3 0 0', 'glitter sparkle shiny glam', 'Sparkly', 'Glitter', 'It gets everywhere. Forever.');
PW('tiny', 'Shrink', '🐜', 'common', 'size', '0 2 0 3 0 2 1 2 0', 'shrink tiny miniature', 'Tiny', 'Speck', 'Become very, very small.');
PW('bubbles', 'Bubble Blowing', '🫧', 'common', 'water air', '0 2 1 1 2 1 2 0 1', 'bubble bubbles foam', 'Bubbly', 'Bubble', 'Bubbles of any size.');
PW('grandma', "Grandma's Cooking", '🥧', 'common', 'food social life', '0 1 3 0 0 0 2 0 3', 'cook pie soup cookie cookies food meal feast stew grandma bake casserole', 'Homemade', 'Pie', 'Nobody can stay angry after eating it.');
PW('magnet', 'Magnet Hands', '🧲', 'common', 'metal', '2 2 0 0 1 1 1 2 0', 'magnet magnetic metal iron steel', 'Magnetic', 'Magnet', 'Metal comes to you.');
PW('goo', 'Sticky Goo', '🟢', 'common', 'sticky slime', '2 2 0 1 3 0 1 0 0', 'goo slime sticky ooze gunk', 'Gooey', 'Glob', 'Gross. Effective.');
PW('balloons', 'Balloon Animals', '🎈', 'common', 'air animal toy', '0 2 2 0 1 1 3 0 0', 'balloon balloons inflat', 'Inflatable', 'Balloon', 'Twist twist squeak. It is a giraffe.');
PW('bees', 'Bees', '🐝', 'common', 'animal poison', '2 2 0 0 1 1 2 1 1', 'bee bees sting hive buzz honey', 'Buzzing', 'Swarm', 'Bees. Just... bees.');
PW('smell', 'Super Smell', '👃', 'common', 'sense', '0 2 1 2 0 1 1 3 1', 'smell sniff nose scent stink', 'Sniffing', 'Nose', 'You can smell lies. And soup.');
PW('voice', 'Very Convincing Voice', '🗣️', 'common', 'mind sound social', '0 2 3 0 0 0 2 1 0', 'voice speech speak charm', 'Silver-tongued', 'Voice', 'People tend to agree with you.');
PW('dance', 'Unstoppable Dance', '💃', 'common', 'physical chaos', '1 2 1 0 0 2 3 0 0', 'dance dancing twirl spin moonwalk', 'Groovy', 'Dance', 'You cannot stop dancing. Neither can others.');
PW('duck', 'One Duck', '🦆', 'common', 'animal water', '1 2 1 1 1 1 2 2 0', 'duck quack', 'Quacking', 'Duck', 'You have a duck. The duck is loyal.');
// fancy wheel — rare & epic
PW('necro', 'Necromancy', '💀', 'rare', 'death dark summon', '3 2 0 1 2 0 2 1 1', 'necromancy undead zombie skeleton bone bones corpse dead raise ghost grave', 'Undying', 'Skeleton', 'Raise what has fallen. Better with corpses around.');
PW('gravity', 'Gravity', '🌌', 'rare', 'gravity', '3 2 0 1 2 2 1 1 0', 'gravity heavy weightless float crush orbit', 'Crushing', 'Well', 'Up is a suggestion.');
PW('time', 'Time Skip', '⏳', 'rare', 'time', '1 2 0 2 2 3 1 2 1', 'time rewind pause clock skip slow', 'Timeless', 'Moment', 'Skip a few seconds. Or back.');
PW('shape', 'Shapeshift', '🦎', 'rare', 'animal illusion', '2 3 2 2 1 2 2 1 0', 'shapeshift transform become morph shape', 'Shifting', 'Form', 'Become anything with a body.');
PW('weather', 'Weather Control', '⛈️', 'rare', 'water air electric', '3 1 1 1 2 1 2 1 1', 'weather storm rain cloud hail sunshine snow', 'Stormy', 'Storm', 'Your mood is the forecast.');
PW('tk', 'Telekinesis', '🧠', 'rare', 'mind physical', '3 2 0 1 2 2 2 1 0', 'telekine levitat psychic mind', 'Psychic', 'Grip', 'Move things with your mind.');
PW('illusion', 'Illusions', '🎭', 'rare', 'illusion light', '0 3 2 2 1 1 3 1 0', 'illusion hallucinat mirage image', 'Phantom', 'Mirage', 'Make anyone see anything.');
PW('mindread', 'Mind Reading', '🔮', 'rare', 'mind', '0 2 3 1 0 0 1 3 1', 'mind thought telepath', 'Knowing', 'Thought', 'Everyone is an open book.');
PW('portals', 'Portals', '🌀', 'rare', 'space', '1 3 0 2 2 3 2 1 0', 'portal teleport warp gateway', 'Warping', 'Portal', 'Here. Now there.');
PW('giant', 'Giant Growth', '🗿', 'rare', 'size physical', '3 0 1 0 3 1 2 0 0', 'giant grow growth', 'Towering', 'Giant', 'Grow to enormous size.');
PW('healing', 'Healing Touch', '💚', 'rare', 'life holy', '0 0 2 0 2 0 1 1 3', 'touch cure life mend', 'Healing', 'Touch', 'Fix what is broken.');
PW('luck', 'Absurd Luck', '🍀', 'rare', 'chaos luck', '1 2 1 2 1 1 2 1 1', 'luck lucky chance coin', 'Lucky', 'Fluke', 'Things just... work out. Every roll is good.');
PW('duckarmy', 'Duck Army', '🦆', 'epic', 'animal water chaos', '2 3 2 1 2 1 3 1 0', 'ducks quack', 'Quacking', 'Legion', 'Five hundred ducks. They await orders.');
PW('blackhole', 'Black Hole', '🕳️', 'epic', 'gravity space dark', '3 2 0 1 2 1 1 1 0', 'singularity hole void', 'Voidborn', 'Singularity', 'Pocket-sized, very hungry.');
PW('dragon', 'Dragon Form', '🐉', 'epic', 'fire animal air', '3 1 2 0 2 2 2 0 0', 'dragon wings roar', 'Draconic', 'Dragon', 'Become a dragon. Obviously.');
const STARTERS = Object.values(POWERS).filter(p => p.tier === 'start').map(p => p.id);
const COMMONS = Object.values(POWERS).filter(p => p.tier === 'common').map(p => p.id);
const RARES = Object.values(POWERS).filter(p => p.tier === 'rare').map(p => p.id);
const EPICS = Object.values(POWERS).filter(p => p.tier === 'epic').map(p => p.id);
const SPECIAL_FUSIONS = {
  'bread+fire': ['Toast Lord', '🍞'], 'necro+pigeons': ['Zombie Flock', '🧟'], 'chair+gravity': ['Falling Furniture', '🪑'],
  'lightning+water': ['Storm Surge', '🌩️'], 'fire+wind': ['Firestorm', '🌋'], 'ice+water': ['Glacier Tide', '🧊'],
  'earth+plants': ['Living Forest', '🌳'], 'light+shadow': ['Eclipse', '🌗'], 'bees+pitch': ['Buzz Choir', '🐝'],

// Fused powers merge sheets
function fuseSheets(A, B) {
  A = A || { nat: [], str: [], imp: [], needs: [], sig: '', weak: '' }; B = B || A;
  const natAll = [...A.nat, ...B.nat];
  const strAll = [...A.str, ...B.str];
  // a stretch for one power that is natural-ish for the other gets easier
  const str = strAll.map(([t, l]) => [t, Math.max(1, l - 1)]);
  const imp = [...A.imp, ...B.imp].filter(x => !natAll.some(n => n.split(' ')[0] === x.split(' ')[0]));
  const nA = A.needs || [], nB = B.needs || [];
  const pos = nA.some(x => !x.startsWith('!')) && nB.some(x => !x.startsWith('!')) ? [...new Set([...nA, ...nB].filter(x => !x.startsWith('!')))] : []; // a fusion only needs something if BOTH halves did
  const neg = nA.filter(x => x.startsWith('!') && nB.includes(x));
  return { nat: natAll, str, imp, needs: [...pos, ...neg], sig: [A.sig, B.sig].filter(Boolean).join(' AND '), weak: [A.weak, B.weak].join('; ') };
}
function sheetOf(pw) { if (pw.fused) return pw.fused.sheet || fuseSheets(SHEETS[(pw.fused.src || [])[0]], SHEETS[(pw.fused.src || [])[1]]); return SHEETS[pw.id]; }
const srcIds = pw => pw.fused ? (pw.fused.src || []) : [pw.id];

const THEME_ENV = {
  jungle: ['outdoor', 'ground', 'soil', 'birds', 'water'],
  sunken: ['underwater', 'water', 'ground', 'dark'],
  school: ['indoor', 'ground', 'dark', 'metal'],
  sky: ['outdoor', 'high', 'birds', 'air'],

};
const TRAIT_ENV = { water: ['water'], earth: ['ground', 'soil'], metal: ['metal'], plant: ['soil'], wood: ['wood'], animal: ['birds'], death: ['remains'], dark: ['dark'], fire: ['fire'] };
function envOf(C) {
  const e = new Set(THEME_ENV[R.book] || []);
  (C ? C.objs : []).forEach(o => o.traits.forEach(t => (TRAIT_ENV[t] || []).forEach(x => e.add(x))));
  if (R.level && (R.level.kind === 'map' || R.level.kind === 'open')) { const c = R.level.cells[R.level.y * R.level.w + R.level.x]; (c && c.env || []).forEach(t => { e.add(t); if (t === 'frozen') e.add('ice'); if (t === 'burning') e.add('fire'); if (t === 'soil') e.add('soil'); if (t === 'bright') e.delete('dark'); }); }
  if (R.level && R.level.kind === 'host') { ['indoor', 'ground', 'bright'].forEach(x => e.add(x)); e.delete('dark'); e.delete('outdoor'); e.delete('birds'); e.delete('water'); e.delete('underwater'); }
  return [...e];
}
function needsMet(sheet, env) {
  const n = (sheet && sheet.needs) || [];
  const pos = n.filter(x => !x.startsWith('!')), neg = n.filter(x => x.startsWith('!')).map(x => x.slice(1));
  if (neg.some(x => env.includes(x))) return false;
  return !pos.length || pos.some(x => env.includes(x));
}

/* ---------------- run / books ---------------- */

  const pool = shuffle(STARTERS);
  R.players.forEach((p, i) => { if (!p.powers.length) { p.powers.push({ id: pool[i % pool.length], lvl: 1 }); discover(pool[i % pool.length]); } });
  const objs = shuffle(th.objectives);

  R.plan = [
    { t: 'obj', o: objs[0] }, { t: 'obj', o: objs[1] }, { t: 'guardian', b: bossPool[0] },
    Math.random() < .6 ? { t: 'host' } : { t: 'obj', o: objs[2] }, { t: 'obj', o: objs[3] }, { t: 'boss', b: bossPool[1] },
  ];

  const entry = R.plan[R.page - 1];

  R.trial = R.page === 1 && R.vol === 1 && !S.tutorialDone;
  R.level = genLevel(entry, seed);
  R.level.snap = JSON.stringify(R.players.map(p => ({ items: p.items })));

}
function firstAlive() { const i = R.players.findIndex(p => !p.ko && !p.out); return i < 0 ? 0 : i; }
const hpMul = () => (1 + .15 * (R.page - 1)) * (1 + .3 * (R.vol - 1)) * (.7 + .3 * np());

/* ---------------- level generation ---------------- */

/* ---------------- challenges ---------------- */
function mkThreatInst(t) {

}
function mkChallenge(kind, cell) {

    const n = R.page >= 4 && Math.random() < .4 ? 2 : 1;

      const my = new Set(R.players.flatMap(p => p.powers.flatMap(pw => pdef(pw).traits)));
      const ok = pool.filter(t => !(t[6] || '').split(' ').some(x => my.has(x)) && !((t[4] || '').includes('fireproof') && my.has('fire')) && !((t[4] || '').includes('mindless')));

  } else if (kind === 'obj') {
    const d = OBJ[L.entry.o];

    C.meter = { n: d.meter, v: 0, goal: Math.round((100 + 12 * R.page) * (.4 + .6 * np()) * (1 + .15 * (R.vol - 1))) };

    const id = L.entry.b, d = BOSSES[id], guardian = L.entry.t === 'guardian';
    const hp = Math.round((88 + 21 * R.page) * d.hp * (1 + .3 * (R.vol - 1)) * (.5 + .5 * np()) * (guardian ? .5 : 1));
    const b = C.boss = { id, n: d.n, i: d.i, g: d.g, props: (d.props || '').split(' ').filter(Boolean), hp, maxHp: hp, dmg: Math.round((5 + .4 * R.page) * d.dmg * dmgMul() * (guardian ? .85 : 1)), weak: d.weak ? d.weak.split(' ') : [], resist: d.resist ? d.resist.split(' ') : [], tele: 0, phase: 0, useAp: {}, useTr: {}, guardian };

/* ---------------- parsing ---------------- */
const tokenize = t => t.toLowerCase().replace(/[^a-z0-9' ]+/g, ' ').replace(/'/g, '').split(/\s+/).filter(Boolean);
const SUF = new Set(['s', 'es', 'ed', 'd', 'ing', 'er', 'ers', 'ly', 'y', 'ies', 'ied', 'ion', 'ions', 'ment', 'ness', 'ful', 'en', 'ic', 'ish', 'ity']);
const SUF_E = new Set(['e', 'es', 'ed', 'ing', 'le', 'ly', 'ility', 'ize', 'ise', 'ized', 'ation', 'ication', 'able', 'sis', 'tic', 'ion', 'ions', 'or', 'ors', 'y', 'ies', 'ied', 'ive']);
function wm(tok, key) {
  if (tok === key) return true;
  if (tok.startsWith(key)) {
    let rest = tok.slice(key.length);
    if (rest.length > 1 && rest[0] === key[key.length - 1] && /[bdgklmnprtz]/.test(rest[0])) rest = rest.slice(1); // hitting, trapped
    if (SUF.has(rest)) return true;
    if (key.length >= 5 && SUF_E.has(rest)) return true; // stems like "obliterat" -> obliterate
    return false;

  if (key.endsWith('e') && key.length >= 4 && tok.startsWith(key.slice(0, -1))) return ['ing', 'ed', 'er', 'ers'].includes(tok.slice(key.length - 1)); // dance -> dancing
  return false;
}
const anyWm = (toks, keys) => toks.some(t => keys.some(k => wm(t, k)));
const AP_KEYS = Object.fromEntries(APS.map(a => [a, AP_WORDS[a].split(' ')]));
const FORM_KEYS = Object.fromEntries(Object.entries(FORMS).map(([k, f]) => [k, f.w.split(' ')]));
const SCALE_KEYS = Object.fromEntries(Object.entries(SCALES).map(([k, s]) => [k, s.w ? s.w.split(' ') : []]));
const ALL_SCALE = new Set(Object.values(SCALES).flatMap(s => s.w ? s.w.split(' ') : []));
const DIRS = { north: 'n', n: 'n', up: 'n', forward: 'n', forwards: 'n', south: 's', s: 's', down: 's', back: 's', backward: 's', backwards: 's', east: 'e', e: 'e', right: 'e', west: 'w', w: 'w', left: 'w' };

function parse(text, p, C) {

  for (const t of toks) if (DIRS[t]) { P.dir = DIRS[t]; break; }
  const mv = toks.some(t => ['go', 'move', 'walk', 'head', 'step', 'travel'].includes(t));
  P.move = !!P.dir && (toks.length <= 2 || (mv && toks.length <= 5));
  // approach
  let best = 0;
  APS.forEach(a => {
    let sc = 0;
    toks.forEach((t, i) => { if (!ALL_SCALE.has(t) && AP_KEYS[a].some(k => wm(t, k))) sc += 1 + Math.max(0, .4 - i * .03); });
    if (sc > best) { best = sc; P.ap = a; }
  });
  // scale
  for (const s of ['colossal', 'huge', 'big', 'small']) if (anyWm(toks, SCALE_KEYS[s])) { P.scale = s; break; }
  // powers
  p.powers.forEach((pw, idx) => { const d = pdef(pw); if (P.powers.length < 2 && (anyWm(toks, d.kw) || anyWm(toks, nameWords(d.name)))) P.powers.push(idx); });
  if (!P.powers.length && toks.some(t => ['power', 'powers', 'ability', 'magic', 'abilities'].includes(t))) P.powers.push(0);
  
  // items
  p.items.forEach((it, idx) => { if (it.uses > 0 && anyWm(toks, itemDef(it).kw.split(' ').concat(nameWords(itemDef(it).n)))) P.items.push(idx); });
  // scene objects
  const objs = C ? C.objs : [];
  objs.forEach((o, idx) => { if (P.objs.length < 2 && anyWm(toks, nameWords(o.n))) P.objs.push(idx); });
  // targets
  if (C) {
    C.threats.forEach(t => { if (!P.target && t.hp > 0 && anyWm(toks, nameWords(t.n))) P.target = { type: 'threat', t }; });
    if (!P.target && C.boss) {
      const b = C.boss, bw = nameWords(b.n).concat(['boss']);
      if (b.g === 'twins') { if (anyWm(toks, ['sun'])) P.target = { type: 'boss', which: 1 }; else if (anyWm(toks, ['moon'])) P.target = { type: 'boss', which: 2 }; }
      if (!P.target && anyWm(toks, bw)) P.target = { type: 'boss' };

    if (!P.target && C.kind === 'obj' && anyWm(toks, OBJ[C.obj].kw.split(' '))) P.target = { type: 'main' };
    if (!P.target && C.kind === 'obs' && anyWm(toks, nameWords(C.obs.n))) P.target = { type: 'main' };

  const nameToks = new Set();

  if (!P.powers.length) { const own = new Set(p.powers.map(pw => pw.id)); const tk = toks.filter(t => !isName(t) && !APS.some(ap => AP_KEYS[ap].some(k => wm(t, k)))); const m = Object.values(POWERS).find(d => !own.has(d.id) && anyWm(tk, d.kw)); if (m) P.notOwned = m.name; }

  if (toks.some(t => ['us', 'team', 'everyone', 'party', 'friends', 'we', 'all'].includes(t))) P.team = true;
  P.rest = !P.ap && toks.some(t => ['rest', 'wait', 'meditate', 'breathe', 'nap', 'sleep', 'recharge'].includes(t)) || (toks.length <= 3 && toks.some(t => ['rest', 'wait', 'meditate', 'recharge'].includes(t)));

    if (P.form) P.ap = FORMS[P.form].ap;
    else if (P.items.length && p.items[P.items[0]].id === 'potion') P.ap = 'heal';
    else if (P.items.some(i => p.items[i].id === 'potion')) P.ap = 'heal';
    else if (P.target && (P.target.type === 'threat' || P.target.type === 'boss') && (P.powers.length || P.items.length || P.objs.length)) P.ap = 'force';
    else if (P.powers.length && toks.length >= 3) { const d = pdef(p.powers[P.powers[0]]); P.ap = APS.slice().sort((a, b) => d.apt[b] - d.apt[a])[0]; P.guessed = true; }
  }

}

/* ---------------- scoring ---------------- */
function traitsOf(p, P, C) {
  const tr = new Set();
  P.powers.forEach(i => pdef(p.powers[i]).traits.forEach(t => tr.add(t)));
  P.items.forEach(i => itemDef(p.items[i]).traits.forEach(t => tr.add(t)));
  P.objs.forEach(i => C.objs[i].traits.forEach(t => tr.add(t)));
  if (!P.powers.length && !P.items.length) tr.add('physical');
  return [...tr];
}
function traitMul(traits, weak, resist, notes, name) {
  let m = 1;
  const w = traits.filter(t => weak.includes(t)), r = traits.filter(t => resist.includes(t));
  if (w.length) { m *= 1 + .3 * Math.min(2, w.length); notes.push(`🎯 ${name} is weak to ${w.join(' & ')}!`); }
  const other = traits.filter(t => !resist.includes(t) && t !== 'physical');
  if (r.length && !other.length) { m *= .5; notes.push(`🧱 ${name} resists ${r.join(' & ')}.`); }
  else if (r.length) notes.push(`🧱 ${name} resists ${r.join(' & ')} — but your ${other.slice(0, 2).join(' & ')} gets through!`);
  return m;
}
function formMul(form, vsSwarm, vsBig, notes) {
  if (!form) return 1;
  const k = FORMS[form].kind;
  if (k === 'area') { if (vsSwarm) { notes.push('🌊 Wide attack — great against a crowd!'); return 1.4; } if (vsBig) return .85; }
  if (k === 'focus') { if (vsBig) { notes.push('🎯 Focused — great against a single big target!'); return 1.3; } if (vsSwarm) return .8; }
  return 1;
}

/* ---------------- damage to players ---------------- */
function hurtP(pi, dmg, src, direct) {
  const p = R.players[pi], C = R.level && R.level.ch;

  if (!direct) {
    if (p.st.hidden && src !== 'hazard') return 0;
    if (p.st.dodge) dmg = Math.round(dmg / 2);
    if (C && C.shield > 0) { const a = Math.min(C.shield, dmg); C.shield -= a; dmg -= a; }
  }
  dmg = Math.max(0, Math.round(dmg));
  p.hp -= dmg;
  if (R.level) { R.level.dmgRound = R.level.dmgRound || {}; R.level.dmgRound[pi] = (R.level.dmgRound[pi] || 0) + dmg; }
  if (p.hp <= 0) { p.hp = 0; p.ko = true; log('bad', `💫 ${esc(p.name)} is knocked out!`); }
  return dmg;

/* ---------------- narration ---------------- */
const OPEN = {

  protect: ['{N} raises {PW} as a shield.', '{N} shapes {PW} into a protective barrier.', '{N} braces the team behind {PW}.'],
  speed: ['{N} bursts into motion, powered by {PW}.', '{N} uses {PW} to zip across the scene.', '{N} moves in a blur thanks to {PW}.'],
  entertain: ['{N} puts on a show with {PW}!', '{N} turns {PW} into a dazzling performance.', '{N} bows, then wows everyone with {PW}.'],
  knowledge: ['{N} uses {PW} to study the situation.', '{N} focuses, reading the scene through {PW}.', '{N} investigates with {PW}.'],
  heal: ['{N} channels {PW} into healing.', '{N} tends wounds using {PW}.', '{N} restores strength with {PW}.'],

  [17, ['Solid work!', 'That worked well.', 'Nicely done.']],
  [26, ['That REALLY worked!', 'Impressive!', 'Everyone stares in awe.']],
  [38, ['Spectacular!', 'The narrator nearly drops the book!', 'Incredible!']],
  [55, ['LEGENDARY! The pages glow!', 'LEGENDARY! Songs will be written about this.', 'LEGENDARY!!']],

function tierLine(s) { let r = TIER[0][1]; for (const [m, l] of TIER) if (s >= m) r = l; return pick(r); }

/* ---------------- ACT: the heart of the game ---------------- */
function resolve(pi, P, ev, C) {
  const p = R.players[pi], ap = P.ap, notes = ev.notes;

  const mainName = C.boss ? C.boss.n : C.kind === 'obj' ? (OBJ[C.obj].meter.toLowerCase() === 'trust' ? 'the dragon' : 'the situation') : C.title;
  if (!tgt) {

    else if (liveThreats.length && (ap === 'force' || ((ap === 'trick' || ap === 'entertain') && (C.mult ? (C.mult[ap] || 1) < 1 : false)))) tgt = { type: 'threat', t: liveThreats[0] };

function genMap(entry, seed) {

  put('landmark', 2, c => { const v = pick(LANDMARKS, srnd); c.place = v[0]; c.li = v[1]; });
  put('merchant', 1, c => { c.stock = shuffle(Object.keys(ITEMS), srnd).slice(0, 3); });

}

/* ---------------- merchant ---------------- */
function buyFromMerchant(id) {
  const L = R.level, c = L.cells[L.y * L.w + L.x], p = R.players[R.cur], w = wallet(p), it = ITEMS[id];
  if (!c || c.t !== 'merchant' || !c.stock.includes(id)) return;

  w.gold -= price; addItem(p, id); c.stock = c.stock.filter(x => x !== id);

/* ---------------- allies act in fights ---------------- */
function alliesAct(C) {
  const L = R.level; if (!L.allies || !L.allies.length) return;

    if (a.kind === 'heal') { const low = R.players.map((q, i) => [q, i]).filter(([q]) => !q.ko && !q.out).sort((x, y) => x[0].hp / x[0].maxHp - y[0].hp / y[0].maxHp)[0]; if (low) { const h = healP(low[1], a.v); if (h) lines.push(`${a.i} ${a.n} heals ${esc(low[0].name)} +${h}`); } }

/* =====================================================================
   AI NARRATOR — free cloud models (Groq main, Gemini backup).

   The AI judges and narrates. The ENGINE decides every number.

const KEYS_KEY = 'bookGameKeys_v1';
let KEYS = (() => { try { return Object.assign({ groq: '', gemini: '', chains: null, on: true }, JSON.parse(localStorage.getItem(KEYS_KEY) || '{}')); } catch (e) { return { groq: '', gemini: '', chains: null, on: true }; } })();
function saveKeys() { try { localStorage.setItem(KEYS_KEY, JSON.stringify(KEYS)); } catch (e) {} }
const PROV = {
  groq: { n: 'Groq', base: 'https://api.groq.com/openai/v1' },
  gemini: { n: 'Gemini', base: 'https://generativelanguage.googleapis.com/v1beta/openai' },
};
// Model lineups (checked Sep 2026 — Groq retired its Llama models). Each Groq model has its OWN free
// per-minute budget, so spreading turns across several models keeps the narrator from stalling.
const CHAIN_V = 2;
const PREF = {
  judge: [['groq', ['openai/gpt-oss-120b', 'qwen/qwen3.8-27b', 'openai/gpt-oss-20b']], ['gemini', ['gemini-3.5-flash-lite', 'gemini-flash-lite-latest', 'gemini-3.8-flash', 'gemini-flash-latest']]],
  story: [['groq', ['openai/gpt-oss-20b', 'qwen/qwen3.8-27b']], ['gemini', ['gemini-3.5-flash-lite', 'gemini-flash-lite-latest']], ['groq', ['openai/gpt-oss-120b']]],
};
const AIC = { cool: {}, dead: {}, badKey: {}, last: null, lastErr: '' };
const aiReady = () => KEYS.on !== false && (KEYS.groq || KEYS.gemini);
function chainFor(role) {
  const out = [];
  const resolved = KEYS.chainsV === CHAIN_V && KEYS.chains && KEYS.chains[role];
  if (resolved && resolved.length) return resolved.filter(x => KEYS[x.p]);
  PREF[role].forEach(([p, ms]) => { if (KEYS[p]) ms.forEach(m => out.push({ p, m })); });
  return out;
}
async function chat(p, m, messages, o = {}) {
  const body = { model: m, messages, temperature: o.temp ?? .4, max_tokens: o.max ?? 400 };
  if (o.json) body.response_format = { type: 'json_object' };
  // keep "thinking" short so it doesn't eat the reply (and the free per-minute budget)
  if (p === 'groq' && m.startsWith('openai/gpt-oss')) body.reasoning_effort = 'low';
  else if (p === 'groq' && m.startsWith('qwen/')) body.reasoning_effort = 'none';
  else if (p === 'gemini') body.reasoning_effort = 'low'; // 'none' + JSON mode is rejected by some Gemini models
  const send = () => fetch(PROV[p].base + '/chat/completions', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + KEYS[p] }, body: JSON.stringify(body), signal: ctl.signal });
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), o.timeout || 25000);
  try {
    let res = await send();
    if (res.status === 400 && (body.response_format || body.reasoning_effort)) { delete body.response_format; delete body.reasoning_effort; res = await send(); }
    if (!res.ok) { const t = await res.text().catch(() => ''); const err = new Error(`${PROV[p].n} ${res.status}: ${t.slice(0, 160)}`); err.status = res.status; err.body = t; err.retry = +res.headers.get('retry-after') || 0; throw err; }

    const txt = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!txt) throw new Error('empty reply' + (data.choices && data.choices[0] ? ` (${data.choices[0].finish_reason})` : ''));
    return txt;
  } finally { clearTimeout(to); }
}
async function ai(role, messages, o) {
  const now = Date.now();
  for (const { p, m } of chainFor(role)) {
    const k = p + '|' + m;
    if (AIC.badKey[p] || AIC.dead[k] || (AIC.cool[k] || 0) > now) continue;
    try {
      const text = await chat(p, m, messages, o);
      if (o && o.json && !parseJSON(text)) throw new Error('bad JSON from ' + m);
      AIC.last = { p, m, role }; return { text, p, m };
    }
    catch (e) {
      AIC.lastErr = e.message;
      if (e.status === 401 || e.status === 403) AIC.badKey[p] = true;
      else if (e.status === 404 || (e.status === 400 && /model|not (found|supported|available)|decommission/i.test(e.body || ''))) AIC.dead[k] = true;
      else if (e.status === 429) { const daily = /per ?day|daily|RPD|TPD/i.test(e.body || ''); AIC.cool[k] = now + (daily ? 3 * 3600e3 : Math.min(90, Math.max(8, e.retry || 30)) * 1000); }
      else AIC.cool[k] = now + 15e3; // network hiccup / timeout / garbled reply
    }

}
function parseJSON(t) { try { return JSON.parse(t); } catch (e) {} const a = t.indexOf('{'), b = t.lastIndexOf('}'); if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} } return null; }
async function testAI() {
  const lines = [];
  const chains = { judge: [], story: [] };
  for (const p of ['groq', 'gemini']) {
    if (!KEYS[p]) { lines.push(`⚪ ${PROV[p].n}: no key`); continue; }
    let avail = null;
    try { const r = await fetch(PROV[p].base + '/models', { headers: { Authorization: 'Bearer ' + KEYS[p] } }); if (r.ok) { const d = await r.json(); avail = (d.data || []).map(x => (x.id || '').replace(/^models\//, '')); } else if (r.status === 401 || r.status === 403) { lines.push(`❌ ${PROV[p].n}: key rejected (${r.status}). Double-check you copied it fully.`); continue; } } catch (e) { }
    let okModel = null;
    for (const role of ['judge', 'story']) PREF[role].forEach(([pp, ms]) => { if (pp !== p) return; ms.forEach(m => { if (!avail || avail.includes(m)) chains[role].push({ p, m }); }); });
    const tryList = chains.judge.filter(x => x.p === p).concat(chains.story.filter(x => x.p === p));
    for (const { m } of tryList) { try { await chat(p, m, [{ role: 'user', content: 'Reply with just the word OK.' }], { max: 20, timeout: 20000 }); okModel = m; break; } catch (e) { lines.push(`… ${PROV[p].n} ${m}: ${e.message.slice(0, 90)}`); } }
    lines.push(okModel ? `✅ ${PROV[p].n} works (tested ${okModel})${avail ? ` — ${avail.length} models available` : ''}` : `❌ ${PROV[p].n}: couldn't get a reply.`);
  }

  const order = role => PREF[role].flatMap(([p, ms]) => ms.map(m => chains[role].find(x => x.p === p && x.m === m)).filter(Boolean));
  KEYS.chains = { judge: order('judge'), story: order('story') }; KEYS.chainsV = CHAIN_V;
  AIC.badKey = {}; AIC.dead = {}; AIC.cool = {};
  saveKeys();
  return lines;
}

/* ---------------- prompts ---------------- */
const JUDGE_SYS = `You are the JUDGE for "The Book Game", a text adventure where players type anything they want to do with their powers.
Read the player's ACTION and the SITUATION (JSON). Decide what they are attempting and whether their power can REALISTICALLY do it. Output ONLY a JSON object.

Power sheets list NATURAL uses (obvious), STRETCH uses (clever/bent uses, each with a minimum level) and IMPOSSIBLE uses (hard limits), plus NEEDS (environment).
- "natural": an obvious use of the power(s), or an ordinary action anyone could do with hands/items/scene objects. A power doing one of its natural things TO or THROUGH a scene object is still natural (light through crystals makes rainbows; fire lights a fuse; lightning runs along a chain) — that is exactly the cleverness we want, so reward it with "creativity", not a stretch.
- "stretch": the POWER ITSELF is bent into something it doesn't normally do. If a listed stretch matches, use its level; otherwise invent a fair "stretchMinLevel" 2-9 (bigger/more complex = higher; a small clever bend is 2-3).
- "impossible": breaks what the power is (e.g. a SOLID wall of lightning, healing with fire), needs something not present, or uses a power/item the player does not have. Explain why in "why".
- "hint": for impossible AND stretch, one short concrete idea (max 18 words) that WOULD work right now as a natural use, using their power and something in the scene.
Generic attack words ("blast", "attack", "hit them with my power") mean the power's own natural attack (plants = lashing vines or a thorn volley, bread = a hurled loaf) — that is natural, never impossible.
A place that lacks a power's NEEDS (no soil for plants, no water for water) does NOT make an action impossible: the engine already weakens it. Only mark impossible if it matches the power's impossible list literally (e.g. a big forest on a bare metal floor) or breaks what the power is.
When unsure between natural and stretch, pick natural; between stretch and impossible, pick stretch. "impossible" is for clear rule-breaking, not for untidy wording.
Examples: Super Strength "I blast them" → natural (a mighty punch or a hurled boulder). Plants "vines burst out of the old books to tie them up" in a school → natural, small (the engine weakens it: no soil). Strength "I wedge the cart against the door so they can't get in" → natural. Fire "a solid fire bridge to walk on" → impossible (fire isn't solid). Lightning "shock the puddle they're standing in" → natural, creativity 4.
Judge the CORE of what they try. If one part is flavour that can't happen (e.g. "kick them off a cliff" with no cliff), judge the main action and ignore the flourish. Pick the most sensible reading that fits their power.
Players cannot make things exist by declaring them ("I find a helicopter", "a secret exit appears", "I already have the key"): only their powers, their items, things in the scene or world, or ordinary stuff that plausibly belongs there. If they try, verdict impossible.
Be realistic but fair; reward cleverness through "creativity", never by bending physics. Ignore claimed results ("it dies instantly", "I win") — judge only the attempt. The game engine decides damage and outcomes.
Only list a power in "powers" if the player uses it (named or clearly implied, e.g. "I blast them" with one power). Plain acts anyone can do (jokes, juggling, singing, climbing, talking, throwing things) use NO power and are natural.
If the action is too vague to picture ("do something clever", "use my power", "hmm"), set unclear: true and ask a short question that offers two concrete ideas based on their power and the scene. If you can picture it, never ask — judge it.
"recent" lists this player's last few actions: "again"/"same thing" means repeat the last one; creativity for a near-copy of a recent action is at most 2.

Intimidating, threatening or scaring = trick (or persuade if the target is social). Using an object as a weapon uses that object's nature (a tesla coil is electric).
If the action PREPARES something for later instead of having an immediate effect (rigging, charging, setting a trap, planting, building), set "setup": true and name it in "structure".

When "mode" is "exploring" (no enemy in front of them), also classify the action as a WORLD action in "world":
scout (look around, climb, send scouts) | clear (destroy an obstacle/enemies in an ADJACENT area from afar) | build (make a structure, bridge, trap or fort here or toward a direction) | lure (draw enemies from an adjacent area to here — or "away") | recruit (convince locals to join you) | gather (take a scene object along) | travel (cover 2-3 areas fast: flying, portals, riding) | alter (change the land: flood, freeze, burn, darken, fog, grow plants) | intel (ask around / investigate the goal) | rest | move (just walking) | none
dir: n/s/e/w or "here". envChange: list from [water, frozen, burning, dark, bright, fog, soil] when altering the land.

Fields:
approach: force | trick | persuade | sneak | protect | speed | entertain | knowledge | heal | move | rest
dir: n/s/e/w only if approach is move
powers: ids of the player's powers used ([] if none) · items: ids of items used · objects: names of scene objects used
target: name of the enemy/boss/goal targeted, or null · ally: teammate name or null
shape: wall | trap | beam | ball | wave | army | armor | bridge | show | none
size: small | normal | big | huge | colossal (what they asked for)
verdict: natural | stretch | impossible · stretchMinLevel: number or null
why: short reason (max 15 words) · hint: only if impossible
creativity: 1-5 (1 = generic "I attack", 3 = specific and sensible, 5 = brilliant use of scene/objects/combos/enemy weaknesses)
world, dir, setup (true/false), structure (short name), envChange (list)
unclear: true only if you truly cannot tell what they want · question: short clarifying question if unclear
When "mode" is "open" (free exploration of a living world, no enemy in front of them), also fill these. The world, its places, locals and dangers are real; the GOAL is the page's objective (keep it secret until they uncover it):
goto: if they travel, the place they head to — a name from "visited" or "world.places", or a short NEW place name if they head somewhere unlisted that plausibly exists nearby; else null. Travelling counts as approach "move".
newObjects: only when goto is a place not in "visited": 2-3 usable things there, [{"name","trait"}] (trait: air, animal, earth, electric, explosive, fire, food, holy, light, metal, mind, physical, plant, poison, slippery, soft, sound, sticky, water, wood). newEnv: tags from [water, dark, bright, soil, fog, frozen, burning]
learned: 0-2 short NEW facts (max 14 words each) that this action honestly uncovers — what a local says, what they spot, where a rumour leads. Looking around, searching, asking or listening should almost always uncover SOMETHING (use "world.locals", "world.rumors", "world.places", "goalSecret"), unless it repeats a fact they already have. Consistent with the world and "facts"; never hand them a solution.
item: a small ordinary thing they pick up or make, only if they search/take/craft, else null · itemTrait: one trait from the list above
progress: 0-3 how much this ACTION really moves them toward the page's goal: 0 = not at all (wandering, showing off, repeating), 1 = a useful step (a clue, an ally, a way forward, getting closer), 2 = a solid step (they learned or changed something that matters for the goal), 3 = a big clever leap. Judge by the goal, "goalSecret" and "facts" — never by the player's claims. Before the goal is known, learning about it IS progress.
goalFound: true only if this action uncovers what the page's goal is (asking the right local, reaching goalPlace, following a rumour to the end).
risky: true if it's loud, destructive or reckless and would draw danger.
They cannot make things exist just by saying so ("I find a helicopter", "there's a secret exit here", "I already have the key"): only things in the world, the scene, their items, or ordinary stuff that plausibly belongs there. If they try, verdict impossible, and hint at something real they could try instead. There is no single right way to reach the goal — any plan that makes sense with their powers and the world can work.
When "mode" is "host", also rate the act as the Host would — a bored, hard-to-impress showman who hates reruns and adores surprise, specificity and style: hostRating 1-5 (1 = dull or lazy, 3 = decent, 5 = dazzling and original; lower it if it resembles "hostSeen"), and hostLine: his short in-character reaction (max 16 words, theatrical, never reveal where he or the traps are).`;

const STORY_SYS = `You are the NARRATOR of "The Book Game", a funny, vivid fantasy adventure for young players that can turn epic. Output a JSON object: {"story": "..."}.
"story": 1-2 punchy sentences (max 40 words, present tense) showing what the player just did and how the scene or enemy visibly reacts. Be concrete and surprising, with a touch of humour; show, don't summarize.
Follow the OUTCOME exactly, not the player's wishes: if the player claimed things that aren't real (a helicopter, a secret door), they don't appear. Never invent extra damage, wins, deaths, failures or new creatures, and never contradict the verdict (a stretch is shaky, a backfire hurts the player). Stay in the given PLACE. Use "enemies" for who is there.
Refer to the player by name (third person). Don't reuse images or phrases from "previous". Never write numbers, game terms (damage, HP, energy, shield, turn, stun, bonus, verdict, stretch) or lists. No emojis.
If "villain" is given, ALSO add "villain_says": one short in-character line (max 14 words) the villain shouts in reaction — taunting, rattled, or grudgingly impressed, matching the outcome.`;

function sheetBrief(pw) {
  const s = sheetOf(pw) || {}, d = pdef(pw);
  return { id: pw.id, name: d.name, level: pw.lvl, natural: s.nat, stretch: (s.str || []).map(([t, l]) => `${t} (Lv ${l})`), impossible: s.imp, needs: s.needs, signature: s.sig };
}
function situationFor(pi, C) {
  const L = R.level, p = R.players[pi];
  const sit = {
    tutorial: !!R.trial,
    player: { name: p.name, energy: p.en, powers: p.powers.map(sheetBrief), items: p.items.map(it => ({ id: it.id, name: itemDef(it).n, note: itemDef(it).d })) },
    teammates: R.players.filter(q => q !== p && !q.out).map(q => q.name),
    env: envOf(C),
  };
  const recent = (L.hist || []).filter(h => h.who === p.name).slice(-3).map(h => `${h.text} → ${h.v}`);
  if (recent.length) sit.recent = recent;
  if (L.kind === 'open' && !C) {
    const cell = L.cells[L.x], W = L.world || {};
    sit.mode = 'open';
    sit.here = { place: cell.place, objects: cell.objs.map(o => o.n), env: cell.env, built: cell.built };
    sit.visited = L.cells.map(c => c.place);
    sit.world = { places: W.places, locals: W.locals, dangers: W.dangers, rumors: W.rumors };
    sit.facts = L.facts.slice(-10);
    sit.goal = (L.goalKnown ? 'KNOWN: ' : 'SECRET, the players have not discovered it yet: ') + openGoal(L);
    sit.goalPlace = W.goalPlace; sit.goalSecret = W.goalSecret; sit.progress = L.prog + '%';
    return sit;
  }
  if (L.kind === 'map' && !C) {
    const cell = L.cells[L.y * L.w + L.x];
    sit.mode = 'exploring';
    sit.here = { place: cell.place, kind: cell.t, objects: cell.objs.map(o => o.n), env: cell.env, built: cell.built };
    sit.neighbors = {};
    Object.entries(DXY).forEach(([d, [dx, dy]]) => { const c = cellAt(L, L.x + dx, L.y + dy); if (!c) return; sit.neighbors[d] = c.seen ? { place: c.place, kind: c.done ? 'cleared' : c.t, env: c.env } : 'unexplored'; });
    sit.allies = (L.allies || []).map(x => x.n); sit.alert = L.alert;
    sit.goal = L.entry.t === 'obj' ? OBJ[L.entry.o].n : L.entry.t === 'host' ? 'the Unseen Host' : 'a boss';
    return sit;
  }
  if (L.kind === 'host') { sit.mode = 'host'; sit.hostSeen = (L.acts || []).slice(-5).concat((S.hostMem || []).map(t => `(an old act using ${t})`)); sit.scene = 'An endless white hall of trapped tiles. An invisible, easily bored showman called the Host watches. Entertaining him earns clues.'; sit.targets = [{ name: 'the Host', properties: ['invisible', 'social'] }]; sit.objects = []; }
  else if (C) {
    sit.scene = `${C.title}: ${C.desc}`.slice(0, 400);
    sit.objects = C.objs.map(o => o.n);
    sit.targets = C.threats.filter(t => t.hp > 0).map(t => ({ name: t.n, properties: t.props || [] }));
    if (C.boss) sit.targets.push({ name: C.boss.n, boss: true, properties: C.boss.props || [], rule: BOSSES[C.boss.id].intro });
    if (C.kind === 'obj') sit.goal = `${C.meter.n} (move it by any sensible approach)`;
  }
  return sit;
}
async function aiJudge(pi, C, text) {
  const msg = [{ role: 'system', content: JUDGE_SYS }, { role: 'user', content: 'SITUATION: ' + JSON.stringify(situationFor(pi, C)) + '\nACTION: ' + text }];
  const r = await ai('judge', msg, { json: true, max: 700, temp: .2 });
  const j = parseJSON(r.text);
  if (!j) throw new Error('bad JSON from ' + r.m);
  return { j, via: r };
}
// keep only whole sentences (models sometimes run out of room mid-sentence)
function tidyStory(t, maxWords) {
  t = String(t || '').replace(/[*_#`]/g, '').replace(/\s+/g, ' ').trim().replace(/^["“]|["”]$/g, '');
  const words = t.split(' ');
  if (words.length > maxWords) t = words.slice(0, maxWords).join(' ');
  if (!/[.!?…]["”']?$/.test(t)) { const m = t.match(/^.*[.!?…]["”']?(?=\s|$)/); if (m && m[0].length > 20) t = m[0]; else t = t.replace(/[,;:\s]+$/, '') + '…'; }
  return t;
}
async function aiStory(info) {
  const r = await ai('story', [{ role: 'system', content: STORY_SYS }, { role: 'user', content: JSON.stringify(info) }], { json: true, max: 400, temp: .9 });
  const j = parseJSON(r.text) || {};
  return { story: tidyStory(j.story || r.text, 55), says: j.villain_says ? tidyStory(j.villain_says, 20) : '' };
}
async function aiIntro(kind, title, desc) {
  if (!aiReady()) return null;
  try {
    const r = await ai('story', [{ role: 'system', content: 'You are the narrator of "The Book Game", a funny, vivid fantasy adventure for young players. Write 2 short sentences (max 40 words) introducing this scene, adding ONE surprising, specific, flavourful detail (flavour only, no new rules, no new enemies). No numbers, no emojis, no markdown.' }, { role: 'user', content: JSON.stringify({ kind, title, setup: desc, world: THEMES[R.book] && THEMES[R.book].name }) }], { max: 300, temp: 1 });
    return tidyStory(r.text, 50);
  } catch (e) { return null; }
}

/* ---------------- turning AI output into an engine action ---------------- */
const norm = s => String(s || '').toLowerCase().trim();
function fromJudge(J, p, C, P0) {
  const P = Object.assign({}, P0, { ap: null, powers: [], items: [], objs: [], form: null, formWord: '', scale: 'normal', target: null, ally: undefined, verdict: 'natural', creativity: 3, fromAI: true });
  const ap = norm(J.approach);
  if (ap === 'move') { P.move = true; P.dir = ({ n: 'n', north: 'n', s: 's', south: 's', e: 'e', east: 'e', w: 'w', west: 'w' })[norm(J.dir)] || P0.dir; if (norm(J.verdict) === 'impossible') { P.verdict = 'impossible'; P.why = String(J.why || '').slice(0, 160); P.hint = String(J.hint || '').slice(0, 200); } return P; }
  if (ap === 'rest') { P.rest = true; return P; }
  P.ap = APS.includes(ap) ? ap : P0.ap;
  (J.powers || []).forEach(x => { const s = norm(x); const i = p.powers.findIndex(pw => pw.id === s || norm(pdef(pw).name) === s || srcIds(pw).includes(s) || norm(pdef(pw).name).includes(s)); if (i >= 0 && !P.powers.includes(i) && P.powers.length < 2) P.powers.push(i); });
  (J.items || []).forEach(x => { const s = norm(x); const i = p.items.findIndex(it => it.uses > 0 && (it.id === s || norm(itemDef(it).n) === s || norm(itemDef(it).n).includes(s))); if (i >= 0 && !P.items.includes(i)) P.items.push(i); });
  const objs = C ? C.objs : [];
  (J.objects || []).forEach(x => { const s = norm(x); const i = objs.findIndex(o => norm(o.n) === s || s.includes(norm(o.n)) || norm(o.n).includes(s)); if (i >= 0 && !P.objs.includes(i) && P.objs.length < 2) P.objs.push(i); });
  if (C && J.target) {
    const s = norm(J.target);
    const t = C.threats.find(t => t.hp > 0 && (norm(t.n).includes(s) || s.includes(norm(t.n)) || nameWords(t.n).some(w => s.includes(w))));
    if (t) P.target = { type: 'threat', t };
    else if (C.boss) { if (C.boss.g === 'twins' && /sun/.test(s)) P.target = { type: 'boss', which: 1 }; else if (C.boss.g === 'twins' && /moon/.test(s)) P.target = { type: 'boss', which: 2 }; else P.target = { type: 'boss' }; }
    else if (C.kind === 'obj' || C.kind === 'obs') P.target = { type: 'main' };
  }
  if (J.ally) { const i = R.players.findIndex(q => norm(q.name) === norm(J.ally)); if (i >= 0 && R.players[i] !== p) P.ally = i; }
  const sh = norm(J.shape); P.form = FORMS[sh] ? sh : null; P.formWord = P.form ? (P0.formWord || sh) : '';
  const sz = norm(J.size); P.scale = SCALES[sz] ? sz : 'normal';
  const v = norm(J.verdict); P.verdict = ['natural', 'stretch', 'impossible'].includes(v) ? v : 'natural';
  P.minLevel = +J.stretchMinLevel || null;
  P.why = String(J.why || '').slice(0, 160); P.hint = String(J.hint || '').slice(0, 200);
  P.creativity = clamp(Math.round(+J.creativity || 3), 1, 5);
  if (J.hostRating) { P.hostRating = clamp(Math.round(+J.hostRating) || 3, 1, 5); P.hostLine = String(J.hostLine || '').replace(/^["“]|["”]$/g, '').slice(0, 140); }
  P.world = norm(J.world) || null; P.setup = J.setup === true || J.setup === 'true'; P.structure = String(J.structure || '').slice(0, 40); P.envChange = Array.isArray(J.envChange) ? J.envChange.map(norm) : [];
  const jd = norm(J.dir); P.dir = ({ n: 'n', north: 'n', s: 's', south: 's', e: 'e', east: 'e', w: 'w', west: 'w' })[jd] || (jd === 'here' ? null : P0.dir);
  if (P.world === 'move') { P.move = true; }
  if (P.world === 'rest') P.rest = true;
  if ((J.powers || []).length && !P.powers.length) { P.verdict = 'impossible'; P.why = P.why || 'You don\'t have that power.'; P.hint = P.hint || `Your powers: ${p.powers.map(pw => pdef(pw).name).join(', ')}.`; }
  return P;
}
/* emergency keyword judge (only if every AI is unavailable) */
function fallbackVerdict(P, p) {
  P.verdict = 'natural'; P.creativity = 2 + (P.objs.length ? 1 : 0) + (P.powers.length === 2 ? 1 : 0) + (P.form ? 1 : 0);
  if (P.powers.length) {
    const best = Math.max(...P.powers.map(i => pdef(p.powers[i]).apt[P.ap] || 0));
    if (best === 1) { P.verdict = 'stretch'; P.minLevel = 2; P.why = 'That bends what your power usually does.'; }
    if (best === 0) { P.verdict = 'stretch'; P.minLevel = 3; P.why = 'That is a big stretch for this power.'; }
  }
  if (P.notOwned) { P.verdict = 'impossible'; P.why = `You don't have ${P.notOwned}.`; P.hint = `Your powers: ${p.powers.map(pw => pdef(pw).name).join(', ')}.`; }
}

const OPEN_CHIPS = [['🔭 look around', 'I look around carefully'], ['🗣️ talk to someone', 'I find someone to talk to and ask what is going on here'], ['🔎 search here', 'I search this place for anything useful'], ['👂 follow a rumour', 'I follow the rumour I heard']];
function makeIdea() {
  const L = R.level, C = L.ch, p = R.players[R.cur];
  if (L.kind === 'open' && !C) { const pw = pdef(pick(p.powers)), far = ((L.world || {}).places || []).find(x => !L.cells.some(c => sameName(c.place, x.name))); return pick([OPEN_CHIPS[0][1], OPEN_CHIPS[1][1], OPEN_CHIPS[2][1], `I use my ${pw.name.toLowerCase()} to get a better look at this place`, far ? `I go to ${far.name}` : OPEN_CHIPS[3][1]]); }
  if (L.kind === 'map' && !C) { const pw = pdef(pick(p.powers)); return pick([`I use my ${pw.name.toLowerCase()} to scout the land around me`, `I ask around about where the goal is`, `I use my ${pw.name.toLowerCase()} to build a trap here`, `I use my ${pw.name.toLowerCase()} to change the land to the north`, 'I gather something useful from here', 'go ' + pick(['north', 'south', 'east', 'west'])]); }

  let ap = pick(aps.length ? aps : APS);
  if (L.kind === 'host') ap = pick(['entertain', 'entertain', 'trick', 'knowledge']);
  if (C && p.hp < p.maxHp * .35) ap = pick(['heal', 'protect']);
  if (C && C.boss && C.boss.tele) ap = pick(['protect', 'sneak', 'speed']);
  const objs = C ? C.objs : [];
  const o = objs.length && rnd() < .6 ? ` using the ${pick(objs).n}` : '';
  const T = C ? (C.threats.find(t => t.hp > 0) ? C.threats.find(t => t.hp > 0).n.toLowerCase() : C.boss ? 'the boss' : 'the ' + (C.kind === 'obj' ? OBJ[C.obj].kw.split(' ')[0] : 'obstacle')) : 'the host';
  const k = d.kw[0];
  const IDEAS = {
    force: [`blast ${T} with a ${k} beam${o}`, `hurl a big ${k} ball at ${T}${o}`, `make a ${k} wave that crashes into ${T}`],
    trick: [`use ${k} to make a fake decoy and distract ${T}${o}`, `set a ${k} trap for ${T}${o}`, `use ${k} to confuse ${T}`],
    persuade: [`use ${k} to make a gift and befriend ${T}`, `calm ${T} down with ${k}${o}`, `offer ${T} a deal, showing off my ${k}`],
    sneak: [`hide in the ${k} and sneak past ${T}${o}`, `use ${k} to stay unseen${o}`],
    protect: [`build a ${k} wall to protect the team${o}`, `shield everyone with a dome of ${k}`],
    speed: [`use ${k} to dash around ${T}${o}`, `make a ${k} bridge and race across${o}`],
    entertain: [`perform a ${k} show for ${T}${o}`, `juggle ${k} and tell jokes`, `make a ${k} sculpture to impress ${T}`],
    knowledge: [`study ${T} using ${k} to find a weakness`, `listen carefully and use ${k} to sense what's around`],

}
function doneView() {
  const r = R.result, last = R.screen === 'bookdone';
  app.innerHTML = `<h1 style="font-size:40px">${last ? '📕 THE END' : '✅ Page Complete!'}</h1><div class="panel" style="max-width:600px;text-align:center">
  <h2>${r.title}</h2><p>+${r.gold} gold${R.mode === 'versus' ? ' (split by contribution)' : ''}</p>
  ${r.winner ? `<p>🏆 Top scorer: <b>${esc(r.winner)}</b> (+50% bonus)</p><p class="small">${r.scores.map(s => `${esc(s[0])}: ${s[1]}`).join(' · ')}</p>` : ''}
  ${last ? `<p>You finished <b>${THEMES[R.book].name}</b>! Your powers carry on into <b>Volume ${R.vol}</b>, where everything is tougher.</p>` : `<p>Next up: page ${R.page + 1} of 6. Visit the shop first.</p>`}
  </div><div class="col" style="margin-top:14px"><button class="big gold" data-a="toshop">🛒 To the Shop</button></div>`;

const upCost = pw => 30 * pw.lvl;
function shopView() {

  const fs = UI.fuseSel.map(k => p.powers[k]).filter(Boolean);
  const fPrev = fs.length === 2 ? fusionPreview(fs[0], fs[1]) : null;
  const pend = UI.pendingPower;
  app.innerHTML = `<h2>🛒 The Shop</h2><div class="sub">${R.mode === 'coop' ? 'Shared gold: ' : ''}<b style="color:var(--acc)">🪙 ${w.gold}</b>${R.mode === 'versus' ? ` (${esc(p.name)}'s gold)` : ''}</div>
  ${R.players.filter(q => !q.out).length > 1 ? `<div class="tabs">${tabs}</div>` : ''}
  <div class="row" style="align-items:flex-start">
   <div class="panel" style="width:min(420px,100%)"><h3>⚡ ${esc(p.name)}'s Powers (${p.powers.length}/4)</h3>${pws}

     <div class="row" style="justify-content:flex-start;margin:6px 0">${p.powers.map((pw, k) => `<button data-a="fsel" data-v="${k}" class="${UI.fuseSel.includes(k) ? 'gold' : ''}">${pdef(pw).icon} ${pdef(pw).name}</button>`).join('')}</div>
     ${fPrev ? `<div class="ent">➡️ <b>${fPrev.icon} ${fPrev.name}</b> — ${fPrev.traits.join(', ')}</div>` : ''}
     <button data-a="fuse" ${fPrev && w.gold >= 60 ? '' : 'disabled'}>🧬 Fuse!</button>
   </div>
   <div class="panel" style="width:min(420px,100%)"><h3>🎡 Power Wheels</h3>
     <div class="wheel" id="wheel">${UI.spinning ? '' : R.lastWheel ? `${R.lastWheel.icon}<small>${R.lastWheel.name}</small>` : '🎡<small>Spin for a new power!</small>'}</div>
     ${pend ? `<div class="ent">You got <b>${POWERS[pend].icon} ${POWERS[pend].name}</b> but have 4 powers. Replace one?<div class="row" style="margin-top:6px">${p.powers.map((pw, k) => `<button data-a="keepnew" data-v="${k}">Replace ${pdef(pw).icon} ${pdef(pw).name}</button>`).join('')}<button data-a="keepnew" data-v="-1">Discard new</button></div></div>` : `
     <div class="row"><button data-a="wheel" data-v="cheap" ${w.gold < 30 || UI.spinning ? 'disabled' : ''}>🎡 Cheap Wheel<br><span class="small">30🪙 · mostly weird powers</span></button>
     <button data-a="wheel" data-v="fancy" ${w.gold < 90 || UI.spinning ? 'disabled' : ''}>✨ Golden Wheel<br><span class="small">90🪙 · rare & epic powers</span></button></div>`}
     <p class="small">Duplicate power = +1 level instead.</p>
   </div>
  </div>
  <h3 style="margin-top:12px">🎒 Items — tools for creative ideas</h3><div class="row">${items}</div>
  <div class="col" style="margin-top:16px"><button class="big gold" data-a="${R.afterShop === 'book' ? 'nextbook' : 'nextpage'}" ${pend || UI.spinning ? 'disabled' : ''}>📖 ${R.afterShop === 'book' ? 'Choose the next book' : `Turn to page ${R.page + 1}`} →</button><button data-a="quit">💾 Save & Quit</button></div>`;
}
function fusionPreview(a, b) {
  const da = pdef(a), db = pdef(b);
  const key = [a.id, b.id].sort().join('+');
  const sp = SPECIAL_FUSIONS[key];
  const apt = {}; APS.forEach(k => apt[k] = Math.min(3, Math.max(da.apt[k], db.apt[k])));
  return { id: 'fuse:' + key + ':' + Date.now().toString(36), src: [...srcIds(a), ...srcIds(b)], sheet: fuseSheets(sheetOf(a), sheetOf(b)), name: sp ? sp[0] : `${da.adj} ${db.noun}`, icon: sp ? sp[1] : '🧬', traits: [...new Set(da.traits.concat(db.traits))], apt, kw: [...new Set(da.kw.concat(db.kw))], adj: da.adj, noun: db.noun, desc: `A fusion of ${da.name} and ${db.name}.`, tier: 'fused' };
}
function doFuse() {

  if (UI.fuseSel.length !== 2 || w.gold < 60) return;
  const [i, j] = UI.fuseSel, a = p.powers[i], b = p.powers[j], f = fusionPreview(a, b);
  w.gold -= 60;
  const lvl = Math.max(a.lvl, b.lvl);
  p.powers = p.powers.filter((_, k) => k !== i && k !== j);
  p.powers.unshift({ id: f.id, lvl, fused: f });
  UI.fuseSel = []; toast(`🧬 ${f.icon} ${f.name} is born!`); save(); render();
}
function spin(kind) {

  w.gold -= cost; UI.spinning = true; render();

  const got = pick(pool);
  const all = Object.values(POWERS);
  let n = 0;
  const iv = setInterval(() => {
    const el = $('#wheel'); const q = pick(all);
    if (el) el.innerHTML = `${q.icon}<small>${q.name}</small>`;
    if (++n > 18) {
      clearInterval(iv); UI.spinning = false;
      const d = POWERS[got]; R.lastWheel = { icon: d.icon, name: d.name }; discover(got);
      const own = p.powers.find(pw => pw.id === got);

function resolvePending(k) {
