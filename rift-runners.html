<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rift Runners</title>
<style>
:root{--bg:#0b0d14;--panel:#161a26;--panel2:#1f2536;--line:#2c3450;--text:#e8ecf6;--dim:#8d97b3;--acc:#7c9cff;--gold:#ffd24a;--good:#5ee08a;--bad:#ff6070;--purple:#b48cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
canvas{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
#ui.hidden{display:none}
#ui.overlay{background:rgba(5,7,12,.72);justify-content:center}
#ui.menu{background:transparent}
#ui.dim{background:rgba(5,7,12,.9)}
h1{font-size:clamp(34px,6vw,64px);margin:18px 0 4px;letter-spacing:4px;background:linear-gradient(90deg,#7c9cff,#b48cff,#ff7ab8);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
h2{margin:6px 0 12px;font-size:26px;text-align:center}
.sub{color:var(--dim);text-align:center;margin-bottom:18px}
.col{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:min(1100px,100%)}
button{font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;position:relative;transition:transform .08s,border-color .08s}
button:hover:not([disabled]),button:focus:not([disabled]){border-color:var(--acc);outline:none;transform:translateY(-2px);background:var(--panel2)}
button[disabled]{opacity:.4;cursor:default}
button.big{font-size:18px;padding:14px 18px}
kbd{position:absolute;top:6px;right:8px;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:#0006}
.card{width:210px;min-height:190px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 12px}
.card .ci{font-size:40px;line-height:1.2}
.card .ct{font-weight:700;font-size:17px}
.card .cs{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
.card .cd{font-size:14px;color:var(--dim)}
.card.evo{border-color:#ffb84a;box-shadow:0 0 18px #ffb84a55}
.card.evo .cs{color:#ffb84a}
.card.new .cs{color:var(--good)}
.card.relic .cs{color:var(--purple)}
.price{color:var(--gold);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:min(900px,100%)}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;width:min(1000px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px;font-size:15px}
.bar .it{white-space:nowrap}
.icons{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ico{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:14px;white-space:nowrap}
.ico b{font-size:11px;color:var(--gold)}
.map{position:relative;width:min(560px,100%);height:min(62vh,600px);margin:6px auto;flex-shrink:0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,50%);width:48px;height:48px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:22px;text-align:center}
.node:hover:not([disabled]),.node:focus:not([disabled]){transform:translate(-50%,50%) scale(1.15)}
.node.reach{border-color:var(--acc);box-shadow:0 0 14px #7c9cff88;animation:pulse 1.2s infinite}
.node.visited{border-color:var(--good);opacity:.85}
.node.boss{width:64px;height:64px;font-size:30px;border-color:#ff6070}
.node kbd{top:-10px;right:-8px;background:#000}
@keyframes pulse{50%{box-shadow:0 0 22px #7c9cffcc}}
.legend{font-size:13px;color:var(--dim);text-align:center;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;width:min(1000px,100%)}
.mrow{display:flex;gap:10px;align-items:center}
.mrow .mi{font-size:26px}
.mrow .mt{flex:1}
.mrow small{color:var(--dim)}
.pips{letter-spacing:2px;color:var(--acc);font-size:12px}
.locked{filter:grayscale(1)}
.ach{padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.ach.done{border-color:var(--good)}
textarea{width:100%;height:90px;background:#0a0c12;color:var(--text);border:1px solid var(--line);border-radius:8px;font-family:monospace;font-size:12px;padding:8px}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:10}
.toast{background:#1c2233ee;border:1px solid var(--acc);padding:8px 16px;border-radius:10px;font-weight:600;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
p{line-height:1.5}
.help{max-width:760px}
.help li{margin:4px 0;line-height:1.45}
.foot{margin-top:14px;color:var(--dim);font-size:12px;text-align:center}
.lvsplit{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:min(1200px,100%)}
.lvcol{flex:1 1 440px;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:10px}
.lvcol.p1{border-color:#7c9cff66}.lvcol.p2{border-color:#ff7ab866}
.lvcol .row .card{width:170px;min-height:170px}
.lvcol.done{opacity:.55}
.who{font-weight:800;letter-spacing:1px}
.who.p1{color:#9fb4ff}.who.p2{color:#ff9ac8}
.tabs{display:flex;gap:8px;justify-content:center;margin:6px 0}
.tabs button.on{border-color:var(--acc);background:var(--panel2)}
.obj{font-size:13px;color:var(--gold)}
.keys{font-size:13px;color:var(--dim);text-align:center;line-height:1.7}
.keys b{color:var(--text)}
.codebox{width:100%;height:110px}
.sqboard,.sqbench{display:grid;grid-template-columns:repeat(3,120px);gap:8px;justify-content:center;margin:4px auto}
.sqbench{grid-template-columns:repeat(6,104px)}
.tile{width:100%;height:96px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px;border-width:2px}
.tile .ti{font-size:30px;line-height:1.1}.tile .tn{font-size:12px;font-weight:700}.tile .ts{font-size:11px;color:var(--gold)}.tile .te{font-size:10px;color:var(--dim)}
.tile.empty{opacity:.45;border-style:dashed}.tile.sel{box-shadow:0 0 0 3px #ffd24a;transform:translateY(-3px)}.tile.enemy{background:#2a1520}
.syn{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}.syn .ico.on{background:#2a3350}
.sqboard.two{grid-template-columns:repeat(2,120px)}
.tile.boss{box-shadow:0 0 16px #ff4060;background:#3a1020}.tile .tl{color:#9fb4ff;font-size:10px}
.tile.r3{box-shadow:0 0 10px #c07cff66}.tile.r4{box-shadow:0 0 14px #ffc23a88;background:linear-gradient(160deg,#3a2a0a,#161a28)}
.vs{font-size:28px;font-weight:900;color:#ff6070;align-self:center;padding:0 6px}
.blessrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.bless{width:118px;padding:6px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:.55;font-size:12px}
.bless span{font-size:22px}.bless.on{opacity:1;border-color:var(--gold);background:#2a2410}
.lvchip{border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center;font-size:15px}.lvchip.up{border-color:var(--gold);box-shadow:0 0 12px #ffd24a88}
.packtease{width:190px;height:190px;border-radius:24px;font-size:96px;margin:18px auto;display:flex;align-items:center;justify-content:center;animation:tease 1s ease-in-out infinite;border:3px solid #556}
.packtease.t2{border-color:#5cb8ff;box-shadow:0 0 30px #5cb8ff88}
.packtease.t3{border-color:#c07cff;box-shadow:0 0 50px #c07cff;animation:tease .5s ease-in-out infinite}
.packtease.t4{border-color:#ffc23a;box-shadow:0 0 70px #ffc23a,0 0 20px #fff inset;animation:tease .3s ease-in-out infinite,glowL .6s infinite alternate;background:linear-gradient(160deg,#5a4212,#1e1406)}
@keyframes tease{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.06)}}
.pcard.back.hint{border-color:var(--rc);box-shadow:0 0 26px var(--rc);animation:tease .4s ease-in-out infinite}
#tbwrap{width:100%;max-width:1000px;display:flex;flex-direction:column;align-items:center;gap:8px}
.tbhead{font-size:20px}.tbturn{display:flex;gap:6px;align-items:center;color:var(--dim);font-size:13px}
.tq{font-size:20px;border-radius:8px;padding:2px 4px;border:2px solid transparent}.tq.me{background:#1a2a50}.tq.foe{background:#401a24}.tq.now{border-color:var(--gold);transform:scale(1.2)}
.tbfield{display:flex;gap:14px;align-items:center;justify-content:center;width:100%}
.tbside{display:grid;grid-template-columns:repeat(2,150px);gap:10px}
.tbu{position:relative;height:150px;border:2px solid var(--rc,#444);border-radius:14px;background:#141a2c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;cursor:default;transition:transform .15s}
.tbside.foe .tbu{background:#2a1520}
.tbu.empty{border-style:dashed;opacity:.25}
.tbu.r3{box-shadow:0 0 14px #c07cff99}.tbu.r4{box-shadow:0 0 20px #ffc23a;background:linear-gradient(160deg,#3a2a0a,#141a2c)}
.tbu.boss{transform:scale(1.06);box-shadow:0 0 22px #ff4060}
.tbu .ui1{font-size:40px;line-height:1.1}.tbu .un{font-size:12px;font-weight:700;text-align:center}.tbu .us{font-size:11px;color:var(--gold)}
.tbu .hpb{width:90%;height:8px;background:#000a;border-radius:4px;position:relative;overflow:hidden}.tbu .hpb i{position:absolute;left:0;top:0;bottom:0;background:#5ee08a;transition:width .3s}.tbside.foe .hpb i{background:#ff6070}
.tbu .hpb s{position:absolute;left:0;top:0;height:3px;background:#7fe3ff}
.tbu .uh{font-size:10px;color:var(--dim)}.tbu .ucd{font-size:10px;color:#b48cff}.tbu .ucd.ready{color:#fff;font-weight:700;text-shadow:0 0 6px #b48cff}.tbu .ust{font-size:12px;min-height:14px}
.tbu.dead{opacity:.25;filter:grayscale(1)}
.tbu.acting{outline:3px solid var(--gold);transform:translateY(-6px) scale(1.04)}
.tbu.tgt{cursor:pointer;outline:3px dashed #ff6070;animation:pulse 1s infinite}.tbu.tgt:hover{transform:scale(1.06)}
.tbu.hit{animation:tbhit .35s}.tbu.casting{animation:tbcast .6s}
@keyframes tbhit{25%{transform:translateX(-7px);filter:brightness(2)}60%{transform:translateX(5px)}}
@keyframes tbcast{50%{transform:scale(1.15);filter:brightness(1.6) drop-shadow(0 0 12px #fff)}}
.tbu .tk{position:absolute;top:4px;left:4px}.tbu .beat{position:absolute;top:4px;right:4px;font-size:10px;color:#ff8a8a;font-weight:800}
.tbf{position:absolute;top:30%;font-weight:900;font-size:18px;pointer-events:none;text-shadow:0 2px 3px #000;animation:tbfl 1s ease-out forwards;white-space:nowrap}
@keyframes tbfl{from{transform:translateY(0) scale(1.3)}to{transform:translateY(-50px);opacity:0}}
.tbmsg{min-height:22px;text-align:center}.tbact{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:8px;max-width:760px}.tbact>button{padding-right:34px;min-width:150px}.tbact>.row,.tbact>.keys{flex-basis:100%;justify-content:center;text-align:center}
.tbsmall button{font-size:13px;padding:6px 10px}
button.spready{border-color:#b48cff;box-shadow:0 0 14px #b48cff88}
@media (max-width:700px){.tbside{grid-template-columns:repeat(2,96px)}.tbu{height:120px}.tbu .ui1{font-size:28px}.tbfield{gap:4px}}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,104px);gap:8px;justify-content:center;max-width:900px;width:100%;margin:6px auto}
.tile.locked{opacity:.35;filter:grayscale(1)}
.card.pack{width:180px;gap:5px;padding:12px 10px}.card.pack button{width:100%}
.pullrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;perspective:900px;margin:8px 0}
.pcard{width:150px;height:210px;border-radius:14px;border:3px solid var(--rc);background:linear-gradient(160deg,#1a2036,#0c0f18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px;text-align:center;position:relative;overflow:hidden}
.pcard .ci{font-size:54px;line-height:1.1}.pcard .ct{font-weight:800;font-size:15px}.pcard .cs{font-size:11px;color:var(--dim)}
.pcard .rar{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--rc)}
.pcard .tag2{font-size:12px;font-weight:700;color:#fff;background:#ffffff18;border-radius:8px;padding:2px 8px}
.pcard.back{background:repeating-linear-gradient(45deg,#1a1f33 0 10px,#151a2b 10px 20px);border-color:#444}
.pcard.back .ci{font-size:44px;opacity:.7}
.pcard.fresh{animation:flip .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes flip{from{transform:rotateY(90deg) scale(.8)}to{transform:none}}
.pcard.r1{box-shadow:0 0 14px #5ee08a55}.pcard.r2{box-shadow:0 0 20px #5cb8ff88}
.pcard.r3{box-shadow:0 0 30px #c07cffcc;background:linear-gradient(160deg,#35205a,#120c1e)}
.pcard.r4{box-shadow:0 0 44px #ffc23a;background:linear-gradient(160deg,#5a4212,#1e1406);animation:flip .55s cubic-bezier(.2,1.4,.4,1),glowL 1.2s ease-in-out infinite alternate}
.pcard.r4:not(.fresh){animation:glowL 1.2s ease-in-out infinite alternate}
.pcard.r3::after,.pcard.r4::after{content:'';position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,#ffffff40 50%,transparent 60%);animation:shine 2.2s linear infinite}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
@keyframes glowL{from{box-shadow:0 0 24px #ffc23a}to{box-shadow:0 0 60px #ffe58a,0 0 12px #fff inset}}
.legend-banner{font-size:34px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#ffd24a,#fff6c0,#ff9a2a,#ffd24a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:bannerIn .6s cubic-bezier(.2,1.6,.4,1),rainbow 1.5s linear infinite;height:44px}
.legend-banner.epic{background-image:linear-gradient(90deg,#c07cff,#f0d8ff,#8a4cff,#c07cff)}
@keyframes bannerIn{from{transform:scale(2.4);opacity:0}}
@keyframes rainbow{to{background-position:300% 0}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:50;animation:flashA .9s ease-out forwards}
.flash.gold{background:radial-gradient(circle,#fff8d0 0%,#ffc23a99 40%,transparent 75%)}.flash.purple{background:radial-gradient(circle,#f0d8ff 0%,#a060ff88 40%,transparent 75%)}
@keyframes flashA{from{opacity:1}to{opacity:0}}
.spark{position:fixed;pointer-events:none;z-index:51;font-size:22px;animation:sparkA 1.6s ease-out forwards}
@keyframes sparkA{to{transform:translate(var(--dx),var(--dy)) rotate(540deg) scale(.4);opacity:0}}
h3{margin:10px 0 4px;text-align:center}
.small{font-size:13px}
@media (max-width:700px){.sqbench{grid-template-columns:repeat(3,104px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   RIFT RUNNERS 2 — co-op action roguelite. Single file, fully offline.
   Loop: clear a room → rift doors open showing their rewards → walk into
   the one you want. 3 biomes + bosses, then Endless. 1-2 players on one
   keyboard (or gamepads), experimental online play by copy-paste codes.
   ===================================================================== */
const $ = s => document.querySelector(s);
const cv = $('#c'), cx = cv.getContext('2d'), ui = $('#ui');
let VW = 0, VH = 0;
function resize() { VW = cv.width = innerWidth; VH = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

/* ---------- seeded RNG (Daily Challenge is the same for everyone) ---------- */
const RNG = { s: 1, next() { let t = (this.s = (this.s + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; } };
const rnd = () => RNG.next();
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const rpick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function weighted(list) { let tot = 0; for (const o of list) tot += o.w; let r = rnd() * tot; for (const o of list) { r -= o.w; if (r <= 0) return o; } return list[list.length - 1]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h | 0; }
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ================= DATA ================= */
// el = element for SETS (collect 2 / 4 of an element for a set bonus)
const WEAPONS = {
  wand:      { name: 'Magic Bolt',      icon: '✨', el: 'arcane', desc: 'Fires bolts at the nearest enemy.',        evo: 'multi', evoName: 'Arcane Barrage' },
  daggers:   { name: 'Throwing Knives', icon: '🔪', el: 'blade',  desc: 'Throws knives the way you are moving.',    evo: 'haste', evoName: 'Blade Storm' },
  orbit:     { name: 'Orbit Blades',    icon: '🌙', el: 'blade',  desc: 'Blades circle around you.',                evo: 'area',  evoName: 'Blade Halo' },
  aura:      { name: 'Holy Aura',       icon: '☀️', el: 'arcane', desc: 'Burns every enemy close to you.',          evo: 'vital', evoName: 'Sanctuary' },
  lightning: { name: 'Chain Lightning', icon: '⚡', el: 'storm',  desc: 'Zaps enemies and chains between them.',    evo: 'luck',  evoName: 'Thunder God' },
  bomb:      { name: 'Bombs',           icon: '💣', el: 'fire',   desc: 'Lobs bombs that explode in an area.',      evo: 'might', evoName: 'Meteor Shower' },
  boomerang: { name: 'Boomerang',       icon: '🪃', el: 'blade',  desc: 'Flies out and back, piercing everything.', evo: 'swift', evoName: 'Cyclone' },
  frost:     { name: 'Frost Nova',      icon: '❄️', el: 'frost',  desc: 'Blasts nearby enemies and slows them.',    evo: 'armor', evoName: 'Absolute Zero' },
  fire:      { name: 'Fire Trail',      icon: '🔥', el: 'fire',   desc: 'Leaves burning ground where you walk.',    evo: 'crit',  evoName: 'Inferno' },
  shards:    { name: 'Ice Shards',      icon: '🧊', el: 'frost',  desc: 'Fires a spread of shards that chill.',     evo: 'magnet', evoName: 'Glacier Spray' },
  storm:     { name: 'Storm Totem',     icon: '🌩️', el: 'storm',  desc: 'Drops a totem that zaps anything near it.', evo: 'growth', evoName: 'Tempest Pillar' },
};
const ELEMENTS = {
  fire:   { icon: '🔥', name: 'Fire',   color: '#ff8a3c', b2: 'Kills have a 20% chance to burst into flame.', b4: '+30% fire damage and burning ground lasts longer.' },
  frost:  { icon: '❄️', name: 'Frost',  color: '#8fe8ff', b2: 'All hits chill enemies (15% slower).', b4: 'Chilled enemies take +30% damage.' },
  storm:  { icon: '⚡', name: 'Storm',  color: '#fff27a', b2: 'Every 4 seconds, lightning hits a random enemy.', b4: 'That lightning chains to 4 more enemies.' },
  blade:  { icon: '🗡️', name: 'Blade',  color: '#dfe8ff', b2: '+10% crit chance.', b4: 'Crits deal 3× instead of 2×.' },
  arcane: { icon: '✨', name: 'Arcane', color: '#c9a8ff', b2: '+1 projectile.', b4: 'Your ultimate charges 50% faster.' },
};
const PASSIVES = {
  might:  { name: 'Might',     icon: '💪', desc: '+10% damage', max: 5 },
  haste:  { name: 'Haste',     icon: '⏱️', desc: '-8% weapon cooldowns', max: 5 },
  swift:  { name: 'Swiftness', icon: '👟', desc: '+8% move speed', max: 5 },

const SAVE_KEY = 'riftRunnersSave_v1';
function defaultSave() {
  return { v: 2, shards: 0, meta: {}, chars: { knight: true, ranger: true }, maxHeat: 0, heat: 0, ach: {}, daily: {}, run: null, lastChar: ['knight', 'ranger'], seenHelp: false,
    gems: 250, col: { rat: { n: 1 }, snail: { n: 1 }, candle: { n: 1 }, duck: { n: 1 }, frog: { n: 1 } }, team: ['snail', 'rat', 'candle', 'frog'], buddies: ['rat', 'duck'], pity: { e: 0, l: 0 }, freePull: '', tower: { best: 0 }, tbAuto: false, tbSpeed: 1,
    opt: { vol: .7, music: true, shake: true },
    stats: { runs: 0, kills: 0, bosses: 0, wins: 0, coopWins: 0, bestAct: 1, elites: 0, gold: 0, playTime: 0, shardsEarned: 0, deaths: 0, evolutions: 0, noHit: 0, dailies: 0, heat10: 0, bestLevel: 0, revives: 0, ults: 0, set4: 0, objectives: 0 } };
}
function merge(d, o) { for (const k in o) { if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k]) && d[k] && typeof d[k] === 'object') merge(d[k], o[k]); else d[k] = o[k]; } return d; }
function migrate(s) { // v1 saves (single runner + node map) → v2
  if (!Array.isArray(s.lastChar)) s.lastChar = [s.lastChar || 'knight', 'ranger'];
  s.chars.ranger = true;
  if (s.run && !s.run.players) { const r = s.run; s.shards += Math.round((r.floors || 0) * 3 + (r.kills || 0) / 20 + (r.bosses || 0) * 20 + (r.elites || 0) * 5); s.run = null; } // an old unfinished run can't continue in the new loop — you get its shards
  if (s.run && s.run.squad) delete s.run.squad; // the old per-run squad became the permanent collection
  if (s.run) s.run.wager = 0;
  if (s.run && s.run.doors) s.run.doors.forEach(d => { if (d.t === 'casino' || d.t === 'squad') d.t = 'packs'; });
  if (s.run && s.run.cur && s.run.cur.t === 'squad') s.run.cur = null;
  if (Array.isArray(s.team) && s.team.length === 6) { const o = s.team; s.team = [o[1] || o[0], o[0] || o[2], o[4] || o[3], o[3] || o[5]].map((x, i, arr) => arr.indexOf(x) === i ? x : null); }
  s.v = 2; return s;
}
function loadSave() { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return migrate(merge(defaultSave(), JSON.parse(raw))); } catch (e) {} return defaultSave(); }
let S = loadSave();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function exportCode() { return 'RIFT1:' + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importCode(code) {
  code = code.trim(); if (!code.startsWith('RIFT1:')) throw new Error('bad');
  const obj = JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))));
  if (!obj || typeof obj !== 'object' || !obj.stats) throw new Error('bad');
  S = migrate(merge(defaultSave(), obj)); save();
}

/* ================= SOUND (made in code — no files, works offline) ================= */
const AU = { ctx: null, master: null, music: null, noise: null, last: {}, step: 0, nextT: 0 };
function audioOn() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    AU.ctx = new C(); AU.master = AU.ctx.createGain(); AU.master.connect(AU.ctx.destination);
    AU.music = AU.ctx.createGain(); AU.music.connect(AU.master);
    const len = AU.ctx.sampleRate * .5, b = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = b; setVol();
  } catch (e) { AU.ctx = null; }
}
function setVol() { if (!AU.ctx) return; AU.master.gain.value = S.opt.vol * .5; AU.music.gain.value = S.opt.music ? .22 : 0; }
function tone(f, dur, type = 'square', vol = .15, slide = 0, when = 0, dest) {
  const c = AU.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(g); g.connect(dest || AU.master); o.start(t); o.stop(t + dur + .02);

/* ----- shop (co-op: Tab switches who you are buying for) ----- */
let shopFor = 0;
function showShop() {
  const scale = 1 + .3 * (run.act - 1);
  run.shop = { team: [], p: run.players.map((_, i) => {
    const pl = run.players[i], items = [];
    const ownW = pl.weapons.filter(w => w.lvl < 5).map(w => ({ k: 'wup', id: w.id }));
    const newW = pl.weapons.length < 5 ? Object.keys(WEAPONS).filter(id => !pl.weapons.some(w => w.id === id)).map(id => ({ k: 'wnew', id })) : [];
    const pas = Object.keys(PASSIVES).filter(id => (pl.passives[id] || 0) < PASSIVES[id].max && (pl.passives[id] || Object.keys(pl.passives).length < 5)).map(id => ({ k: pl.passives[id] ? 'pup' : 'pnew', id }));
    shuffle(ownW); shuffle(newW); shuffle(pas);
    if (ownW[0]) items.push({ ...ownW[0], price: Math.round(35 * scale) });
    if (newW[0]) items.push({ ...newW[0], price: Math.round(45 * scale) });
    pas.slice(0, 2).forEach(p => items.push({ ...p, price: Math.round(30 * scale) }));
    return items;
  }) };
  const rel = randomRelics(1)[0]; if (rel) run.shop.team.push({ k: 'relic', id: rel, price: Math.round(90 * scale) });
  run.shop.team.push({ k: 'heal', price: Math.round(20 * scale) });
  shopFor = 0; renderShop();
}
function renderShop() {
  const items = run.shop.p[shopFor].map(it => ({ it, who: shopFor })).concat(run.shop.team.map(it => ({ it, who: -1 })));
  const acts = [];
  const html = items.map(({ it, who }, i) => {
    const d = choiceDesc(it, who < 0 ? 0 : who);
    acts.push(() => {
      if (it.sold || run.gold < it.price) return;
      run.gold -= it.price; it.sold = true; sfx('gold');
      if (it.k === 'relic') { addRelic(it.id); toast(`${RELICS[it.id].icon} ${RELICS[it.id].name}`, '#b48cff'); }
      else if (it.k === 'heal') healPct(.4);
      else applyChoice(it, who);
      renderShop();
    });
    return `<button class="card opt ${d.cls}" data-a="${i}" data-n="${i + 1}" ${it.sold || run.gold < it.price ? 'disabled' : ''}>
      <div class="ci">${d.icon}</div><div class="ct">${d.title}</div><div class="cs">${it.sold ? 'SOLD' : who < 0 ? (it.k === 'heal' ? 'Whole team' : 'Team relic') : d.sub}</div><div class="cd">${d.desc}</div>
      <div class="price">${it.sold ? '—' : it.price + ' 🪙'}</div><kbd>${i + 1}</kbd></button>`;
  }).join('');
  const n = items.length;
  acts.push(() => { if (run.rerolls > 0) { run.rerolls--; showShop(); } });

  acts.push(() => { shopFor = (shopFor + 1) % nP(); renderShop(); });

  screen(`<h2>🛒 Shop</h2><div class="sub">🪙 ${run.gold} gold · ${run.players.map((p, i) => `${PNAME(i)} ❤️ ${Math.ceil(p.hp)}/${calcStats(run, i).maxHp}`).join(' · ')}</div>${tabs}
    <div class="row">${html}</div>
    <div class="row" style="margin-top:14px"><button data-a="${n + 3}" ${run.gold < PACKS.basic.gold ? 'disabled' : ''}>📦 Squad pack · ${PACKS.basic.gold} 🪙 (U)</button><button data-a="${n}" ${run.rerolls > 0 ? '' : 'disabled'}>🎲 Reroll shop (R) · ${run.rerolls} left</button><button data-a="${n + 1}">Leave shop (L) →</button></div>`,
    acts, 'menu', k => { if (k === 'r') { acts[n](); return true; } if (k === 'l' || k === 'escape') { acts[n + 1](); return true; } if (k === 'tab') { acts[n + 2](); return true; } if (k === 'u') { acts[n + 3](); return true; } });

let lvQueue = 0, lvDone = null, lvOpen = false, lvState = null;
function queueLevelUps(n, done) {
  lvQueue += n;

  if (!lvOpen || ui.className === 'hidden') nextLevelUp(); // (re)open the cards if they are not on screen
}
function buildChoices(i) {
  const pl = run.players[i], opts = [], nW = pl.weapons.length, nPs = Object.keys(pl.passives).length;
  for (const w of pl.weapons) {
    const d = WEAPONS[w.id];
    if (w.lvl >= 5 && !w.evo && pl.passives[d.evo]) opts.push({ k: 'evo', id: w.id, w: 100 });
    else if (w.lvl < 5) opts.push({ k: 'wup', id: w.id, w: 10 });
  }
  if (nW < 5) for (const id in WEAPONS) if (!pl.weapons.some(w => w.id === id)) {
    const el = WEAPONS[id].el, owned = pl.weapons.filter(w => WEAPONS[w.id].el === el).length;
    opts.push({ k: 'wnew', id, w: (nW < 3 ? 7 : 4) * (owned ? 1.5 : 1) }); // matching your elements shows up a bit more often
  }
  for (const id in PASSIVES) { const l = pl.passives[id] || 0; if (l > 0 && l < PASSIVES[id].max) opts.push({ k: 'pup', id, w: 7 }); else if (l === 0 && nPs < 5) opts.push({ k: 'pnew', id, w: 4 }); }
  const st = calcStats(run, i);
  const n = Math.min(5, 3 + (S.meta.choice || 0) + (st.luck >= .3 ? 1 : 0));
  const res = opts.filter(o => o.k === 'evo').slice(0, n);
  let rest = opts.filter(o => o.k !== 'evo');
  while (res.length < n && rest.length) { const o = weighted(rest); res.push(o); rest = rest.filter(x => x !== o); }
  if (!res.length) res.push({ k: 'heal' }, { k: 'gold' });
  return res;
}
function choiceDesc(o, i = 0) {

  if (o.k === 'wup') { const w = pl.weapons.find(x => x.id === o.id), d = WEAPONS[o.id]; return { icon: d.icon, title: d.name, sub: `Level ${w.lvl} → ${w.lvl + 1}`, desc: w.lvl + 1 === 5 ? `Max level! Pair with ${PASSIVES[d.evo].icon} ${PASSIVES[d.evo].name} to evolve.` : 'More damage, faster, bigger.', cls: '' }; }
  if (o.k === 'wnew') { const d = WEAPONS[o.id], E = ELEMENTS[d.el], n = pl.weapons.filter(w => WEAPONS[w.id].el === d.el).length + (run.relics.includes('prism') ? 1 : 0);
    return { icon: d.icon, title: d.name, sub: `New weapon · ${E.icon} ${E.name}`, desc: d.desc + (n === 1 ? `<br><small style="color:${E.color}">Completes a ${E.name} set (2)!</small>` : n === 3 ? `<br><small style="color:${E.color}">Completes a ${E.name} set (4)!</small>` : ''), cls: 'new' }; }
  if (o.k === 'pup' || o.k === 'pnew') { const d = PASSIVES[o.id], l = pl.passives[o.id] || 0; const ev = Object.values(WEAPONS).find(w => w.evo === o.id); return { icon: d.icon, title: d.name, sub: l ? `Level ${l} → ${l + 1}` : 'New passive', desc: d.desc + (ev ? ` <br><small>(evolves ${ev.icon})</small>` : ''), cls: l ? '' : 'new' }; }
  if (o.k === 'relic') { const d = RELICS[o.id]; return { icon: d.icon, title: d.name, sub: 'Relic', desc: d.desc, cls: 'relic' }; }
  if (o.k === 'heal') return { icon: '❤️', title: o.price ? 'Potion' : 'Heal', sub: 'Heal', desc: o.price ? 'Everyone heals 40% of max HP.' : 'Heal 30 HP.', cls: '' };
  if (o.k === 'gold') return { icon: '🪙', title: 'Gold', sub: 'Gold', desc: '+25 gold.', cls: '' };
}
function applyChoice(o, i = 0) {
  const pl = run.players[i], before = calcStats(run, i).maxHp;
  if (o.k === 'evo') { const w = pl.weapons.find(x => x.id === o.id); w.evo = true; w.lvl = 6; S.stats.evolutions++; toast(`★ ${WEAPONS[o.id].evoName}! ★`, '#ffb84a'); }
  else if (o.k === 'wup') pl.weapons.find(x => x.id === o.id).lvl++;

  else if (o.k === 'pup' || o.k === 'pnew') pl.passives[o.id] = (pl.passives[o.id] || 0) + 1;

const P2KEYS = ['6', '7', '8', '9', '0'];

}
function pickLv(i, k) {

  applyChoice(lvState.ch[i][k], i); lvState.done[i] = true;
  if (lvState.done.every(Boolean)) { lvQueue--; nextLevelUp(); } else drawLv();
}
function rerollLv(i) { if (!lvState || lvState.done[i] || run.rerolls <= 0) return; run.rerolls--; lvState.ch[i] = buildChoices(i); drawLv(); }
function drawLv() {
  const acts = [];
  const col = i => {
    const ch = lvState.ch[i], done = lvState.done[i], remote = run.online && i === 1 && NET.role === 'host';
    const cards = ch.map((o, k) => { const d = choiceDesc(o, i); acts.push(() => pickLv(i, k)); const key = run.coop ? (i === 0 ? k + 1 : P2KEYS[k]) : k + 1;
      return `<button class="card opt ${d.cls}" data-a="${acts.length - 1}" ${remote || done ? 'disabled' : ''}><div class="ci">${d.icon}</div><div class="ct">${d.title}</div><div class="cs">${d.sub}</div><div class="cd">${d.desc}</div>${remote ? '' : `<kbd>${key}</kbd>`}</button>`; }).join('');
    acts.push(() => rerollLv(i));
    return `<div class="lvcol p${i + 1} ${done ? 'done' : ''}">${run.coop ? `<div class="who p${i + 1}">${PNAME(i)} ${CHARS[run.players[i].char].icon} ${done ? '✅ picked' : remote ? '— partner is choosing…' : ''}</div>` : ''}
      <div class="row">${cards}</div>${remote ? '' : `<button data-a="${acts.length - 1}" ${run.rerolls > 0 && !done ? '' : 'disabled'}>🎲 Reroll (${run.coop ? (i === 0 ? 'R' : 'Backspace') : 'R'}) · ${run.rerolls} left</button>`}</div>`;
  };
  screen(`<h2>⭐ Level Up! ${lvQueue > 1 ? `<span class="tag">${lvQueue} to pick</span>` : ''}</h2><div class="sub">Level ${run.level}${run.coop && !run.online ? ` · Player 1 picks with <b>1-5</b>, Player 2 with <b>6-0</b>` : ''}</div>
