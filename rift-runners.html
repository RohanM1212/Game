<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rift Runners</title>
<style>
:root{--bg:#0b0d14;--panel:#161a26;--panel2:#1f2536;--line:#2c3450;--text:#e8ecf6;--dim:#8d97b3;--acc:#7c9cff;--gold:#ffd24a;--good:#5ee08a;--bad:#ff6070;--purple:#b48cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
canvas{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
#ui.hidden{display:none}
#ui.overlay{background:rgba(5,7,12,.72);justify-content:center}
#ui.menu{background:transparent}
h1{font-size:clamp(34px,6vw,64px);margin:18px 0 4px;letter-spacing:4px;background:linear-gradient(90deg,#7c9cff,#b48cff,#ff7ab8);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
h2{margin:6px 0 12px;font-size:26px;text-align:center}
.sub{color:var(--dim);text-align:center;margin-bottom:18px}
.col{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:min(1100px,100%)}
button{font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;position:relative;transition:transform .08s,border-color .08s}
button:hover:not([disabled]),button:focus:not([disabled]){border-color:var(--acc);outline:none;transform:translateY(-2px);background:var(--panel2)}
button[disabled]{opacity:.4;cursor:default}
button.big{font-size:18px;padding:14px 18px}
kbd{position:absolute;top:6px;right:8px;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:#0006}
.card{width:210px;min-height:190px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 12px}
.card .ci{font-size:40px;line-height:1.2}
.card .ct{font-weight:700;font-size:17px}
.card .cs{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
.card .cd{font-size:14px;color:var(--dim)}
.card.evo{border-color:#ffb84a;box-shadow:0 0 18px #ffb84a55}
.card.evo .cs{color:#ffb84a}
.card.new .cs{color:var(--good)}
.card.relic .cs{color:var(--purple)}
.price{color:var(--gold);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:min(900px,100%)}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;width:min(1000px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px;font-size:15px}
.bar .it{white-space:nowrap}
.icons{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ico{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:14px;white-space:nowrap}
.ico b{font-size:11px;color:var(--gold)}
.map{position:relative;width:min(560px,100%);height:min(62vh,600px);margin:6px auto;flex-shrink:0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,50%);width:48px;height:48px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:22px;text-align:center}
.node:hover:not([disabled]),.node:focus:not([disabled]){transform:translate(-50%,50%) scale(1.15)}
.node.reach{border-color:var(--acc);box-shadow:0 0 14px #7c9cff88;animation:pulse 1.2s infinite}
.node.visited{border-color:var(--good);opacity:.85}
.node.boss{width:64px;height:64px;font-size:30px;border-color:#ff6070}
.node kbd{top:-10px;right:-8px;background:#000}
@keyframes pulse{50%{box-shadow:0 0 22px #7c9cffcc}}
.legend{font-size:13px;color:var(--dim);text-align:center;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;width:min(1000px,100%)}
.mrow{display:flex;gap:10px;align-items:center}
.mrow .mi{font-size:26px}
.mrow .mt{flex:1}
.mrow small{color:var(--dim)}
.pips{letter-spacing:2px;color:var(--acc);font-size:12px}
.locked{filter:grayscale(1)}
.ach{padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.ach.done{border-color:var(--good)}
textarea{width:100%;height:90px;background:#0a0c12;color:var(--text);border:1px solid var(--line);border-radius:8px;font-family:monospace;font-size:12px;padding:8px}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:10}
.toast{background:#1c2233ee;border:1px solid var(--acc);padding:8px 16px;border-radius:10px;font-weight:600;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
p{line-height:1.5}
.help{max-width:760px}
.help li{margin:4px 0;line-height:1.45}
.foot{margin-top:14px;color:var(--dim);font-size:12px;text-align:center}
</style>
</head>

/* ================= SAVE ================= */
const SAVE_KEY = 'riftRunnersSave_v1';
function defaultSave() {
  return { v: 1, shards: 0, meta: {}, chars: { knight: true }, maxHeat: 0, heat: 0, ach: {}, daily: {}, run: null, lastChar: 'knight', seenHelp: false,
    stats: { runs: 0, kills: 0, bosses: 0, wins: 0, bestAct: 1, elites: 0, gold: 0, playTime: 0, shardsEarned: 0, deaths: 0, evolutions: 0, noHit: 0, dailies: 0, heat10: 0, bestLevel: 0 } };
}
function merge(d, o) { for (const k in o) { if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k]) && d[k] && typeof d[k] === 'object') merge(d[k], o[k]); else d[k] = o[k]; } return d; }
function loadSave() { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return merge(defaultSave(), JSON.parse(raw)); } catch (e) {} return defaultSave(); }
let S = loadSave();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function exportCode() { return 'RIFT1:' + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importCode(code) {
  code = code.trim(); if (!code.startsWith('RIFT1:')) throw new Error('bad');
  const obj = JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))));
  if (!obj || typeof obj !== 'object' || !obj.stats) throw new Error('bad');
  S = merge(defaultSave(), obj); save();
}

function calcStats(r) {
  const c = CHARS[r.char].mods, m = S.meta, p = r.passives, b = r.bonus;
  const s = { maxHp: 100, speed: 190, might: 1, cdMul: 1, area: 1, proj: 0, magnet: 70, luck: 0, armor: 0, crit: .05, regen: 0, xpMul: 1, goldMul: 1, dashCd: 1.3, killHeal: 0, chill: 0 };
  s.maxHp += (c.maxHp || 0) + 10 * (m.hp || 0) + 20 * (p.vital || 0) + (b.maxHp || 0);
  s.armor += (c.armor || 0) + (m.armor || 0) + (p.armor || 0);
  s.speed *= 1 + (c.speed || 0) + .04 * (m.speed || 0) + .08 * (p.swift || 0);
  s.crit += (c.crit || 0) + .06 * (p.crit || 0) + (b.crit || 0);
  s.proj += (c.proj || 0) + (p.multi || 0);
  s.area += (c.area || 0) + .12 * (p.area || 0);
  s.might += (c.might || 0) + .05 * (m.power || 0) + .10 * (p.might || 0) + (b.might || 0);
  s.cdMul *= (1 - (c.haste || 0)) * (1 - .03 * (m.haste || 0)) * Math.pow(.92, p.haste || 0);
  s.luck += (c.luck || 0) + .05 * (m.luck || 0) + .10 * (p.luck || 0);
  s.killHeal += c.killHeal || 0;
  s.regen += (c.regen || 0) + .3 * (p.vital || 0);
  s.magnet *= 1 + .15 * (m.magnet || 0) + .35 * (p.magnet || 0);
  s.xpMul *= 1 + .08 * (m.wisdom || 0) + .12 * (p.growth || 0);
  s.goldMul *= 1 + .10 * (m.greed || 0) + .15 * (p.greed || 0) + (b.gold || 0);
  s.chill += c.chill || 0;
  const R = id => r.relics.includes(id);
  if (R('glass')) { s.might += .4; s.maxHp *= .7; }
  if (R('boots')) s.dashCd *= .6;
  if (R('coin')) { s.goldMul += .25; s.luck += .1; }
  if (R('core')) s.magnet *= 2;
  if (R('crown')) s.xpMul *= 1.4;
  if (R('clover')) s.luck += .1;
  if (R('overclock')) s.cdMul *= .85;
  if (R('chrono')) s.chill += .12;
  if (R('heart')) s.maxHp += 40;
  if (R('twin')) s.proj += 1;
  if (R('dice')) s.crit += .15;
  s.crit += s.luck * .3;
  s.maxHp = Math.max(10, Math.round(s.maxHp));
  s.cdMul = Math.max(.3, s.cdMul);
  return s;
}
const xpNeed = l => Math.floor(5 + (l - 1) * 6 + Math.pow(l - 1, 1.6));
function getHp() { return mode === 'fight' ? P.hp : run.hp; }
function setHp(v) { v = clamp(v, 0, calcStats(run).maxHp); if (mode === 'fight') P.hp = v; else run.hp = v; }
function healPct(p) { setHp(getHp() + calcStats(run).maxHp * p); }

function addRelic(id) {
  if (run.relics.includes(id)) return;
  const before = calcStats(run).maxHp;
  run.relics.push(id);
  if (id === 'phoenix') run.revives++;
  if (id === 'clover') run.rerolls += 3;
  const after = calcStats(run).maxHp;
  if (after > before) setHp(getHp() + after - before); else setHp(Math.min(getHp(), after));
  if (mode === 'fight') ST = calcStats(run);
}

function newRun(charId, heat, daily) {

/* ================= MAP ================= */
function genMap(act) {
  const rows = [], R = 7;
  for (let r = 0; r < R; r++) {
    const n = r === 0 ? ri(2, 3) : ri(2, 4), row = [];
    for (let i = 0; i < n; i++) {
      let t;
      if (r === 0) t = 'fight';
      else if (r === R - 1) t = 'rest';
      else t = weighted([{ t: 'fight', w: 44 }, { t: 'elite', w: r >= 2 ? 16 : 0 }, { t: 'event', w: 22 }, { t: 'shop', w: r >= 2 ? 10 : 0 }, { t: 'rest', w: r >= 3 ? 6 : 0 }, { t: 'treasure', w: 5 }]).t;
      row.push({ t, x: (i + 1) / (n + 1) + (rnd() - .5) * .06, next: [] });
    }
    rows.push(row);
  }
  // guarantee variety
  const mid = rows.slice(2, R - 1).flat();
  if (!mid.some(n => n.t === 'shop')) pick(mid.filter(n => n.t === 'fight') .length ? mid.filter(n => n.t === 'fight') : mid).t = 'shop';
  if (!mid.some(n => n.t === 'elite')) { const f = mid.filter(n => n.t === 'fight'); if (f.length) pick(f).t = 'elite'; }
  rows.push([{ t: 'boss', x: .5, next: [] }]);
  for (let r = 0; r < rows.length - 1; r++) {
    const a = rows[r], b = rows[r + 1];
    a.forEach((node, i) => {
      const pos = a.length === 1 ? .5 : i / (a.length - 1);
      const j = Math.round(pos * (b.length - 1));
      node.next.push(j);
      if (rnd() < .55) { const j2 = j + (rnd() < .5 ? -1 : 1); if (j2 >= 0 && j2 < b.length && !node.next.includes(j2)) node.next.push(j2); }
    });
    b.forEach((node, j) => {
      if (!a.some(n => n.next.includes(j))) { let best = 0, bd = 9; a.forEach((n, i) => { const d = Math.abs(n.x - node.x); if (d < bd) { bd = d; best = i; } }); a[best].next.push(j); }
    });
  }
  return rows;
}
function reachable() {
  const rows = run.map;
  if (run.pos.r < 0) return rows[0].map((_, i) => [0, i]);
  if (run.pos.r >= rows.length - 1) return [];
  return rows[run.pos.r][run.pos.i].next.map(j => [run.pos.r + 1, j]);
}

/* ================= LEVEL UPS ================= */
let lvQueue = 0, lvDone = null, lvOpen = false;
function queueLevelUps(n, done) { lvQueue += n; if (done) lvDone = done; if (!lvOpen) nextLevelUp(); }
function buildChoices() {
  const opts = [], nW = run.weapons.length, nP = Object.keys(run.passives).length;
  for (const w of run.weapons) {
    const d = WEAPONS[w.id];
    if (w.lvl >= 5 && !w.evo && run.passives[d.evo]) opts.push({ k: 'evo', id: w.id, w: 100 });
    else if (w.lvl < 5) opts.push({ k: 'wup', id: w.id, w: 10 });
  }
  if (nW < 5) for (const id in WEAPONS) if (!run.weapons.some(w => w.id === id)) opts.push({ k: 'wnew', id, w: nW < 3 ? 7 : 4 });
  for (const id in PASSIVES) { const l = run.passives[id] || 0; if (l > 0 && l < PASSIVES[id].max) opts.push({ k: 'pup', id, w: 7 }); else if (l === 0 && nP < 5) opts.push({ k: 'pnew', id, w: 4 }); }
  const st = calcStats(run);
  const n = Math.min(5, 3 + (S.meta.choice || 0) + (st.luck >= .3 ? 1 : 0));
  const res = opts.filter(o => o.k === 'evo').slice(0, n);
  let rest = opts.filter(o => o.k !== 'evo');
  while (res.length < n && rest.length) { const o = weighted(rest); res.push(o); rest = rest.filter(x => x !== o); }
  if (!res.length) res.push({ k: 'heal' }, { k: 'gold' });
  return res;
}
function choiceDesc(o) {

  if (o.k === 'wup') { const w = run.weapons.find(x => x.id === o.id), d = WEAPONS[o.id]; return { icon: d.icon, title: d.name, sub: `Level ${w.lvl} → ${w.lvl + 1}`, desc: w.lvl + 1 === 5 ? `Max level! Pair with ${PASSIVES[d.evo].icon} ${PASSIVES[d.evo].name} to evolve.` : 'More damage, faster, bigger.', cls: '' }; }
  if (o.k === 'wnew') { const d = WEAPONS[o.id]; return { icon: d.icon, title: d.name, sub: 'New weapon', desc: d.desc, cls: 'new' }; }
  if (o.k === 'pup' || o.k === 'pnew') { const d = PASSIVES[o.id], l = run.passives[o.id] || 0; const ev = Object.values(WEAPONS).find(w => w.evo === o.id); return { icon: d.icon, title: d.name, sub: l ? `Level ${l} → ${l + 1}` : 'New passive', desc: d.desc + (ev ? ` <br><small>(evolves ${ev.icon})</small>` : ''), cls: l ? '' : 'new' }; }
  if (o.k === 'relic') { const d = RELICS[o.id]; return { icon: d.icon, title: d.name, sub: 'Relic', desc: d.desc, cls: 'relic' }; }
  if (o.k === 'heal') return { icon: '❤️', title: o.price ? 'Potion' : 'Heal', sub: 'Heal', desc: o.price ? 'Heal 40% of max HP.' : 'Heal 30 HP.', cls: '' };

}
function applyChoice(o) {

  else if (o.k === 'wup') run.weapons.find(x => x.id === o.id).lvl++;

    const ch = buildChoices();

      <div class="row">${ch.map((o, i) => { const d = choiceDesc(o); return `<button class="card opt ${d.cls}" data-a="${i}" data-n="${i + 1}"><div class="ci">${d.icon}</div><div class="ct">${d.title}</div><div class="cs">${d.sub}</div><div class="cd">${d.desc}</div><kbd>${i + 1}</kbd></button>`; }).join('')}</div>
      <div class="row" style="margin-top:14px"><button data-a="${ch.length}" ${run.rerolls > 0 ? '' : 'disabled'}>🎲 Reroll (R) · ${run.rerolls} left</button></div>`,
      acts, 'overlay', k => { if (k === 'r') { acts[acts.length - 1](); return true; } if (k === 'escape') return true; });
    inputLock = performance.now() + 380;
  }
  draw(choices);

const WORLD = 2400;

  // timer
  cx.textAlign = 'center'; cx.font = 'bold 22px system-ui,sans-serif';
  if (G.type !== 'boss') { const left = Math.max(0, Math.ceil(G.dur - G.time)); cx.fillStyle = '#fff'; cx.fillText(`${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`, VW / 2, 36); }
  cx.font = '13px system-ui,sans-serif'; cx.fillStyle = '#fffa';
  cx.fillText(`Act ${run.act} · ${actInfo(run.act).name}${G.type === 'elite' ? ' · ELITE' : ''}`, VW / 2, G.type === 'boss' ? 30 : 54);
  // boss bar
  if (G.boss) {
    const b = G.boss, bw = Math.min(560, VW * .7);
    cx.fillStyle = '#000a'; cx.fillRect(VW / 2 - bw / 2, 40, bw, 16);
    cx.fillStyle = b.color; cx.fillRect(VW / 2 - bw / 2, 40, bw * Math.max(0, b.hp / b.maxHp), 16);
    cx.strokeStyle = '#fff6'; cx.strokeRect(VW / 2 - bw / 2, 40, bw, 16);
    cx.font = 'bold 13px system-ui,sans-serif'; cx.fillStyle = '#fff'; cx.fillText(b.name, VW / 2, 53);
    const d = Math.hypot(b.x - P.x, b.y - P.y);
    if (d > Math.min(VW, VH) / 2) { const a = Math.atan2(b.y - P.y, b.x - P.x), r = Math.min(VW, VH) / 2 - 40; cx.save(); cx.translate(VW / 2 + Math.cos(a) * r, VH / 2 + Math.sin(a) * r); cx.rotate(a); cx.fillStyle = '#ff6070'; cx.beginPath(); cx.moveTo(14, 0); cx.lineTo(-8, -9); cx.lineTo(-8, 9); cx.fill(); cx.restore(); }
  }
  // weapons / passives
  cx.textAlign = 'left'; cx.font = '20px system-ui,sans-serif';
  let x = 14; const y = VH - 16;
  for (const w of run.weapons) { cx.fillStyle = '#0008'; cx.fillRect(x - 3, y - 24, 34, 30); cx.fillStyle = '#fff'; cx.fillText(WEAPONS[w.id].icon, x, y); cx.font = 'bold 11px system-ui'; cx.fillStyle = w.evo ? '#ffb84a' : '#ffd24a'; cx.fillText(w.evo ? '★' : w.lvl, x + 22, y + 2); cx.font = '20px system-ui,sans-serif'; x += 38; }
  x += 8;
  for (const k in run.passives) { cx.fillStyle = '#0008'; cx.fillRect(x - 3, y - 24, 34, 30); cx.fillStyle = '#fff'; cx.fillText(PASSIVES[k].icon, x, y); cx.font = 'bold 11px system-ui'; cx.fillStyle = '#ffd24a'; cx.fillText(run.passives[k], x + 22, y + 2); cx.font = '20px system-ui,sans-serif'; x += 38; }
  // dash
  cx.textAlign = 'right'; cx.font = 'bold 13px system-ui,sans-serif'; cx.fillStyle = P.dashCd > 0 ? '#fff6' : '#7fe3ff';
  cx.fillText(P.dashCd > 0 ? 'DASH ' + P.dashCd.toFixed(1) : 'DASH READY [Space]', VW - 14, VH - 16);
  cx.fillStyle = '#fff8'; cx.fillText('Esc: pause', VW - 14, 30);
  // banner
  if (G.banner) { cx.textAlign = 'center'; cx.globalAlpha = Math.min(1, G.banner.t * 2); cx.font = 'bold 32px system-ui,sans-serif'; cx.fillStyle = '#000a'; cx.fillText(G.banner.text, VW / 2 + 2, VH * .28 + 2); cx.fillStyle = '#fff'; cx.fillText(G.banner.text, VW / 2, VH * .28); cx.globalAlpha = 1; }
  // low hp vignette
  if (P.hp / st.maxHp < .3) { cx.strokeStyle = `rgba(255,40,60,${.25 + .15 * Math.sin(G.now * 6)})`; cx.lineWidth = 30; cx.strokeRect(0, 0, VW, VH); }
}
const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.8 + .3, v: Math.random() * .02 + .005 }));
function renderMenuBg(dt) {
  const g = cx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#0d1020'); g.addColorStop(1, '#150c22');
  cx.fillStyle = g; cx.fillRect(0, 0, VW, VH);
  cx.fillStyle = '#9fb4ff';
  for (const s of stars) { s.y -= s.v * dt; if (s.y < 0) { s.y = 1; s.x = Math.random(); } cx.globalAlpha = .3 + s.s / 3; cx.fillRect(s.x * VW, s.y * VH, s.s, s.s); }
  cx.globalAlpha = 1;
}

/* ================= INPUT & LOOP ================= */
addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (mode === 'fight' && !paused) {
    if (k === ' ' && !e.repeat) dash();
    if ((k === 'escape' || k === 'p') && !e.repeat) pauseMenu();
    return;
  }
  if (ui.className === 'hidden' || e.repeat && !k.startsWith('arrow')) return;
  if (performance.now() < inputLock) return;
  if (keyHook && keyHook(k) === true) return;
  if (/^[1-9]$/.test(k)) { const b = ui.querySelector(`button[data-n="${k}"]:not([disabled])`); if (b) { b.focus({ preventScroll: true }); b.click(); } return; }
  if (k.startsWith('arrow')) {
    const bs = [...ui.querySelectorAll('button:not([disabled])')]; if (!bs.length) return;
    let i = bs.indexOf(document.activeElement);
    i = (k === 'arrowup' || k === 'arrowleft') ? (i <= 0 ? bs.length - 1 : i - 1) : (i + 1) % bs.length;
    bs[i].focus(); return;
  }
  if (k === 'enter') { e.preventDefault(); const b = document.activeElement; if (b && b.tagName === 'BUTTON' && ui.contains(b) && !b.disabled) b.click(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (mode === 'fight' && !paused) pauseMenu(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'fight' && !paused) pauseMenu(); });

let last = performance.now(), saveTimer = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  S.stats.playTime += dt;
  saveTimer += dt; if (saveTimer > 20) { saveTimer = 0; if (mode !== 'fight') save(); }
  try {
    if ((mode === 'fight' || mode === 'dead') && G) { if (!paused && mode === 'fight') update(dt); else if (mode === 'dead') { for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; } } render(); }
    else renderMenuBg(dt);
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
showTitle();
requestAnimationFrame(loop);
</script>
