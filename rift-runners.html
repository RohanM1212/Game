<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0d14">
<title>Rift Runners</title>
<style>
:root{--bg:#0b0d14;--panel:#161a26;--panel2:#1f2536;--line:#2c3450;--text:#e8ecf6;--dim:#8d97b3;--acc:#7c9cff;--gold:#ffd24a;--good:#5ee08a;--bad:#ff6070;--purple:#b48cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
canvas{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
#ui.hidden{display:none}
#ui.overlay{background:radial-gradient(ellipse at center,rgba(22,16,44,.7),rgba(3,4,8,.9));justify-content:center;animation:fade .25s both}
#ui.menu{background:transparent}
#ui:not(.hidden)>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) backwards}
#ui>*:nth-child(2){animation-delay:.05s}#ui>*:nth-child(3){animation-delay:.1s}#ui>*:nth-child(4){animation-delay:.15s}#ui>*:nth-child(5){animation-delay:.2s}#ui>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes fade{from{opacity:0}}
h1{font-size:clamp(34px,6vw,64px);margin:18px 0 4px;letter-spacing:4px;background:linear-gradient(90deg,#7c9cff,#b48cff,#ff7ab8,#7c9cff);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;animation:shine 8s linear infinite;filter:drop-shadow(0 0 22px rgba(150,120,255,.45))}
h1.title{font-size:clamp(44px,9vw,96px);font-weight:900;letter-spacing:8px;animation:shine 8s linear infinite,breathe 4s ease-in-out infinite}
@keyframes shine{to{background-position:300% center}}
@keyframes breathe{50%{filter:drop-shadow(0 0 36px rgba(180,140,255,.75))}}
h2{margin:6px 0 12px;font-size:26px;text-align:center;text-shadow:0 0 18px rgba(124,156,255,.35)}
h2.pop{font-size:34px;color:#ffe27a;text-shadow:0 0 22px rgba(255,184,74,.7);animation:popin .55s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes popin{from{opacity:0;transform:scale(.4)}}
.sub{color:var(--dim);text-align:center;margin-bottom:18px}
.col{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:min(1100px,100%);perspective:900px}
button{font:inherit;color:var(--text);background:linear-gradient(180deg,#1c2133,#141826);border:2px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;position:relative;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .14s cubic-bezier(.2,1.4,.4,1),border-color .14s,box-shadow .14s,background .14s}
button:hover:not([disabled]),button:focus:not([disabled]){border-color:var(--acc);outline:none;transform:translateY(-3px);background:linear-gradient(180deg,#252c46,#1a2034);box-shadow:0 8px 26px rgba(124,156,255,.28),inset 0 1px 0 rgba(255,255,255,.09)}
button:active:not([disabled]){transform:translateY(0) scale(.98)}
button::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.1) 50%,transparent 65%);background-size:250% 100%;background-position:130% 0;transition:background-position .7s;pointer-events:none}
button:hover:not([disabled])::after,button:focus:not([disabled])::after{background-position:-30% 0}
button[disabled]{opacity:.4;cursor:default}
button.big{font-size:18px;padding:14px 18px}
kbd{position:absolute;top:6px;right:8px;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:#0006}
.card{width:210px;min-height:190px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 12px;animation:cardin .5s cubic-bezier(.2,1.1,.3,1) backwards}
.row>.card:nth-child(2){animation-delay:.07s}.row>.card:nth-child(3){animation-delay:.14s}.row>.card:nth-child(4){animation-delay:.21s}.row>.card:nth-child(n+5){animation-delay:.28s}
@keyframes cardin{from{opacity:0;transform:translateY(30px) rotateX(35deg) scale(.88)}}
.card .ci{font-size:40px;line-height:1.2;transition:transform .25s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.card:hover:not([disabled]) .ci,.card:focus:not([disabled]) .ci{transform:scale(1.22) rotate(-8deg)}
.card .ct{font-weight:700;font-size:17px}
.card .cs{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
.card .cd{font-size:14px;color:var(--dim)}
.card.evo{border-color:#ffb84a;box-shadow:0 0 18px #ffb84a55;animation:cardin .5s cubic-bezier(.2,1.1,.3,1) backwards,evoglow 1.4s ease-in-out infinite}
@keyframes evoglow{50%{box-shadow:0 0 34px #ffb84aaa,inset 0 0 18px #ffb84a33}}
.card.evo .cs{color:#ffb84a}
.card.new .cs{color:var(--good)}
.card.relic{border-color:#5a4588}
.card.relic .cs{color:var(--purple)}
.card.relic:hover:not([disabled]),.card.relic:focus:not([disabled]){border-color:var(--purple);box-shadow:0 8px 28px rgba(180,140,255,.35)}
.price{color:var(--gold);font-weight:700}
.panel{background:linear-gradient(180deg,rgba(26,31,48,.92),rgba(18,22,34,.92));border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:min(900px,100%);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;width:min(1000px,100%);background:linear-gradient(180deg,rgba(28,33,52,.9),rgba(20,24,38,.9));border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.bar .it{white-space:nowrap}
.prism{font-weight:800;background:linear-gradient(90deg,#ff6a6a,#ffd24a,#5ee08a,#4fb8ff,#c49cff,#ff6a6a);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3s linear infinite}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(460px,92vw);margin-top:8px}.tgrid .opt.sm{padding:9px 12px;font-size:14px;min-height:0}.tgrid .opt.sm .tag{display:none}
.card{position:relative}.mast{position:absolute;top:6px;left:8px;font-size:12px;font-weight:700;color:var(--gold)}
.buildg{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(900px,96vw);max-height:62vh;overflow:auto}.buildg h3{margin:6px 0 4px;color:var(--gold);font-size:15px}.brow{display:flex;gap:8px;align-items:flex-start;margin:5px 0;text-align:left}.brow .bi{font-size:20px;width:26px;flex:none}.brow small{color:var(--dim)}@media(max-width:640px){.buildg{grid-template-columns:1fr}}
.teamb{flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}.teamb .it{opacity:.45;font-size:13px}.teamb .it.on{opacity:1;color:var(--gold)}
.icons{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ico{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:14px;white-space:nowrap}
.ico b{font-size:11px;color:var(--gold)}
.map{position:relative;width:min(560px,100%);height:max(440px,min(62vh,600px));margin:6px auto;flex-shrink:0}
.map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map line.nx{animation:march .9s linear infinite;filter:drop-shadow(0 0 4px #ffd24a)}
@keyframes march{to{stroke-dashoffset:-16}}
.node{position:absolute;transform:translate(-50%,50%);width:48px;height:48px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:22px;text-align:center;background:radial-gradient(circle at 35% 30%,#2a3150,#141826 70%);overflow:visible}
.node::after{display:none}
.node:hover:not([disabled]),.node:focus:not([disabled]){transform:translate(-50%,50%) scale(1.18)}
.node.reach{border-color:var(--gold);box-shadow:0 0 16px #ffd24a88;animation:pulse 1.2s infinite}
.node.visited{border-color:var(--good);opacity:.85;background:radial-gradient(circle at 35% 30%,#1f4030,#141826 70%)}
.node.boss{width:64px;height:64px;font-size:30px;border-color:#ff6070;box-shadow:0 0 22px #ff607066;background:radial-gradient(circle at 35% 30%,#4a2030,#181018 70%)}
.node kbd{top:-10px;right:-8px;background:#000}
@keyframes pulse{50%{box-shadow:0 0 28px #ffd24acc;transform:translate(-50%,50%) scale(1.08)}}
.legend{font-size:13px;color:var(--dim);text-align:center;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;width:min(1000px,100%)}
.mrow{display:flex;gap:10px;align-items:center}
.mrow .mi{font-size:26px}
.mrow .mt{flex:1}
.mrow small{color:var(--dim)}
.pips{letter-spacing:2px;color:var(--acc);font-size:12px}
.locked{filter:grayscale(1)}
.ach{padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.ach.done{border-color:var(--good);box-shadow:inset 0 0 14px rgba(94,224,138,.12)}
textarea{width:100%;height:90px;background:#0a0c12;color:var(--text);border:1px solid var(--line);border-radius:8px;font-family:monospace;font-size:12px;padding:8px}
#vig,#vigR,#vigS{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6) 100%)}
#vigR{background:radial-gradient(ellipse at center,transparent 40%,rgba(255,0,32,.75) 100%);opacity:0}
#vigS{background:radial-gradient(ellipse at center,transparent 45%,rgba(255,16,48,.55) 100%);opacity:0}
.team{gap:10px}
.pslot{width:96px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;text-align:center;font-size:22px;border-style:dashed}
.pslot.full{border-style:solid;border-color:var(--rc);box-shadow:0 0 14px color-mix(in srgb,var(--rc) 40%,transparent)}
.pslot img{width:64px;height:64px}.pslot small{font-size:11px;color:var(--dim)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;width:min(1100px,100%)}
.pcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:10px;border-color:var(--rc);background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 14%,#161a26),#141826)}
.pcard img{width:72px;height:72px}.pcard .pn{font-weight:800}.pcard .pr{font-size:12px;color:var(--rc);letter-spacing:1px}
.pcard .pd{font-size:12px;color:var(--dim)}.pcard .pbtn{margin-top:4px;font-size:12px;font-weight:700;color:var(--acc)}
.pcard.inteam{box-shadow:0 0 0 2px var(--rc),0 0 22px color-mix(in srgb,var(--rc) 45%,transparent)}.pcard.inteam .pbtn{color:var(--good)}
.pcard.locked{opacity:.55}.pcard.sum{width:150px}
.capbtn .capicon{position:static;inset:auto;width:90px;height:90px}
#ui.packui{background:transparent;justify-content:flex-end;cursor:pointer}
.packhint{color:rgba(255,255,255,.55);font-size:13px;margin-bottom:18px}
.node .gb{position:absolute;bottom:-8px;right:-8px;font-size:14px;background:#0b0d14;border:1px solid #ffd24a;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.legend.goals{display:flex;flex-direction:column;gap:2px;color:#ffe9a8}
img.ic{width:1.15em;height:1.15em;vertical-align:-.22em;display:inline-block}
.card .ci img.ic{width:52px;height:52px}
.node img.ic{width:26px;height:26px}
.node.boss img.ic{width:36px;height:36px}
.node .gb img.ic{width:15px;height:15px}
.card.syn{border-color:#c49cff;box-shadow:0 0 22px #b45cff77}
.card.syn .cs{color:#d8b8ff}
#touch{position:fixed;inset:0;pointer-events:none;z-index:5;touch-action:none}#touch.off{display:none}
#joy{position:absolute;left:0;bottom:0;width:50%;height:60%;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle,#ffffff55,#ffffff18);border:2px solid #ffffff66;display:none;box-shadow:0 0 0 46px #ffffff10,0 0 0 48px #ffffff30}
#tbtns{position:absolute;right:16px;bottom:22px;display:grid;grid-template-columns:repeat(2,64px);gap:12px;pointer-events:auto}
.tb{width:64px;height:64px;border-radius:50%;padding:0;text-align:center;font-weight:900;font-size:16px;border:3px solid var(--c);background:conic-gradient(color-mix(in srgb,var(--c) 45%,transparent) calc(var(--k,1)*360deg),#0b0d14cc 0);color:#fff;touch-action:none}
.tb.big{grid-column:span 2;width:140px;border-radius:32px}
.tb.dim{opacity:.35}
#tpause{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;padding:0;text-align:center;font-weight:900;pointer-events:auto}
body.touch .keys-hint{display:none}
@media (max-height:520px){.node{width:38px;height:38px}.node img.ic{width:20px;height:20px}.node.boss{width:48px;height:48px}h2{font-size:20px;margin:2px 0 6px}.bar{padding:4px 10px;font-size:13px;margin-bottom:6px}.card{min-height:150px;padding:10px 8px}.card .ci img.ic{width:38px;height:38px}#ui{padding:10px 10px}}
.dmgbars{margin:10px 0;display:flex;flex-direction:column;gap:4px}.db{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:8px;font-size:13px}.db i{height:10px;border-radius:5px;background:linear-gradient(90deg,#7c9cff,#b48cff)}.db b{text-align:right}
.hist{display:flex;flex-direction:column;gap:4px;font-size:14px}
.actcard{text-align:center;animation:popin .7s cubic-bezier(.2,1.2,.3,1) backwards}.actcard .an{letter-spacing:8px;color:var(--ac);font-weight:800;font-size:15px}.actcard .at{font-size:clamp(36px,7vw,72px);font-weight:900;color:#fff;text-shadow:0 0 30px var(--ac),0 0 60px var(--ac)}.actcard .al{max-width:560px;margin:10px auto 0;color:var(--dim);font-style:italic;font-size:17px}.actcard .ah{margin-top:12px;font-size:13px;letter-spacing:2px;color:#ff8a9a}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:10}
.toast{background:linear-gradient(180deg,#232a40f2,#181d2df2);border:1px solid var(--acc);padding:9px 18px;border-radius:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 18px rgba(124,156,255,.25);animation:tin .45s cubic-bezier(.2,1.6,.4,1),tout .4s ease-in 2.2s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.85)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
p{line-height:1.5}
.help{max-width:760px}
.help li{margin:4px 0;line-height:1.45}
.foot{margin-top:14px;color:var(--dim);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vigS"></div><div id="vigR"></div><div id="vig"></div>
<div id="touch" class="off"><div id="joy"><div id="knob"></div></div>
<div id="tbtns"><button class="tb" data-k="r" style="--c:#c49cff">R</button><button class="tb" data-k="q" style="--c:#ffd24a">Q</button><button class="tb" data-k="e" style="--c:#9fe08a">E</button><button class="tb big" data-k=" " style="--c:#7fe3ff">DASH</button></div>
<button id="tpause">II</button></div>
<div id="ui"></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   RIFT RUNNERS - an action roguelite with route-planning strategy.
   Single-file, offline, progress saved in localStorage + export codes.
   ===================================================================== */
const $ = s => document.querySelector(s);
const cv = $('#c'), cx = cv.getContext('2d'), ui = $('#ui');
let VW = 0, VH = 0;
function resize() { VW = cv.width = innerWidth; VH = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

/* ---------- seeded RNG (so Daily Challenge is the same for everyone) ---------- */
const RNG = { s: 1, next() { let t = (this.s = (this.s + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; } };
const rnd = () => RNG.next();
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function weighted(list) { let tot = 0; for (const o of list) tot += o.w; let r = rnd() * tot; for (const o of list) { r -= o.w; if (r <= 0) return o; } return list[list.length - 1]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h | 0; }
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ================= DATA ================= */
const WEAPONS = {
  wand:      { name: 'Magic Bolt',      icon: '✨', desc: 'Fires bolts at the nearest enemy.',            evo: 'multi', evoName: 'Arcane Lance' },
  daggers:   { name: 'Throwing Knives', icon: '🔪', desc: 'Throws knives the way you are moving.',        evo: 'haste', evoName: 'Blade Storm' },
  orbit:     { name: 'Orbit Blades',    icon: '🌙', desc: 'Blades circle around you.',                    evo: 'area',  evoName: 'Blade Halo' },
  aura:      { name: 'Holy Aura',       icon: '☀️', desc: 'Burns every enemy close to you.',              evo: 'vital', evoName: 'Sanctuary' },
  lightning: { name: 'Chain Lightning', icon: '⚡', desc: 'Zaps enemies and chains between them.',        evo: 'luck',  evoName: 'Thunder God' },
  bomb:      { name: 'Sticky Charges',  icon: '💣', desc: 'Sticks charges on enemies. Bigger crowd, bigger boom.', evo: 'might', evoName: 'Chain Reaction' },
  boomerang: { name: 'Ricochet Blade',  icon: '🪃', desc: 'Bounces between enemies, faster and stronger each hit.', evo: 'swift', evoName: 'Shatterstorm' },
  frost:     { name: 'Frost Nova',      icon: '❄️', desc: 'Blasts nearby enemies and slows them.',        evo: 'armor', evoName: 'Absolute Zero' },
  scythe:    { name: 'Spirit Scythe',   icon: '🌙', desc: 'Sweeps a huge arc in front of you.',            evo: 'growth', evoName: 'Death Spiral' },
  drones:    { name: 'Rift Drones',     icon: '🗼', desc: 'Drones circle you and shoot nearby enemies.',    evo: 'magnet', evoName: 'Drone Swarm' },
  fire:      { name: 'Fire Trail',      icon: '🔥', desc: 'Leaves burning ground where you walk.',        evo: 'crit',  evoName: 'Inferno' },
};
const PASSIVES = {
  might:  { name: 'Might',     icon: '💪', desc: '+10% damage', max: 5 },
  haste:  { name: 'Haste',     icon: '⏱️', desc: '-8% weapon cooldowns', max: 5 },
  swift:  { name: 'Swiftness', icon: '👟', desc: '+8% move speed', max: 5 },
  vital:  { name: 'Vitality',  icon: '❤️', desc: '+20 max HP, +0.3 HP/sec regen', max: 5 },
  magnet: { name: 'Magnet',    icon: '🧲', desc: '+35% pickup range', max: 5 },
  multi:  { name: 'Multishot', icon: '🎯', desc: '+1 projectile / blade / bomb', max: 3 },
  area:   { name: 'Expanse',   icon: '🌀', desc: '+12% attack size', max: 5 },
  luck:   { name: 'Luck',      icon: '🍀', desc: '+10% luck (crits, gold, extra choices)', max: 5 },
  armor:  { name: 'Armor',     icon: '🛡️', desc: '-1 damage taken per hit', max: 5 },
  crit:   { name: 'Precision', icon: '🗡️', desc: '+6% critical hit chance', max: 5 },
  growth: { name: 'Growth',    icon: '📈', desc: '+12% XP gained', max: 5 },
  greed:  { name: 'Greed',     icon: '💰', desc: '+15% gold gained', max: 5 },
};
const RELICS = {
  fang:      { name: 'Vampire Fang',    icon: '🦷', desc: 'Kills have an 8% chance to heal 2 HP.' },
  glass:     { name: 'Glass Cannon',    icon: '🧪', desc: '+40% damage, but -30% max HP.' },
  boots:     { name: 'Winged Boots',    icon: '👢', desc: 'Dash recharges 40% faster.' },
  thorns:    { name: 'Thorn Mail',      icon: '🌵', desc: 'Enemies that touch you take 30 damage.' },
  coin:      { name: 'Lucky Coin',      icon: '🪙', desc: '+25% gold and +10% luck.' },
  phoenix:   { name: 'Phoenix Feather', icon: '🪶', desc: 'Revive once at 50% HP.' },

function merge(d, o) { for (const k in o) { if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k]) && d[k] && typeof d[k] === 'object') merge(d[k], o[k]); else d[k] = o[k]; } return d; }
function loadSave() { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return merge(defaultSave(), JSON.parse(raw)); } catch (e) {} return defaultSave(); }
let S = loadSave();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function exportCode() { return 'RIFT1:' + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importCode(code) {
  code = code.trim(); if (!code.startsWith('RIFT1:')) throw new Error('bad');
  const obj = JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))));
  if (!obj || typeof obj !== 'object' || !obj.stats) throw new Error('bad');
  S = merge(defaultSave(), obj); save();
}

function calcStats(r) {
  const c = CHARS[r.char].mods, m = S.meta, p = r.passives, b = r.bonus;
  const s = { maxHp: 100, speed: 190, might: 1, cdMul: 1, area: 1, proj: 0, magnet: 70, luck: 0, armor: 0, crit: .05, regen: 0, xpMul: 1, goldMul: 1, dashCd: 1.3, killHeal: 0, chill: 0 };
  s.maxHp += (c.maxHp || 0) + 10 * (m.hp || 0) + 20 * (p.vital || 0) + (b.maxHp || 0);
  s.armor += (c.armor || 0) + (m.armor || 0) + (p.armor || 0);
  s.speed *= 1 + (c.speed || 0) + .04 * (m.speed || 0) + .08 * (p.swift || 0);
  s.crit += (c.crit || 0) + .06 * (p.crit || 0) + (b.crit || 0);
  s.proj += (c.proj || 0) + (p.multi || 0);
  s.area += (c.area || 0) + .12 * (p.area || 0);
  s.might += (c.might || 0) + .05 * (m.power || 0) + .10 * (p.might || 0) + (b.might || 0);
  s.cdMul *= (1 - (c.haste || 0)) * (1 - .03 * (m.haste || 0)) * Math.pow(.92, p.haste || 0);
  s.luck += (c.luck || 0) + .05 * (m.luck || 0) + .10 * (p.luck || 0);
  s.killHeal += c.killHeal || 0;
  s.regen += (c.regen || 0) + .3 * (p.vital || 0);
  s.magnet *= 1 + .15 * (m.magnet || 0) + .35 * (p.magnet || 0);
  s.xpMul *= 1 + .08 * (m.wisdom || 0) + .12 * (p.growth || 0);
  s.goldMul *= 1 + .10 * (m.greed || 0) + .15 * (p.greed || 0) + (b.gold || 0);
  s.chill += c.chill || 0;
  const R = id => r.relics.includes(id);
  if (R('glass')) { s.might += .4; s.maxHp *= .7; }
  if (R('boots')) s.dashCd *= .6;
  if (R('coin')) { s.goldMul += .25; s.luck += .1; }
  if (R('core')) s.magnet *= 2;
  if (R('crown')) s.xpMul *= 1.4;
  if (R('clover')) s.luck += .1;
  if (R('overclock')) s.cdMul *= .85;
  if (R('chrono')) s.chill += .12;
  if (R('heart')) s.maxHp += 40;
  if (R('twin')) s.proj += 1;
  if (R('dice')) s.crit += .15;
  if (R('quiver')) { s.proj += 1; s.might -= .1; }
  if (r.mut) { if (r.mut.includes('gold')) s.goldMul *= 2; if (r.mut.includes('glass')) s.maxHp *= .6; if (r.mut.includes('swarm')) s.xpMul *= 1.4; if (r.mut.includes('vamp')) s.killHeal += .4; if (r.mut.includes('haste')) s.speed *= 1.15; if (r.mut.includes('lucky')) s.crit += .25; }
  if (R('heartstone')) s.killHeal += .2;
  if (R('gildheart')) s.maxHp += Math.floor(r.gold / 20);
  if (G && G.buff && r === run) { const k = G.buff.k; if (k === 'might') s.might += .4; if (k === 'haste') s.cdMul *= .7; if (k === 'swift') s.speed *= 1.3; }
  if (r === run) { s.luck += petBonus('luck'); s.goldMul += petBonus('gold'); s.magnet += petBonus('magnet'); }
  s.crit += s.luck * .3;
  s.maxHp = Math.max(10, Math.round(s.maxHp));
  s.cdMul = Math.max(.3, s.cdMul);
  const tb = teamBonus(); s.might += tb.might; s.maxHp += tb.hp;
  return s;
}
const xpNeed = l => Math.floor(5 + (l - 1) * 6 + Math.pow(l - 1, 1.6));
// Pet team bonuses: two pets sharing a role bond (+25% power each), and four different roles give a small boost to you.
function teamBonus() {
  const team = (S.team || []).filter(id => PETS[id] && S.pets[id]), roles = {};
  for (const id of team) roles[PETS[id].role] = (roles[PETS[id].role] || 0) + 1;
  const n = Object.keys(roles).length, legend = team.filter(id => PETS[id].r >= 4).length;
  return { roles, bond: r => roles[r] >= 2 ? 1.25 : 1, variety: n >= 4, might: (n >= 4 ? .06 : 0) + (legend >= 2 ? .05 : 0), hp: n >= 4 ? 15 : 0, legend };
}
function teamBonusHtml() {
  const tb = teamBonus(), out = [];
  for (const r in tb.roles) if (tb.roles[r] >= 2) out.push(`<span class="it on">${ROLES[r].icon} ${ROLES[r].name} Bond: +25% power</span>`);
  out.push(`<span class="it ${tb.variety ? 'on' : ''}">✨ Variety (4 roles): +6% damage, +15 HP</span>`);
  out.push(`<span class="it ${tb.legend >= 2 ? 'on' : ''}">👑 Two Legendaries: +5% damage</span>`);
  return `<div class="bar teamb">${out.join('')}</div>`;
}
function getHp() { return mode === 'fight' ? P.hp : run.hp; }
function setHp(v) { v = clamp(v, 0, calcStats(run).maxHp); if (mode === 'fight') P.hp = v; else run.hp = v; }
function healPct(p) { setHp(getHp() + calcStats(run).maxHp * p * (heat(4) ? .7 : 1)); }

function addRelic(id) {
  S.codex.relic[id] = 1;
  if (run.relics.includes(id)) return;
  const before = calcStats(run).maxHp;
  run.relics.push(id);
  if (id === 'phoenix') run.revives++;
  if (id === 'clover') run.rerolls += 3;
  const after = calcStats(run).maxHp;
  if (after > before) setHp(getHp() + after - before); else setHp(Math.min(getHp(), after));
  if (mode === 'fight') ST = calcStats(run);
}
function randomRelics(n) { return shuffle(Object.keys(RELICS).filter(k => !run.relics.includes(k))).slice(0, n); }

  run = { char: charId, heat, daily: daily ? todayStr() : null, act: 1, map: null, pos: { r: -1, i: -1 }, path: [], target: null,
    level: 1, xp: 0, gold: 20 + 20 * (S.meta.gold || 0), weapons: [{ id: c.weapon || pick(Object.keys(WEAPONS)), lvl: 1, evo: false }],
    passives: {}, relics: [], bonus: {}, rerolls: (S.meta.reroll || 0) + (c.mods.rerolls || 0), revives: S.meta.revive || 0,
    kills: 0, elites: 0, bosses: 0, floors: 0, curse: 0, endless: false, won: false, seed: 0, hp: 0 };
  run.dseed = seed; run.syn = {}; if (heat >= 9) run.curse = 1;

/* ================= MAP ================= */
function genMap(act) {
  const rows = [], R = 7;
  for (let r = 0; r < R; r++) {
    const n = r === 0 ? ri(2, 3) : ri(2, 4), row = [];
    for (let i = 0; i < n; i++) {
      let t;
      if (r === 0) t = 'fight';
      else if (r === R - 1) t = 'rest';
      else t = weighted([{ t: 'fight', w: 44 }, { t: 'elite', w: r >= 2 ? 16 : 0 }, { t: 'event', w: 22 }, { t: 'shop', w: r >= 2 ? 10 : 0 }, { t: 'rest', w: r >= 3 ? 6 : 0 }, { t: 'forge', w: r >= 2 ? 4 : 0 }, { t: 'gamble', w: r >= 1 ? 4 : 0 }, { t: 'challenge', w: r >= 2 ? 6 : 0 }, { t: 'treasure', w: 5 }]).t;
      row.push({ t, x: (i + 1) / (n + 1) + (rnd() - .5) * .06, next: [] });
    }
    rows.push(row);
  }
  // guarantee variety
  const mid = rows.slice(2, R - 1).flat();
  if (!mid.some(n => n.t === 'shop')) pick(mid.filter(n => n.t === 'fight') .length ? mid.filter(n => n.t === 'fight') : mid).t = 'shop';
  if (!mid.some(n => n.t === 'elite')) { const f = mid.filter(n => n.t === 'fight'); if (f.length) pick(f).t = 'elite'; }
  rows.forEach((row, r) => row.forEach(n => { if (n.t === 'fight') n.o = pickGoal(act, r); if (n.t === 'challenge') { let g; do g = pickGoal(act, Math.max(1, r)); while (g === 'survive'); n.o = g; } }));
  rows.push([{ t: 'boss', x: .5, next: [] }]);
  for (let r = 0; r < rows.length - 1; r++) {
    const a = rows[r], b = rows[r + 1];
    a.forEach((node, i) => {
      const pos = a.length === 1 ? .5 : i / (a.length - 1);
      const j = Math.round(pos * (b.length - 1));
      node.next.push(j);
      if (rnd() < .55) { const j2 = j + (rnd() < .5 ? -1 : 1); if (j2 >= 0 && j2 < b.length && !node.next.includes(j2)) node.next.push(j2); }
    });
    b.forEach((node, j) => {
      if (!a.some(n => n.next.includes(j))) { let best = 0, bd = 9; a.forEach((n, i) => { const d = Math.abs(n.x - node.x); if (d < bd) { bd = d; best = i; } }); a[best].next.push(j); }
    });
  }
  return rows;
}
function reachable() {
  const rows = run.map;
  if (run.pos.r < 0) return rows[0].map((_, i) => [0, i]);
  if (run.pos.r >= rows.length - 1) return [];
  return rows[run.pos.r][run.pos.i].next.map(j => [run.pos.r + 1, j]);
}

    cx.textAlign = 'left'; cx.font = '700 11px system-ui,sans-serif'; cx.fillStyle = ready ? '#fff' : 'rgba(255,255,255,.55)'; cx.fillText(label.length > 19 ? label.slice(0, 18) + '…' : label, dx + 50, y + 18);
    if (rest !== '') { cx.textAlign = 'right'; cx.fillStyle = 'rgba(255,255,255,.6)'; cx.fillText(rest, dx + dw - 8, y + 18); }
  });
  // pets bar + shrine buff
  G.pets.forEach((pt, i) => { const x = 16 + i * 30, y = 92; cx.fillStyle = 'rgba(8,10,20,.6)'; cx.beginPath(); cx.arc(x + 12, y + 12, 13, 0, 6.283); cx.fill(); cx.strokeStyle = RAR[pt.d.r].c; cx.lineWidth = 1.5; cx.stroke(); drawPet(cx, pt.id, x + 12, y + 13, 7, t, false); });
  if (G.buff) { cx.textAlign = 'left'; cx.font = '800 12px system-ui,sans-serif'; cx.fillStyle = BUFFS[G.buff.k].c; cx.fillText(BUFFS[G.buff.k].n.split(':')[0] + ' ' + Math.ceil(G.buff.t) + 's', 16, 136); }
  cx.textAlign = 'right'; cx.font = '600 12px system-ui,sans-serif'; if (!TOUCH.on) { cx.fillStyle = 'rgba(255,255,255,.45)'; cx.fillText('Esc · Pause', VW - 14, 30); }
  // combo counter

    const pop = 1 + Math.max(0, G.comboT - 2.3) * 2, c = G.combo >= 100 ? '#ff7ab8' : G.combo >= 50 ? '#ffd24a' : '#bfe0ff';
    cx.save(); cx.translate(VW - 24, 96); cx.scale(pop, pop); cx.globalAlpha = Math.min(1, G.comboT);
    cx.textAlign = 'right'; cx.font = '900 30px system-ui,sans-serif'; cx.fillStyle = c; cx.shadowColor = c; cx.shadowBlur = 12; cx.fillText(G.combo, 0, 0); cx.shadowBlur = 0;
    cx.font = '800 11px system-ui,sans-serif'; cx.fillStyle = 'rgba(255,255,255,.75)'; cx.fillText('COMBO', 0, 16);
    cx.fillStyle = c; cx.fillRect(-60, 22, 60 * Math.min(1, G.comboT / 2.5), 3);
    cx.restore(); cx.globalAlpha = 1;
  }
  // banner
  if (G.banner) {
    const b = G.banner, age = b.max - b.t, inK = Math.min(1, age / .25), outK = Math.min(1, b.t / .35), al = Math.min(inK, outK), sc = 1 + (1 - easeOut(inK)) * .6, by = VH * .27;
    cx.globalAlpha = al * .9; const bh = b.sub ? 80 : 60, bg3 = cx.createLinearGradient(0, 0, VW, 0);
    bg3.addColorStop(0, 'rgba(0,0,0,0)'); bg3.addColorStop(.5, 'rgba(0,0,0,.6)'); bg3.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = bg3; cx.fillRect(0, by - 38, VW, bh);
    const lg = cx.createLinearGradient(0, 0, VW, 0); lg.addColorStop(0, rgba(b.color, 0)); lg.addColorStop(.5, rgba(b.color, .8)); lg.addColorStop(1, rgba(b.color, 0));
    cx.fillStyle = lg; const lw = VW * easeOut(inK); cx.fillRect(VW / 2 - lw / 2, by - 38, lw, 2); cx.fillRect(VW / 2 - lw / 2, by - 38 + bh - 2, lw, 2);
    cx.globalAlpha = al; cx.save(); cx.translate(VW / 2, by); const fit = Math.min(1, VW / 860); cx.scale(sc * fit, sc * fit);
    cx.textAlign = 'center'; cx.font = '900 34px system-ui,sans-serif'; cx.shadowColor = b.color; cx.shadowBlur = 20; cx.fillStyle = b.color === '#ffffff' ? '#fff' : shade(b.color, .35); cx.fillText(b.text, 0, 12); cx.shadowBlur = 0;
    if (b.sub) { cx.font = '700 13px system-ui,sans-serif'; if ('letterSpacing' in cx) cx.letterSpacing = '3px'; cx.fillStyle = 'rgba(255,255,255,.75)'; cx.fillText(b.sub, 0, 34); if ('letterSpacing' in cx) cx.letterSpacing = '0px'; }

// Title / map background: a swirling rift with stars falling into it.
const stars = Array.from({ length: 90 }, () => ({ a: Math.random() * 6.283, d: Math.random(), s: Math.random() * 1.6 + .4, v: .03 + Math.random() * .1 }));
let menuT = 0;
let menuCache = null, menuKey = '';
function renderMenuBg(dt) {
  menuT += dt;
  cx.setTransform(1, 0, 0, 1, 0, 0); norm();
  const th = run ? actInfo(run.act) : null, key = (th ? th.name : 'title') + VW + 'x' + VH;
  if (key !== menuKey) { // the nebula + rift swirl is painted once, at low resolution
    menuKey = key; const w = Math.ceil(VW / 3), h = Math.ceil(VH / 3), D = Math.ceil(Math.hypot(w, h));

    for (let i = 0; i < 5; i++) { const an = i * 1.3, r = Math.max(w, h) * .38; g.globalAlpha = .1; g.drawImage(glowSprite(cols[i % 3]), c0 + Math.cos(an) * w * .3 - r, c0 + Math.sin(an * 1.3) * h * .25 - r, r * 2, r * 2); }
    for (let arm = 0; arm < 3; arm++) for (let j = 0; j < 26; j++) { const k = j / 26, an = arm * 2.094 + k * 4.4, rad = 5 + k * Math.min(w, h) * .48, r = 9 + k * 24; g.globalAlpha = .09 * (1 - k * .8); g.drawImage(glowSprite(cols[arm]), c0 + Math.cos(an) * rad - r, c0 + Math.sin(an) * rad * .5 - r, r * 2, r * 2); }
    g.globalAlpha = .12; g.drawImage(glowSprite('#ffffff'), c0 - 45, c0 - 45, 90, 90);

  cx.fillStyle = gr; cx.fillRect(0, 0, VW, VH);
  const cxp = VW / 2, cyp = VH * .5, R = Math.hypot(VW, VH) * .6, D = menuCache.width * 3;
  cx.save(); cx.translate(cxp, cyp); cx.rotate(menuT * .05); cx.globalCompositeOperation = 'lighter'; cx.drawImage(menuCache, -D / 2, -D / 2, D, D); cx.restore(); norm();
  cx.strokeStyle = '#c8d4ff';

}

/* ================= FIRST-TIME TIPS ================= */
function hint(id, text) { if (!G || S.hints[id] || G.hint) return; S.hints[id] = 1; save(); G.hint = { text, t: 5.5, max: 5.5 }; }
function hintTick(dt) {
  if (G.hint && (G.hint.t -= dt) <= 0) G.hint = null;
  if (G.time < 2 || G.ending) return;
  const key = k => TOUCH.on ? 'Tap ' + k : 'Press ' + k;
  if (P.skillCd <= 0 && G.time > 4) hint('skill', `${key('E')} for your class skill: ${SKILLS[run.char].name}. ${SKILLS[run.char].desc}`);
  if (P.ult >= 100) hint('ult', `Your ultimate is charged! ${key('Q')} for ${ULT_NAMES[run.char]}.`);
  if (run.art) hint('art', `${key('R')} to use your Rift Art: ${ARTS[run.art].name}.`);
  if (G.goal && G.goal.key !== 'survive') hint('goal', 'This fight has a goal (top of the screen). Arrows at the edge point to objectives.');
  if (G.enemies.some(e => e.elite && !e.dead)) hint('elite', 'Elites are tough but drop lots of XP. The colored dots under them are extra powers.');
  if (P.hp < ST.maxHp * .35) hint('lowhp', 'Low HP! Healing wells, campfires and some pets can patch you up.');
  for (const p of G.props) {
    const d = Math.hypot(p.x - P.x, p.y - P.y);
    if (p.shrine && !p.used && d < 220) hint('shrine', 'Stand inside a shrine for a few seconds to get a blessing.');
    if (p.barrel && !p.dead && d < 200) hint('barrel', 'Shoot red barrels to blow up the enemies around them (careful, they hurt you too).');
    if (p.chest && !p.dead && d < 200) hint('chest', 'Walk into chests for gold plus HP or ultimate charge.');
  }
  if (G.boss && G.bossIntro <= 0) hint('boss', 'Boss fight! Bosses change their attacks as they lose HP. Watch for red warning shapes.');
}
function drawHint() {
  if (!G.hint) return;
  const h = G.hint, a = Math.min(1, (h.max - h.t) * 4, h.t * 2), w = Math.min(VW - 40, 620), x = VW / 2 - w / 2, y = VH - (TOUCH.on ? 200 : 128);
  cx.globalAlpha = a; cx.fillStyle = 'rgba(12,14,26,.92)'; rr(x, y, w, 44, 14); cx.fill(); cx.strokeStyle = '#ffd24a'; cx.lineWidth = 1.5; cx.stroke();
  cx.textAlign = 'center'; cx.font = `700 ${VW < 600 ? 12 : 14}px system-ui,sans-serif`; cx.fillStyle = '#fff3c4';
  const words = h.text.split(' '); let line1 = '', line2 = ''; for (const wd of words) { if (cx.measureText(line1 + ' ' + wd).width < w - 30 && !line2) line1 += (line1 ? ' ' : '') + wd; else line2 += (line2 ? ' ' : '') + wd; }
  if (line2) { cx.fillText('💡 ' + line1, VW / 2, y + 19); cx.fillText(line2, VW / 2, y + 36); } else cx.fillText('💡 ' + line1, VW / 2, y + 27);
  cx.globalAlpha = 1;
}

/* ================= TOUCH CONTROLS ================= */
const TOUCH = { on: false, id: null, ox: 0, oy: 0, jx: 0, jy: 0 };
(function setupTouch() {
  const joy = $('#joy'), knob = $('#knob'), wrap = $('#touch');
  const enable = () => { if (!TOUCH.on) { TOUCH.on = true; document.body.classList.add('touch'); } };
  addEventListener('touchstart', enable, { passive: true });
  joy.addEventListener('pointerdown', e => { TOUCH.id = e.pointerId; TOUCH.ox = e.clientX; TOUCH.oy = e.clientY; knob.style.display = 'block'; knob.style.left = e.clientX + 'px'; knob.style.top = e.clientY + 'px'; try { joy.setPointerCapture(e.pointerId); } catch (_) {} e.preventDefault(); });
  joy.addEventListener('pointermove', e => {
    if (e.pointerId !== TOUCH.id) return;
    let dx = e.clientX - TOUCH.ox, dy = e.clientY - TOUCH.oy; const d = Math.hypot(dx, dy), R = 50;
    if (d > R) { TOUCH.ox += dx * (1 - R / d); TOUCH.oy += dy * (1 - R / d); dx = e.clientX - TOUCH.ox; dy = e.clientY - TOUCH.oy; } // the stick follows your thumb
    knob.style.left = TOUCH.ox + dx + 'px'; knob.style.top = TOUCH.oy + dy + 'px';
    const m = Math.hypot(dx, dy); TOUCH.jx = m > 8 ? dx / m : 0; TOUCH.jy = m > 8 ? dy / m : 0;
  });
  const end = e => { if (e.pointerId !== TOUCH.id) return; TOUCH.id = null; TOUCH.jx = TOUCH.jy = 0; knob.style.display = 'none'; };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  wrap.querySelectorAll('.tb').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); audioInit(); const k = b.dataset.k; if (mode !== 'fight' || paused) return; if (k === ' ') dash(); else if (k === 'e') useSkill(); else if (k === 'q') useUlt(); else if (k === 'r') useArt(); }));
  $('#tpause').addEventListener('pointerdown', e => { e.preventDefault(); pauseMenu(); });
})();
let touchUiT = 0;
function touchUi(dt) {
  const show = TOUCH.on && mode === 'fight' && !paused && G;
  $('#touch').className = show ? '' : 'off';
  if (!show || (touchUiT -= dt) > 0) return; touchUiT = .1;
  const set = (k, v, dim) => { const b = document.querySelector(`.tb[data-k="${k}"]`); b.style.setProperty('--k', clamp(v, 0, 1).toFixed(2)); b.classList.toggle('dim', !!dim); };
  set(' ', twist('juggernaut') ? 0 : P.dashCd <= 0 ? 1 : 1 - P.dashCd / ST.dashCd, twist('juggernaut'));
  set('e', P.skillCd <= 0 ? 1 : 1 - P.skillCd / (SKILLS[run.char].cd * ST.cdMul));
  set('q', P.ult / 100);
  set('r', !run.art ? 0 : P.artCd <= 0 ? 1 : 1 - P.artCd / ARTS[run.art].cd, !run.art);
}

/* ================= INPUT & LOOP ================= */
addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (k === 'm' && !e.repeat && mode !== 'pack') { S.opt.sound = S.opt.music = !(S.opt.sound !== false || S.opt.music !== false); audioVol(); save(); toast(S.opt.sound ? '🔔 Sound on' : '🔕 Sound off'); }
  if (mode === 'fight' && !paused) {
    if (k === ' ' && !e.repeat) dash();
    if (k === 'e' && !e.repeat) useSkill();
    if ((k === 'q' || k === 'shift') && !e.repeat) useUlt();
    if (k === 'r' && !e.repeat) useArt();
    if ((k === 'escape' || k === 'p') && !e.repeat) pauseMenu();
    return;
  }
  if (mode === 'pack') { if ((k === ' ' || k === 'enter') && !e.repeat) packNext(); if (k === 'escape') packSkip(); return; }
  if (ui.className === 'hidden' || e.repeat && !k.startsWith('arrow')) return;
  if (performance.now() < inputLock) return;
  if (keyHook && keyHook(k) === true) return;
  if (/^[1-9]$/.test(k)) { const b = ui.querySelector(`button[data-n="${k}"]:not([disabled])`); if (b) { b.focus({ preventScroll: true }); b.click(); } return; }
  if (k.startsWith('arrow')) {
    const bs = [...ui.querySelectorAll('button:not([disabled])')]; if (!bs.length) return;
    let i = bs.indexOf(document.activeElement);
    i = (k === 'arrowup' || k === 'arrowleft') ? (i <= 0 ? bs.length - 1 : i - 1) : (i + 1) % bs.length;
    bs[i].focus(); return;
  }
  if (k === 'enter') { e.preventDefault(); const b = document.activeElement; if (b && b.tagName === 'BUTTON' && ui.contains(b) && !b.disabled) b.click(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (mode === 'fight' && !paused) pauseMenu(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'fight' && !paused) pauseMenu(); });

// One frame of the game: hit-stop, slow-motion, the level-up flourish, then drawing.
function step(rdt, draw = true) {
  if ((mode === 'fight' || mode === 'dead') && G) {
    let dt = 0;
    if (mode === 'fight' && !paused) {
      if (G.stop > 0) G.stop -= rdt;
      else { dt = rdt * (G.slow > 0 || G.lvPending ? .3 : 1); update(dt); }
      if (G && G.slow > 0) G.slow -= rdt;
      if (G && mode === 'fight' && G.lvPending && (G.lvDelay -= rdt) <= 0) openLevelUps();
    } else if (mode === 'dead') { dt = rdt * .35; fxTick(dt); }
    if (draw && G && (mode === 'fight' || mode === 'dead')) render(dt);
  } else if (draw) renderMenuBg(rdt);
}
let last = performance.now(), saveTimer = 0, autoSaver = false;
/* ================= GAMEPAD: left stick moves, A dash, X skill, Y ultimate, B rift art, Start pause ================= */
const PAD = { jx: 0, jy: 0, prev: {}, nav: 0, on: false };
function padKey(k, down) { dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { key: k })); }
function padPoll(dt) {
  const gp = navigator.getGamepads ? [...navigator.getGamepads()].find(g => g && g.connected) : null;
  if (!gp) { if (PAD.on) { PAD.on = false; PAD.jx = PAD.jy = 0; } return; }
  if (!PAD.on) { PAD.on = true; toast('🎮 Controller connected'); }
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0, m = Math.hypot(ax, ay);
  PAD.jx = m > .22 ? ax : 0; PAD.jy = m > .22 ? ay : 0;
  const fight = mode === 'fight' && !paused;
  const map = fight ? { 0: ' ', 2: 'e', 3: 'q', 1: 'r', 5: 'q', 4: ' ', 9: 'escape', 8: 'escape' }
    : mode === 'pack' ? { 0: ' ', 1: 'escape', 9: 'escape' }
    : { 0: 'enter', 9: 'escape', 1: 'escape', 12: 'arrowup', 13: 'arrowdown', 14: 'arrowleft', 15: 'arrowright' };
  for (let i = 0; i < gp.buttons.length; i++) {
    const b = gp.buttons[i], down = b && (b.pressed || b.value > .5), was = PAD.prev[i];

}
function loop(now) {

  const raw = (now - last) / 1000, fighting = mode === 'fight' && !paused;

}
showTitle();
requestAnimationFrame(loop);
</script>
