<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rift Runners</title>
<style>
:root{--bg:#0b0d14;--panel:#161a26;--panel2:#1f2536;--line:#2c3450;--text:#e8ecf6;--dim:#8d97b3;--acc:#7c9cff;--gold:#ffd24a;--good:#5ee08a;--bad:#ff6070;--purple:#b48cff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
canvas{position:fixed;inset:0;display:block}
#ui{position:fixed;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
#ui.hidden{display:none}
#ui.overlay{background:rgba(5,7,12,.72);justify-content:center}
#ui.menu{background:transparent}
#ui.dim{background:rgba(5,7,12,.9)}
h1{font-size:clamp(34px,6vw,64px);margin:18px 0 4px;letter-spacing:4px;background:linear-gradient(90deg,#7c9cff,#b48cff,#ff7ab8);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
h2{margin:6px 0 12px;font-size:26px;text-align:center}
.sub{color:var(--dim);text-align:center;margin-bottom:18px}
.col{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:min(1100px,100%)}
button{font:inherit;color:var(--text);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 16px;cursor:pointer;text-align:left;position:relative;transition:transform .08s,border-color .08s}
button:hover:not([disabled]),button:focus:not([disabled]){border-color:var(--acc);outline:none;transform:translateY(-2px);background:var(--panel2)}
button[disabled]{opacity:.4;cursor:default}
button.big{font-size:18px;padding:14px 18px}
kbd{position:absolute;top:6px;right:8px;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:#0006}
.card{width:210px;min-height:190px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:16px 12px}
.card .ci{font-size:40px;line-height:1.2}
.card .ct{font-weight:700;font-size:17px}
.card .cs{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:1px}
.card .cd{font-size:14px;color:var(--dim)}
.card.evo{border-color:#ffb84a;box-shadow:0 0 18px #ffb84a55}
.card.evo .cs{color:#ffb84a}
.card.new .cs{color:var(--good)}
.card.relic .cs{color:var(--purple)}
.price{color:var(--gold);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;width:min(900px,100%)}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;width:min(1000px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px;font-size:15px}
.bar .it{white-space:nowrap}
.icons{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ico{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px 6px;font-size:14px;white-space:nowrap}
.ico b{font-size:11px;color:var(--gold)}
.map{position:relative;width:min(560px,100%);height:min(62vh,600px);margin:6px auto;flex-shrink:0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,50%);width:48px;height:48px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:22px;text-align:center}
.node:hover:not([disabled]),.node:focus:not([disabled]){transform:translate(-50%,50%) scale(1.15)}
.node.reach{border-color:var(--acc);box-shadow:0 0 14px #7c9cff88;animation:pulse 1.2s infinite}
.node.visited{border-color:var(--good);opacity:.85}
.node.boss{width:64px;height:64px;font-size:30px;border-color:#ff6070}
.node kbd{top:-10px;right:-8px;background:#000}
@keyframes pulse{50%{box-shadow:0 0 22px #7c9cffcc}}
.legend{font-size:13px;color:var(--dim);text-align:center;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;width:min(1000px,100%)}
.mrow{display:flex;gap:10px;align-items:center}
.mrow .mi{font-size:26px}
.mrow .mt{flex:1}
.mrow small{color:var(--dim)}
.pips{letter-spacing:2px;color:var(--acc);font-size:12px}
.locked{filter:grayscale(1)}
.ach{padding:10px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.ach.done{border-color:var(--good)}
textarea{width:100%;height:90px;background:#0a0c12;color:var(--text);border:1px solid var(--line);border-radius:8px;font-family:monospace;font-size:12px;padding:8px}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:10}
.toast{background:#1c2233ee;border:1px solid var(--acc);padding:8px 16px;border-radius:10px;font-weight:600;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
p{line-height:1.5}
.help{max-width:760px}
.help li{margin:4px 0;line-height:1.45}
.foot{margin-top:14px;color:var(--dim);font-size:12px;text-align:center}
.lvsplit{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;width:min(1200px,100%)}
.lvcol{flex:1 1 440px;display:flex;flex-direction:column;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:10px}
.lvcol.p1{border-color:#7c9cff66}.lvcol.p2{border-color:#ff7ab866}
.lvcol .row .card{width:170px;min-height:170px}
.lvcol.done{opacity:.55}
.who{font-weight:800;letter-spacing:1px}
.who.p1{color:#9fb4ff}.who.p2{color:#ff9ac8}
.tabs{display:flex;gap:8px;justify-content:center;margin:6px 0}
.tabs button.on{border-color:var(--acc);background:var(--panel2)}
.obj{font-size:13px;color:var(--gold)}
.keys{font-size:13px;color:var(--dim);text-align:center;line-height:1.7}
.keys b{color:var(--text)}
.codebox{width:100%;height:110px}
.sqboard,.sqbench{display:grid;grid-template-columns:repeat(3,120px);gap:8px;justify-content:center;margin:4px auto}
.sqbench{grid-template-columns:repeat(6,104px)}
.tile{width:100%;height:96px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1px;border-width:2px}
.tile .ti{font-size:30px;line-height:1.1}.tile .tn{font-size:12px;font-weight:700}.tile .ts{font-size:11px;color:var(--gold)}.tile .te{font-size:10px;color:var(--dim)}
.tile.empty{opacity:.45;border-style:dashed}.tile.sel{box-shadow:0 0 0 3px #ffd24a;transform:translateY(-3px)}.tile.enemy{background:#2a1520}
.syn{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}.syn .ico.on{background:#2a3350}
.reels{display:flex;gap:14px;justify-content:center;font-size:58px;margin:6px 0}.reels span{background:#0b0d14;border:2px solid var(--line);border-radius:12px;padding:4px 14px;min-width:84px}
h3{margin:10px 0 4px;text-align:center}
.small{font-size:13px}
@media (max-width:700px){.sqbench{grid-template-columns:repeat(3,104px)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================
   RIFT RUNNERS 2 — co-op action roguelite. Single file, fully offline.
   Loop: clear a room → rift doors open showing their rewards → walk into
   the one you want. 3 biomes + bosses, then Endless. 1-2 players on one
   keyboard (or gamepads), experimental online play by copy-paste codes.
   ===================================================================== */
const $ = s => document.querySelector(s);
const cv = $('#c'), cx = cv.getContext('2d'), ui = $('#ui');
let VW = 0, VH = 0;
function resize() { VW = cv.width = innerWidth; VH = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

/* ---------- seeded RNG (Daily Challenge is the same for everyone) ---------- */
const RNG = { s: 1, next() { let t = (this.s = (this.s + 0x6D2B79F5) | 0); t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; } };
const rnd = () => RNG.next();
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = a => a[Math.floor(rnd() * a.length)];
const rpick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function weighted(list) { let tot = 0; for (const o of list) tot += o.w; let r = rnd() * tot; for (const o of list) { r -= o.w; if (r <= 0) return o; } return list[list.length - 1]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h | 0; }
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ================= DATA ================= */
// el = element for SETS (collect 2 / 4 of an element for a set bonus)
const WEAPONS = {
  wand:      { name: 'Magic Bolt',      icon: '✨', el: 'arcane', desc: 'Fires bolts at the nearest enemy.',        evo: 'multi', evoName: 'Arcane Barrage' },
  daggers:   { name: 'Throwing Knives', icon: '🔪', el: 'blade',  desc: 'Throws knives the way you are moving.',    evo: 'haste', evoName: 'Blade Storm' },
  orbit:     { name: 'Orbit Blades',    icon: '🌙', el: 'blade',  desc: 'Blades circle around you.',                evo: 'area',  evoName: 'Blade Halo' },
  aura:      { name: 'Holy Aura',       icon: '☀️', el: 'arcane', desc: 'Burns every enemy close to you.',          evo: 'vital', evoName: 'Sanctuary' },
  lightning: { name: 'Chain Lightning', icon: '⚡', el: 'storm',  desc: 'Zaps enemies and chains between them.',    evo: 'luck',  evoName: 'Thunder God' },
  bomb:      { name: 'Bombs',           icon: '💣', el: 'fire',   desc: 'Lobs bombs that explode in an area.',      evo: 'might', evoName: 'Meteor Shower' },
  boomerang: { name: 'Boomerang',       icon: '🪃', el: 'blade',  desc: 'Flies out and back, piercing everything.', evo: 'swift', evoName: 'Cyclone' },
  frost:     { name: 'Frost Nova',      icon: '❄️', el: 'frost',  desc: 'Blasts nearby enemies and slows them.',    evo: 'armor', evoName: 'Absolute Zero' },
  fire:      { name: 'Fire Trail',      icon: '🔥', el: 'fire',   desc: 'Leaves burning ground where you walk.',    evo: 'crit',  evoName: 'Inferno' },
  shards:    { name: 'Ice Shards',      icon: '🧊', el: 'frost',  desc: 'Fires a spread of shards that chill.',     evo: 'magnet', evoName: 'Glacier Spray' },
  storm:     { name: 'Storm Totem',     icon: '🌩️', el: 'storm',  desc: 'Drops a totem that zaps anything near it.', evo: 'growth', evoName: 'Tempest Pillar' },
};
const ELEMENTS = {
  fire:   { icon: '🔥', name: 'Fire',   color: '#ff8a3c', b2: 'Kills have a 20% chance to burst into flame.', b4: '+30% fire damage and burning ground lasts longer.' },

};
const PASSIVES = {
  might:  { name: 'Might',     icon: '💪', desc: '+10% damage', max: 5 },
  haste:  { name: 'Haste',     icon: '⏱️', desc: '-8% weapon cooldowns', max: 5 },
  swift:  { name: 'Swiftness', icon: '👟', desc: '+8% move speed', max: 5 },
  vital:  { name: 'Vitality',  icon: '❤️', desc: '+20 max HP, +0.3 HP/sec regen', max: 5 },

const RELICS = {
  fang:      { name: 'Vampire Fang',    icon: '🦷', desc: 'Kills have an 8% chance to heal 2 HP.' },
  glass:     { name: 'Glass Cannon',    icon: '🧪', desc: '+40% damage, but -30% max HP.' },

  core:      { name: 'Magnet Core',     icon: '🧲', desc: 'Double pickup range.' },
  crown:     { name: 'Heavy Crown',     icon: '👑', desc: '+40% XP, but enemies have +15% HP.' },
  berserk:   { name: 'Berserker Band',  icon: '😡', desc: 'Up to +80% damage the lower your HP is.' },
  clover:    { name: 'Four-Leaf Clover',icon: '☘️', desc: '+3 rerolls and +10% luck.' },
  frostheart:{ name: 'Frost Heart',     icon: '🧊', desc: 'Dashing freezes nearby enemies.' },
  idol:      { name: 'Golden Idol',     icon: '🗿', desc: '+30% shards when this run ends.' },

  overclock: { name: 'Overclock',       icon: '⚙️', desc: '-15% weapon cooldowns.' },
  aegis:     { name: 'Aegis',           icon: '🔰', desc: 'Blocks one hit every 12 seconds.' },
  chrono:    { name: 'Chrono Watch',    icon: '⌚', desc: 'Enemies move 12% slower.' },
  heart:     { name: 'Giant Heart',     icon: '💗', desc: '+40 max HP.' },
  twin:      { name: 'Twin Charm',      icon: '♊', desc: '+1 projectile / blade / bomb.' },
  dice:      { name: 'Loaded Dice',     icon: '🎲', desc: '+15% critical hit chance.' },
  battery:   { name: 'Rift Battery',    icon: '🔋', desc: 'Your ultimate charges 35% faster.' },
  prism:     { name: 'Prism',           icon: '🔷', desc: 'Counts as +1 of every element for sets.' },
  bond:      { name: 'Friendship Bracelet', icon: '🤝', desc: 'Co-op: +15% damage while near your partner. Solo: +10% damage.' },
};
// every runner has a weapon, a perk and an ULTIMATE (E / Shift) that charges as you fight
const CHARS = {
  knight:  { name: 'Knight',      icon: '🛡️', color: '#9fb4ff', weapon: 'orbit',     desc: 'Sturdy. +30 max HP, +1 armor.', mods: { maxHp: 30, armor: 1 }, unlock: null,
             ult: { name: 'Bulwark Slam', desc: 'Slam the ground: huge shockwave, 3s of invincibility for you and your partner.' } },
  ranger:  { name: 'Ranger',      icon: '🏹', color: '#7ee08a', weapon: 'daggers',   desc: 'Quick. +12% speed, +10% crit.', mods: { speed: .12, crit: .10 }, unlock: null,
             ult: { name: 'Arrow Rain', desc: 'A storm of arrows falls around you for 4 seconds.' } },
  mage:    { name: 'Mage',        icon: '🔮', color: '#c49cff', weapon: 'wand',      desc: '+1 projectile, +15% area, -15 max HP.', mods: { proj: 1, area: .15, maxHp: -15 }, unlock: { text: 'Kill 500 enemies (total)', test: s => s.stats.kills >= 500 },
             ult: { name: 'Meteor', desc: 'A giant meteor crashes into the biggest crowd.' } },
  bomber:  { name: 'Bomber',      icon: '💣', color: '#ffae5c', weapon: 'bomb',      desc: '+25% area, +10% damage.', mods: { area: .25, might: .10 }, unlock: { text: 'Defeat a boss', test: s => s.stats.bosses >= 1 },
             ult: { name: 'Carpet Bomb', desc: 'Drop 16 bombs all around you.' } },
  pyro:    { name: 'Pyro',        icon: '🔥', color: '#ff7a5c', weapon: 'fire',      desc: '+10% speed, +1 HP/sec regen.', mods: { speed: .10, regen: 1 }, unlock: { text: 'Reach Biome 2', test: s => s.stats.bestAct >= 2 },
             ult: { name: 'Firestorm', desc: 'A ring of fire rolls outward, burning everything.' } },
  vampire: { name: 'Vampire',     icon: '🧛', color: '#ff5c8a', weapon: 'aura',      desc: 'Heals 0.5 HP per kill.', mods: { killHeal: .5 }, unlock: { text: 'Kill 3,000 enemies (total)', test: s => s.stats.kills >= 3000 },
             ult: { name: 'Blood Moon', desc: 'Drain every enemy on screen and heal from it.' } },
  cryo:    { name: 'Cryomancer',  icon: '🧊', color: '#7fe3ff', weapon: 'frost',     desc: '+20% area, enemies 8% slower.', mods: { area: .2, chill: .08 }, unlock: { text: 'Defeat 10 elites (total)', test: s => s.stats.elites >= 10 },
             ult: { name: 'Blizzard', desc: 'Freeze every enemy on screen for 3 seconds.' } },
  gambler: { name: 'Gambler',     icon: '🎲', color: '#ffd24a', weapon: null,        desc: 'Random weapon. +30% luck, +2 rerolls.', mods: { luck: .3, rerolls: 2 }, unlock: { text: 'Collect 2,000 gold (total)', test: s => s.stats.gold >= 2000 },
             ult: { name: 'Jackpot', desc: 'Casts a random ultimate — sometimes two!' } },
  storm:   { name: 'Stormcaller', icon: '⚡', color: '#fff27a', weapon: 'lightning', desc: '-10% cooldowns, +15% luck.', mods: { haste: .10, luck: .15 }, unlock: { text: 'Win a run', test: s => s.stats.wins >= 1 },
             ult: { name: 'Thunderstorm', desc: '24 lightning bolts strike across the screen.' } },
  boomer:  { name: 'Boomer',      icon: '🪃', color: '#c8a26b', weapon: 'boomerang', desc: '+15% damage, +10% speed.', mods: { might: .15, speed: .10 }, unlock: { text: 'Evolve a weapon', test: s => s.stats.evolutions >= 1 },
             ult: { name: 'Cyclone', desc: '8 giant boomerangs spiral out and back.' } },
  frostling:{ name: 'Frostling',  icon: '❄️', color: '#bfefff', weapon: 'shards',    desc: '+10% crit, enemies 5% slower.', mods: { crit: .1, chill: .05 }, unlock: { text: 'Win a co-op run', test: s => s.stats.coopWins >= 1 },
             ult: { name: 'Blizzard', desc: 'Freeze every enemy on screen for 3 seconds.' } },
};
const META = [
  { id: 'hp',     name: 'Toughness',  icon: '❤️', desc: '+10 max HP',              max: 10, base: 12 },
  { id: 'power',  name: 'Power',      icon: '💪', desc: '+5% damage',              max: 10, base: 15 },
  { id: 'speed',  name: 'Agility',    icon: '👟', desc: '+4% move speed',          max: 5,  base: 15 },
  { id: 'haste',  name: 'Focus',      icon: '⏱️', desc: '-3% cooldowns',           max: 5,  base: 20 },
  { id: 'magnet', name: 'Attraction', icon: '🧲', desc: '+15% pickup range',       max: 5,  base: 10 },
  { id: 'greed',  name: 'Fortune',    icon: '💰', desc: '+10% gold',               max: 5,  base: 12 },
  { id: 'wisdom', name: 'Wisdom',     icon: '📈', desc: '+8% XP',                  max: 5,  base: 15 },
  { id: 'luck',   name: 'Luck',       icon: '🍀', desc: '+5% luck',                max: 5,  base: 18 },
  { id: 'armor',  name: 'Plating',    icon: '🛡️', desc: '+1 armor',                max: 3,  base: 40 },
  { id: 'gold',   name: 'Head Start', icon: '🪙', desc: '+20 starting gold',       max: 5,  base: 10 },
  { id: 'reroll', name: 'Reroll',     icon: '🎲', desc: '+1 reroll per run',       max: 5,  base: 30 },
  { id: 'revive', name: 'Second Life',icon: '👼', desc: '+1 team revive per run',  max: 2,  base: 150 },
  { id: 'choice', name: 'Insight',    icon: '🔎', desc: '+1 extra level-up choice',max: 1,  base: 250 },
  { id: 'ultc',   name: 'Charged Up', icon: '🔋', desc: 'Start each room with +20% ultimate', max: 3, base: 40 },
];
const metaCost = (m, lvl) => Math.round(m.base * Math.pow(lvl + 1, 1.6));
// enemies. Each has a job, so rooms feel different depending on who shows up.
const ENEMIES = {
  grunt:    { hp: 14, spd: 72,  dmg: 7,  r: 12, xp: 1, color: '#e0564a' },

const SCALES = [[0, 3, 5, 7, 10], [0, 1, 5, 7, 8], [0, 2, 3, 7, 9], [0, 3, 6, 7, 10], [0, 2, 5, 7, 11], [0, 3, 5, 6, 10]];

/* ================= INPUT: 2 players on one keyboard + gamepads ================= */
const keys = {};        // by e.code
const hit = {};         // pressed this frame (edge)
const BIND = [
  { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], dash: ['Space'], ult: ['KeyE', 'KeyQ'] },
  { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], dash: ['Enter', 'NumpadEnter', 'Slash', 'Numpad0'], ult: ['ShiftRight', 'Period', 'ControlRight', 'NumpadDecimal'] },
];
const PADS = { prev: [] };
function padFor(i) {
  const pads = [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter(Boolean);

  if (run.online) return i === 0 ? pads[0] || null : null;
  if (pads.length >= 2) return pads[i];
  return i === 1 ? pads[0] || null : null; // one pad in co-op: player 2 uses it, player 1 the keyboard
}

  const b = BIND[i], solo = !run || !run.coop, any = l => l.some(k => keys[k]), tap = l => l.some(k => hit[k]);

    const bt = n => p.buttons[n] && p.buttons[n].pressed, prev = PADS.prev[p.index] || [];
    if (bt(14)) mx--; if (bt(15)) mx++; if (bt(12)) my--; if (bt(13)) my++;
    const edge = n => bt(n) && !prev[n];
    dash = dash || edge(0) || edge(5); ult = ult || edge(1) || edge(2) || edge(3) || edge(7);

  const R = id => r.relics.includes(id);
  if (R('glass')) { s.might += .4; s.maxHp *= .7; }
  if (R('boots')) s.dashCd *= .6;
  if (R('coin')) { s.goldMul += .25; s.luck += .1; }
  if (R('core')) s.magnet *= 2;
  if (R('crown')) s.xpMul *= 1.4;
  if (R('clover')) s.luck += .1;
  if (R('overclock')) s.cdMul *= .85;
  if (R('chrono')) s.chill += .12;
  if (R('heart')) s.maxHp += 40;
  if (R('twin')) s.proj += 1;
  if (R('dice')) s.crit += .15;
  if (R('battery')) s.ultMul *= 1.35;
  if (R('bond') && r.players.length === 1) s.might += .1;
  // element sets
  const L = el => setLevel(r, i, el);
  if (L('blade') >= 2) s.crit += .1; if (L('blade') >= 4) s.critMul = 3;
  if (L('arcane') >= 2) s.proj += 1; if (L('arcane') >= 4) s.ultMul *= 1.5;
  if (L('fire') >= 4) s.fireMul = 1.3;
  s.crit += s.luck * .3;

}

function addRelic(id) {
  if (run.relics.includes(id)) return;
  const before = run.players.map((_, i) => calcStats(run, i).maxHp);
  run.relics.push(id);

/* ================= RIFT DOORS (what comes next) ================= */
function makeDoors() {
  if (run.room >= ROOMS_PER_ACT) return [{ t: 'boss', o: 'boss' }];
  const r = run.room, n = (rnd() < .3 + calcStats(run, 0).luck * .5) ? 3 : 2, out = [];
  const pool = () => [{ t: 'fight', w: 22 }, { t: 'level', w: 16 }, { t: 'gold', w: 12 }, { t: 'elite', w: r >= 2 ? 12 : 0 }, { t: 'shop', w: r >= 2 && run.shops < 2 ? 12 : 0 },
    { t: 'heal', w: 9 }, { t: 'event', w: r >= 1 ? 10 : 0 }, { t: 'squad', w: r >= 1 ? 15 : 0 }, { t: 'casino', w: r >= 1 && !run.casinos ? 7 : 0 }, { t: 'treasure', w: r >= 3 ? 4 : 0 }, { t: 'rest', w: r >= 4 ? 7 : 0 }].filter(o => o.w && !out.some(d => d.t === o.t));
  if (r === 0) out.push({ t: 'fight' }, { t: 'level' });
  else { if (r === 5 && !run.shops) out.push({ t: 'shop' }); while (out.length < n) out.push({ t: weighted(pool()).t }); }
  out.forEach(d => { if (['fight', 'level', 'gold', 'heal'].includes(d.t)) d.o = r === 0 ? 'survive' : weighted([{ k: 'survive', w: 26 }, { k: 'hunt', w: 18 }, { k: 'defend', w: 16 }, { k: 'capture', w: 16 }, { k: 'collect', w: 16 }]).k; else if (d.t === 'elite') d.o = 'survive'; });
  return out;
}
function enterDoor(d) {
  sfx('door');
  run.cur = d; run.doors = null;
  if (!['fight', 'level', 'gold', 'heal', 'elite', 'boss'].includes(d.t)) { paused = true; bankHp(); }
  if (d.t === 'shop') { run.shops++; showShop(); }
  else if (d.t === 'squad') startSkirmish();
  else if (d.t === 'casino') { run.casinos = (run.casinos || 0) + 1; showCasino(); }
  else if (d.t === 'event') showEvent();
  else if (d.t === 'treasure') showTreasure();
  else if (d.t === 'rest') showRest();
  else startRoom(d);
}
// a room is done: bank HP, count it, open new doors
function roomDone(msg) {

/* ================= LEVEL UPS (co-op: both players pick side by side) ================= */

}
function buildChoices(i) {

    else if (w.lvl < 5) opts.push({ k: 'wup', id: w.id, w: 10 });
  }
  if (nW < 5) for (const id in WEAPONS) if (!pl.weapons.some(w => w.id === id)) {
    const el = WEAPONS[id].el, owned = pl.weapons.filter(w => WEAPONS[w.id].el === el).length;
    opts.push({ k: 'wnew', id, w: (nW < 3 ? 7 : 4) * (owned ? 1.5 : 1) }); // matching your elements shows up a bit more often
  }
  for (const id in PASSIVES) { const l = pl.passives[id] || 0; if (l > 0 && l < PASSIVES[id].max) opts.push({ k: 'pup', id, w: 7 }); else if (l === 0 && nPs < 5) opts.push({ k: 'pnew', id, w: 4 }); }

  const res = opts.filter(o => o.k === 'evo').slice(0, n);
  let rest = opts.filter(o => o.k !== 'evo');
  while (res.length < n && rest.length) { const o = weighted(rest); res.push(o); rest = rest.filter(x => x !== o); }
  if (!res.length) res.push({ k: 'heal' }, { k: 'gold' });

}
function choiceDesc(o, i = 0) {

  if (o.k === 'wup') { const w = pl.weapons.find(x => x.id === o.id), d = WEAPONS[o.id]; return { icon: d.icon, title: d.name, sub: `Level ${w.lvl} → ${w.lvl + 1}`, desc: w.lvl + 1 === 5 ? `Max level! Pair with ${PASSIVES[d.evo].icon} ${PASSIVES[d.evo].name} to evolve.` : 'More damage, faster, bigger.', cls: '' }; }
  if (o.k === 'wnew') { const d = WEAPONS[o.id], E = ELEMENTS[d.el], n = pl.weapons.filter(w => WEAPONS[w.id].el === d.el).length + (run.relics.includes('prism') ? 1 : 0);
    return { icon: d.icon, title: d.name, sub: `New weapon · ${E.icon} ${E.name}`, desc: d.desc + (n === 1 ? `<br><small style="color:${E.color}">Completes a ${E.name} set (2)!</small>` : n === 3 ? `<br><small style="color:${E.color}">Completes a ${E.name} set (4)!</small>` : ''), cls: 'new' }; }
  if (o.k === 'pup' || o.k === 'pnew') { const d = PASSIVES[o.id], l = pl.passives[o.id] || 0; const ev = Object.values(WEAPONS).find(w => w.evo === o.id); return { icon: d.icon, title: d.name, sub: l ? `Level ${l} → ${l + 1}` : 'New passive', desc: d.desc + (ev ? ` <br><small>(evolves ${ev.icon})</small>` : ''), cls: l ? '' : 'new' }; }
  if (o.k === 'relic') { const d = RELICS[o.id]; return { icon: d.icon, title: d.name, sub: 'Relic', desc: d.desc, cls: 'relic' }; }
  if (o.k === 'heal') return { icon: '❤️', title: o.price ? 'Potion' : 'Heal', sub: 'Heal', desc: o.price ? 'Everyone heals 40% of max HP.' : 'Heal 30 HP.', cls: '' };

function applyChoice(o, i = 0) {

  else if (o.k === 'wup') pl.weapons.find(x => x.id === o.id).lvl++;
  else if (o.k === 'wnew') { pl.weapons.push({ id: o.id, lvl: 1, evo: false }); const el = WEAPONS[o.id].el, L = setLevel(run, i, el); if (L) { toast(`${ELEMENTS[el].icon} ${ELEMENTS[el].name} set (${L})!`, ELEMENTS[el].color); if (L >= 4) S.stats.set4++; } }

/* ----- combat helpers ----- */

function shoot(x, y, a, spd, r, dmg, pierce, life, color, extra) { G.projs.push(Object.assign({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r, dmg, pierce, life, color, hits: new Set(), kind: 'bolt', own: P.i, el: extra && extra.el }, extra)); }

    sfx('shoot', 90);

    const rad = (60 + 6 * L) * ST.area * (w.evo ? 1.35 : 1), br = 9 * Math.sqrt(ST.area) * (w.evo ? 1.3 : 1);
    w.ang = (w.ang || 0) + dt * (3 + .15 * L) * (w.evo ? 1.4 : 1);

  bomb(w, dt) {

    for (let i = 0; i < n; i++) { const aa = a + (i - (n - 1) / 2) * .5; shoot(P.x, P.y, aa, 400, 11 * Math.sqrt(ST.area) * (w.evo ? 1.4 : 1), wDmg(12 + 5 * L) * (w.evo ? 1.5 : 1), 1e9, 3, '#e0b070', { kind: 'boom', bt: 0, ba: aa, spd: 400, el: 'blade' }); }

  const b = [BIND[0], BIND[1]], any = l => l.some(k => keys[k]), tap = l => l.some(k => hit[k]);
  let mx = 0, my = 0; for (const B of b) { if (any(B.left)) mx--; if (any(B.right)) mx++; if (any(B.up)) my--; if (any(B.down)) my++; if (tap(B.dash)) NET.acc.dash = true; if (tap(B.ult)) NET.acc.ult = true; }
  const p = [...(navigator.getGamepads ? navigator.getGamepads() : [])].filter(Boolean)[0];
  if (p) { const ax = p.axes[0] || 0, ay = p.axes[1] || 0; if (Math.hypot(ax, ay) > .25) { mx += ax; my += ay; } const prev = PADS.prev[p.index] || [], e = n => p.buttons[n] && p.buttons[n].pressed && !prev[n]; if (e(0) || e(5)) NET.acc.dash = true; if (e(1) || e(2) || e(3) || e(7)) NET.acc.ult = true; }
  NET.sendT -= dt; if (NET.sendT <= 0) { NET.sendT = .033; const l = Math.hypot(mx, my) || 1; netSend({ t: 'in', mx: +(mx / Math.max(1, l)).toFixed(2), my: +(my / Math.max(1, l)).toFixed(2), dash: NET.acc.dash, ult: NET.acc.ult }); NET.acc = { dash: false, ult: false }; }
}

/* ================= INPUT & LOOP ================= */
addEventListener('keydown', e => {
  const tag = e.target && e.target.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') return;
  audioOn();
  const k = e.key.toLowerCase();
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code) || (mode === 'fight' && ui.className === 'hidden' && ['Enter', 'Slash', 'Period', 'Backspace'].includes(e.code))) e.preventDefault();
  keys[e.code] = true; if (!e.repeat) hit[e.code] = true;
  if (e.code === 'KeyM' && !e.repeat) { S.opt.vol = S.opt.vol ? 0 : .7; setVol(); save(); toast(S.opt.vol ? '🔊 Sound on' : '🔇 Muted'); }
  if (mode === 'fight' && !paused && ui.className === 'hidden') {
    if ((e.code === 'Escape' || e.code === 'KeyP') && !e.repeat) pauseMenu();
    if (G && G.phase === 'doors' && /^[1-3]$/.test(k) && !e.repeat && !(run.online && NET.role === 'guest')) { const d = G.doors[+k - 1]; if (d) { G.doors = []; enterDoor(d.d); } }
    if (G && G.phase === 'doors' && e.code === 'KeyT' && !e.repeat && !(run.online && NET.role === 'guest')) { paused = true; bankHp(); openSquad('manage'); }
    return;
  }
  if (ui.className === 'hidden' || e.repeat && !k.startsWith('arrow')) return;
  if (performance.now() < inputLock) return;
  if (keyHook && keyHook(k) === true) return;
  if (/^[1-9]$/.test(k)) { const b = ui.querySelector(`button[data-n="${k}"]:not([disabled])`); if (b) { b.focus({ preventScroll: true }); b.click(); } return; }
  if (k.startsWith('arrow')) {
    const bs = [...ui.querySelectorAll('button:not([disabled])')]; if (!bs.length) return;
    let i = bs.indexOf(document.activeElement);
    i = (k === 'arrowup' || k === 'arrowleft') ? (i <= 0 ? bs.length - 1 : i - 1) : (i + 1) % bs.length;
    bs[i].focus(); return;
  }
  if (k === 'enter') { e.preventDefault(); const b = document.activeElement; if (b && b.tagName === 'BUTTON' && ui.contains(b) && !b.disabled) b.click(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('mousedown', audioOn);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (mode === 'fight' && !paused && !run.online) pauseMenu(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'fight' && !paused && run && !run.online) pauseMenu(); });

let last = performance.now(), saveTimer = 0, snapT = 0;
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  S.stats.playTime += dt;
  saveTimer += dt; if (saveTimer > 20) { saveTimer = 0; if (mode !== 'fight') save(); }
  try {
    if (NET.role === 'guest') { if (G && G.remote && run) { guestTick(dt); render(); } else renderMenuBg(dt); }
    else if ((mode === 'fight' || mode === 'dead') && G) {
      if (!paused && mode === 'fight') update(dt); else if (mode === 'dead') { for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.t -= dt; } }
      if (G) render(); else renderMenuBg(dt);
      if (run && run.online && NET.role === 'host' && NET.ok && G) { snapT -= dt; if (snapT <= 0) { snapT = .05; netSend(netSnap()); } }
    } else renderMenuBg(dt);
    padMenuNav(); musicTick();
  } catch (err) { console.error(err); }
  endFrameInput();
  requestAnimationFrame(loop);
}
showTitle();
requestAnimationFrame(loop);
</script>
